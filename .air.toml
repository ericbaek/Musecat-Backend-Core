root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/main ."
  bin = "tmp/main serve"
  include_ext = ["go", "yaml", "yml", "html"]
  exclude_dir = ["tmp", "vendor", "pb_data", "testdata", ".git"]
  exclude_regex = ["_test.go"]
  delay = 500

  # 깔끔한 재시작을 위해 추가
  send_interrupt = true
  kill_delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true