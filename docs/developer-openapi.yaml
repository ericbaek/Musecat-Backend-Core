          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              properties:
                token:
