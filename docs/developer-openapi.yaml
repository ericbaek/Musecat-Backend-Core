---
openapi: 3.1.0
info:
  title: Musecat Developer API
  version: 1.0.0
  description: 'One connection with account:access for the explicit general-user API allowlist. Management and account-security operations excluded even for staff. Feature-branch contract; development URL and credentials supplied separately. Read /developer/guide.md.'
servers:
- url: "/"
  description: This deployment
tags:
- name: OAuth delegation
- name: Delegated resources
- name: Connected account
  description: General user features; management excluded.
components:
  securitySchemes:
    delegatedOAuth:
      type: oauth2
      description: Musecat-issued opaque delegation tokens. Session JWTs are never
        accepted on developer resources. Use server metadata for deployed endpoint
        URLs.
      flows:
        authorizationCode:
          authorizationUrl: "/oauth/authorize"
          tokenUrl: "/oauth/token"
          refreshUrl: "/oauth/token"
          scopes:
            openid: Sign in with Musecat (opt-in application)
            profile: Read basic OpenID profile
            account:access: General user features on behalf of the account; management and account-security operations excluded
            profile:read: Read your basic profile
            arcade:read: Read public arcade information
            arcade:report:create: Create fault reports
            arcade:report:react: React to fault reports
            campaign:read: Read campaigns
            campaign:respond: Submit campaign responses
    oauthClientBasic:
      type: http
      scheme: basic
      description: Registered confidential OAuth client credentials; never a user
        password.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CountryQuery:
      name: country
      in: query
      description: Country code stored in `arcade.country`.
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      description: Positive integer limit. Endpoint-specific caps apply.
      schema:
        type: integer
        minimum: 1
    UserIdQuery:
      name: id
      in: query
      description: Target record id.
      schema:
        type: string
    UsernameQuery:
      name: username
      in: query
      description: Target username.
      schema:
        type: string
  schemas:
    ArcadeSummaryPage:
      type: object
      required:
      - page
      - per_page
      - last_page
      - total
      - items
      properties:
        page:
          type: integer
        per_page:
          type: integer
        last_page:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeSummary"
    ArcadeSummary:
      type: object
      required:
      - id
      - country
      - game_series
      - updated
      properties:
        updated:
          type: string
          format: date-time
          description: Persisted arcade aggregate update time; cache rebuilds do not
            change it.
        id:
          type: string
        country:
          type: string
        name:
          type: string
        address:
          type: string
        location:
          "$ref": "#/components/schemas/Location"
        game_series:
          type: array
          items:
            type: string
    Location:
      type: object
      required:
      - lat
      - lon
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        details:
          type: string
        code:
          type: string
    ArcadeValueResponse:
      type: object
      required:
      - admin
      - basic
      - hour
      - sns
      - gtk
      - game
      - photo
      properties:
        admin:
          "$ref": "#/components/schemas/ArcadeAdminSummary"
        basic:
          "$ref": "#/components/schemas/ArcadeBasicValue"
        hour:
          "$ref": "#/components/schemas/ArcadeHourValue"
        sns:
          "$ref": "#/components/schemas/ArcadeSnsValue"
        gtk:
          "$ref": "#/components/schemas/ArcadeGtkValue"
        game:
          "$ref": "#/components/schemas/ArcadeGameValue"
        photo:
          "$ref": "#/components/schemas/ArcadePhotoValue"
    ArcadeAdminSummary:
      type: object
      required:
      - id
      - public
      - closed
      - country
      - timezone
      - createdBy
      - created
      - updated
      properties:
        id:
          type: string
        public:
          type: boolean
        closed:
          type: boolean
        country:
          type: string
        timezone:
          type: string
        createdBy:
          type: string
        officialAccountIds:
          type: array
          items:
            type: string
          description: Non-withdrawn arcade_owner accounts whose owns relation includes
            this arcade. Ordered by creation date and ID.
        created:
          type: string
        updated:
          type: string
    ArcadeBasicValue:
      oneOf:
      - type: string
      - type: 'null'
      - "$ref": "#/components/schemas/ArcadeBasicExpanded"
    ArcadeBasicExpanded:
      type: object
      required:
      - id
      - name
      - address
      - direction
      - nickname
      - subway_line
      - location
      properties:
        city_id:
          type: string
        id:
          type: string
        name:
          type: string
        address:
          type: string
        direction:
          type: string
        nickname:
          type: array
          items:
            type: string
        subway_line:
          type: array
          items:
            type: string
        location:
          "$ref": "#/components/schemas/Location"
    ArcadeHourValue:
      oneOf:
      - type: string
      - type: 'null'
      - "$ref": "#/components/schemas/ArcadeHourExpanded"
    ArcadeHourExpanded:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        Monday:
          "$ref": "#/components/schemas/DayHoursValue"
        Tuesday:
          "$ref": "#/components/schemas/DayHoursValue"
        Wednesday:
          "$ref": "#/components/schemas/DayHoursValue"
        Thursday:
          "$ref": "#/components/schemas/DayHoursValue"
        Friday:
          "$ref": "#/components/schemas/DayHoursValue"
        Saturday:
          "$ref": "#/components/schemas/DayHoursValue"
        Sunday:
          "$ref": "#/components/schemas/DayHoursValue"
        Note:
          type: string
    DayHoursValue:
      oneOf:
      - "$ref": "#/components/schemas/DayHoursObject"
      - type: integer
        const: 499
        description: Closed marker.
      - type: 'null'
        description: Unknown or unset.
      description: |
        Weekly opening hours value. Use `499` for closed, `null` for unknown, or an object with
        `start` and `end` HHMM values.
    DayHoursObject:
      type: object
      required:
      - start
      - end
      properties:
        start:
          type: integer
          minimum: 0
          maximum: 2359
          description: HHMM integer.
        end:
          type: integer
          minimum: 0
          maximum: 2400
          description: HHMM integer. `2400` is only valid for 24-hour operation.
    ArcadeSnsValue:
      oneOf:
      - type: string
      - type: 'null'
      - "$ref": "#/components/schemas/ArcadeSnsExpanded"
    ArcadeSnsExpanded:
      type: object
      required:
      - id
      - items
      properties:
        id:
          type: string
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeSnsItem"
    ArcadeSnsItem:
      type: object
      required:
      - type
      - link
      properties:
        type:
          type: string
        link:
          type: string
        name:
          type: string
    ArcadeGtkValue:
      oneOf:
      - type: string
      - type: 'null'
      - "$ref": "#/components/schemas/ArcadeGtkExpanded"
    ArcadeGtkExpanded:
      type: object
      required:
      - id
      - items
      properties:
        id:
          type: string
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeGtkItem"
    ArcadeGtkItem:
      type: object
      required:
      - type
      - bool
      properties:
        type:
          "$ref": "#/components/schemas/ArcadeGtkType"
        bool:
          type: boolean
        note:
          type: string
        meta:
          "$ref": "#/components/schemas/ParkingMeta"
    ArcadeGtkType:
      type: string
      enum:
      - Basket
      - FreeGloves
      - FreeSlipper
      - FreeWater
      - FreeDrumStick
      - FreeBachi
      - FreeWifi
      - Locker
      - Toilet
      - SmokingRoom
      - AC
      - Fan
      - Refrigerator
      - PowerOutlet
      - SellGloves
      - SellDrumStick
      - SellBachi
      - SellSlipper
      - SellDrink
      - SellFood
      - SellAmusementIC
      - SellAMPASS
      - Parking
      - ATM
      - SeatingArea
    ParkingMeta:
      type: object
      additionalProperties: false
      properties:
        geo:
          "$ref": "#/components/schemas/ParkingGeo"
        availability:
          type: string
          enum:
          - always_plenty
          - somewhat_plenty
          - somewhat_difficult
          - difficult
        options:
          type: array
          items:
            type: string
            enum:
            - free_parking_lot
            - paid_parking_lot
            - free_street_parking
            - paid_street_parking
        ev_charging:
          type: boolean
        gov_parking:
          type: boolean
    ParkingGeo:
      type: object
      required:
      - lat
      - lon
      properties:
        lat:
          type: number
        lon:
          type: number
    ArcadeGameValue:
      oneOf:
      - type: string
      - type: 'null'
      - "$ref": "#/components/schemas/ArcadeGameExpanded"
    ArcadeGameExpanded:
      type: object
      required:
      - id
      - state_id
      - items
      properties:
        id:
          type: string
        state_id:
          type: string
          description: Current immutable state batch id. This wire name is retained
            alongside `id`.
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeGameItem"
        orphanFlags:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeFlagExpanded"
    ArcadeGameItem:
      type: object
      additionalProperties: true
      required:
      - id
      - updated
      properties:
        arcade:
          oneOf:
          - "$ref": "#/components/schemas/ArcadeGameArcade"
          - type: 'null'
        game:
          type: string
        version:
          oneOf:
          - "$ref": "#/components/schemas/ArcadeGameVersion"
          - type: 'null'
        series:
          oneOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        cabinet:
          oneOf:
          - "$ref": "#/components/schemas/ArcadeGameCabinet"
          - type: string
          - type: 'null'
          description: |
            `GET /arcade` and expanded nearby game items return the catalog
            object. `GET /arcade/games` retains the canonical ID string.
            Unverified revisions return null in expanded game responses.
        location:
          type: string
        quantity:
          type: integer
        price:
          oneOf:
          - type: object
            additionalProperties: true
          - type: string
          - type: integer
          - type: number
          - type: 'null'
        tag:
          oneOf:
          - type: array
            items:
              type: object
              additionalProperties: true
          - type: 'null'
        id:
          type: string
        updated:
          type: string
          description: Last time this specific game atom was edited.
        flags:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeFlagExpanded"
    ArcadeGameArcade:
      type: object
      required:
      - id
      - country
      - name
      - address
      - location
      properties:
        id:
          type: string
        country:
          type: string
        name:
          type: string
        address:
          type: string
        location:
          "$ref": "#/components/schemas/Location"
    ArcadeGameVersion:
      type: object
      required:
      - id
      - series
      - released_on
      - en
      - kr
      - jp
      - price_default
      properties:
        id:
          type: string
        series:
          oneOf:
          - type: string
          - type: 'null'
        released_on:
          oneOf:
          - type: string
          - type: 'null'
        en:
          type: string
        kr:
          type: string
        jp:
          type: string
        price_default:
          oneOf:
          - type: object
            additionalProperties: true
          - type: string
          - type: integer
          - type: number
          - type: 'null'
    ArcadeGameCabinet:
      type: object
      required:
      - id
      - en
      - kr
      - jp
      properties:
        id:
          type: string
          description: Canonical `game_cabinet` record ID.
        en:
          type: string
        kr:
          type: string
        jp:
          type: string
    ArcadeFlagExpanded:
      type: object
      required:
      - id
      - arcade
      - disruption
      - solved
      - message
      - photos
      - createdBy
      - created
      - updated
      - reactions
      - resolution
      - reportHistory
      description: Open flag payload returned under game items or orphan flag lists.
      properties:
        id:
          type: string
        arcade:
          type: string
        disruption:
          type: string
        solved:
          type: boolean
        message:
          type: string
        photos:
          type: array
          items:
            type: string
        createdBy:
          type: string
        created:
          type: string
        updated:
          type: string
        reactions:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeFlagReaction"
        resolution:
          "$ref": "#/components/schemas/ArcadeFlagResolution"
        reportHistory:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeFlagReportHistoryItem"
        canWithdraw:
          type: boolean
          description: Whether the authenticated flag creator may withdraw this unresolved
            flag now.
    ArcadeFlagReaction:
      type: object
      required:
      - id
      - reaction
      - createdBy
      - created
      - updated
      properties:
        id:
          type: string
        reaction:
          type: string
        createdBy:
          type: string
        created:
          type: string
        updated:
          type: string
        resolutionContext:
          type: string
          enum:
          - legacy
          - report
          - vote
          description: Legacy history, pre-vote report history, or current resolution
            vote context.
        voteRound:
          type: string
          description: Resolution round for fixed/wrong votes.
        levelSnapshot:
          type: integer
          minimum: 0
          description: Voter level captured when the current-round vote was created.
    ArcadeFlagResolution:
      type: object
      required:
      - state
      - round
      - startedAt
      - resolveAt
      - delaySeconds
      - fixedLevelTotal
      - wrongLevelTotal
      - score
      - fixedVoterCount
      - wrongVoterCount
      - myVote
      properties:
        state:
          type: string
          enum:
          - idle
          - active
        round:
          type: string
        startedAt:
          oneOf:
          - type: string
          - type: 'null'
        resolveAt:
          oneOf:
          - type: string
          - type: 'null'
        delaySeconds:
          type: integer
          minimum: 0
        fixedLevelTotal:
          type: integer
          minimum: 0
        wrongLevelTotal:
          type: integer
          minimum: 0
        score:
          type: integer
        fixedVoterCount:
          type: integer
          minimum: 0
        wrongVoterCount:
          type: integer
          minimum: 0
        myVote:
          oneOf:
          - type: string
            enum:
            - fixed
            - wrong
          - type: 'null'
        myReport:
          oneOf:
          - "$ref": "#/components/schemas/ArcadeFlagMyReport"
          - type: 'null'
    ArcadeFlagMyReport:
      type: object
      required:
      - action
      - nextAt
      properties:
        action:
          type: string
          enum:
          - add
          - delete
          - cooldown
          description: Server-authorized next action for the authenticated user's
            latest issue_persist report.
        nextAt:
          oneOf:
          - type: string
          - type: 'null'
    ArcadeFlagReportHistoryItem:
      type: object
      required:
      - id
      - kind
      - createdBy
      - created
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - initial
          - issue_persist
        createdBy:
          type: string
        created:
          type: string
    ArcadePhotoValue:
      oneOf:
      - type: string
      - type: 'null'
      - "$ref": "#/components/schemas/ArcadePhotoExpanded"
    ArcadePhotoExpanded:
      type: object
      additionalProperties: true
      description: Expanded photo molecule payload.
    ArcadesNearbyResponse:
      type: object
      required:
      - page
      - per_page
      - last_page
      - total
      - country_totals
      - items
      - campaigns
      properties:
        page:
          type: integer
        per_page:
          type: integer
        last_page:
          type: integer
        total:
          type: integer
        country_totals:
          type: object
          additionalProperties:
            type: object
            required:
            - total
            - nearest_arcade
            properties:
              total:
                type: integer
              nearest_arcade:
                type: object
                required:
                - id
                - distance_km
                properties:
                  id:
                    type: string
                  distance_km:
                    type: number
                    format: double
        items:
          type: array
          items:
            allOf:
            - "$ref": "#/components/schemas/ArcadeSummary"
            - type: object
              required:
              - distance_km
              properties:
                distance_km:
                  type: number
                  format: double
                game:
                  "$ref": "#/components/schemas/ArcadeGameValue"
                campaigns:
                  type: array
                  description: Campaigns with at least one pending target in this
                    arcade.
                  items:
                    "$ref": "#/components/schemas/NearbyArcadeCampaign"
        campaigns:
          type: array
          description: Active campaigns with pending targets in the current nearby
            response page.
          items:
            "$ref": "#/components/schemas/NearbyCampaignSummary"
    NearbyArcadeCampaign:
      type: object
      required:
      - id
      - target_count
      properties:
        id:
          type: string
        target_count:
          type: integer
          description: Number of pending target rows in this arcade for the campaign.
    NearbyCampaignSummary:
      allOf:
      - "$ref": "#/components/schemas/CampaignSummary"
      - type: object
        required:
        - nearby_target_count
        properties:
          nearby_target_count:
            type: integer
            description: Number of pending old-version target rows in public/open
              arcades included in the current nearby response page.
    CampaignSummary:
      type: object
      required:
      - id
      - from_version
      - to_version
      - cabinet_scope
      - cabinets
      - country_scope
      - countries
      - reward_exp
      - status
      - start_at
      - end_at
      - target_count
      properties:
        id:
          type: string
        from_version:
          type: object
        to_version:
          type: object
        cabinet_scope:
          type: string
          enum:
          - all
          - include
        cabinets:
          type: array
          items:
            type: object
        country_scope:
          type: string
          enum:
          - all
          - include
          - exclude
        countries:
          type: array
          items:
            type: string
        reward_exp:
          type: integer
        status:
          type: string
          enum:
          - draft
          - active
          - ended
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        target_count:
          type: integer
        remaining_count:
          type: integer
        updated_count:
          type: integer
        reported_count:
          type: integer
        still_old_count:
          type: integer
    CampaignListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CampaignSummary"
    CampaignDetailResponse:
      type: object
      required:
      - campaign
      - items
      - updated_items
      - logs
      - latest_still_old_report
      properties:
        campaign:
          "$ref": "#/components/schemas/CampaignSummary"
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CampaignTarget"
        updated_items:
          type: array
          items:
            "$ref": "#/components/schemas/CampaignTarget"
        logs:
          type: array
          items:
            "$ref": "#/components/schemas/CampaignReport"
        latest_still_old_report:
          allOf:
          - "$ref": "#/components/schemas/CampaignReport"
          nullable: true
    CampaignTarget:
      type: object
      required:
      - arcade
      - game
      - status
      properties:
        status:
          type: string
          enum:
          - pending
          - still_old
          - updated
        can_revert:
          type: boolean
          description: Whether the latest updated report can be reverted within seven
            days.
        reports:
          type: array
          description: Reports for this arcade and game, newest first, including reporter
            and location-verification status.
          items:
            "$ref": "#/components/schemas/CampaignReportSummary"
        arcade:
          type: object
          required:
          - id
          - country
          - name
          - address
          - location
          properties:
            id:
              type: string
            country:
              type: string
            name:
              type: string
            address:
              type: string
            location:
              type: object
        game:
          type: object
          required:
          - id
          - state_id
          - version
          - series
          - cabinet
          - location
          - quantity
          properties:
            id:
              type: string
            state_id:
              type: string
            version:
              type: object
            series:
              type: object
            cabinet:
              type: object
              nullable: true
            location:
              type: string
            quantity:
              type: integer
        last_still_old_report:
          "$ref": "#/components/schemas/CampaignReportSummary"
        updated_report:
          "$ref": "#/components/schemas/CampaignReportSummary"
    CampaignReportSummary:
      type: object
      required:
      - id
      - reported_at
      - reaction
      - location_verified
      - user
      properties:
        id:
          type: string
        reported_at:
          type: string
          format: date-time
        reaction:
          type: string
          enum:
          - still_old
          - updated
        location_verified:
          type: boolean
        user:
          "$ref": "#/components/schemas/CampaignReporter"
    CampaignReporter:
      type: object
      required:
      - id
      - username
      - nickname
      - primary_country
      - level
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        primary_country:
          type: string
        level:
          type: integer
    CampaignReport:
      type: object
      required:
      - id
      - created
      - updated
      - reported_at
      - reaction
      - result
      - location_verified
      - user
      - arcade
      - game
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        reported_at:
          type: string
          format: date-time
        reaction:
          type: string
          enum:
          - still_old
          - updated
        result:
          type: string
          enum:
          - still_old
          - updated
        location_verified:
          type: boolean
        user:
          "$ref": "#/components/schemas/CampaignReporter"
        arcade:
          type: object
        game:
          type: object
    ArcadeCampaignListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ArcadeCampaignListItem"
    ArcadeCampaignListItem:
      type: object
      required:
      - campaign
      - target
      properties:
        campaign:
          "$ref": "#/components/schemas/CampaignSummary"
        target:
          "$ref": "#/components/schemas/CampaignTarget"
    CreateArcadeFlagRequest:
      type: object
      required:
      - arcade
      - game_id
      - disruption
      - message
      properties:
        arcade:
          type: string
        game_id:
          type: string
          description: Stable active `arcade_game_id` id.
        disruption:
          type: string
          enum:
          - unplayable
          - major
          - bearable
          - minor
        message:
          type: string
    XpFeedback:
      type: object
      description: XP is awarded only when the authenticated user's account has a
        non-empty username. Before username setup, XP feedback reports no XP change.
      required:
      - previous_exp
      - new_exp
      - diff_exp
      - previous_percent_to_next_level
      - new_percent_to_next_level
      - previous_level
      - new_level
      - level_diff
      - remaining_exp_to_next_level
      - remaining_percent_to_next_level
      properties:
        previous_exp:
          type: integer
        new_exp:
          type: integer
        diff_exp:
          type: integer
        previous_percent_to_next_level:
          type: integer
          description: Progress percentage before the change. Use `100 - remaining_percent_to_next_level`
            semantics.
        new_percent_to_next_level:
          type: integer
          description: Progress percentage after the change. Use `100 - remaining_percent_to_next_level`
            semantics.
        previous_level:
          type: integer
        new_level:
          type: integer
        level_diff:
          type: integer
        remaining_exp_to_next_level:
          type: integer
        remaining_percent_to_next_level:
          type: integer
          description: Percent remaining to the next level. Use `100 - remaining_percent_to_next_level`
            for progress fill.
