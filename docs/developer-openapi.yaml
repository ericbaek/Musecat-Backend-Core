          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Not the author, withdrawn, or banned.
        '404':
          description: Post not found.
        '409':
          description: Five-minute edit window has closed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to update post.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
