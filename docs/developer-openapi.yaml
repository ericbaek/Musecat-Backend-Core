          description: Edit report queued for manual review. This endpoint does not
            roll back or ban automatically.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeEditReport"
        '400':
          description: Invalid parent id, message, or urgency.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '404':
          description: Arcade/changelog mismatch or inaccessible private arcade.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: An unresolved report already exists for this changelog.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
