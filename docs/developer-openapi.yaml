paths:
  /developer/sign-in-with-musecat.md:
    get:
      tags: [OAuth delegation]
      summary: Sign in with Musecat integration guide and runnable partner example
      responses:
        '200': {description: Markdown guide, content: {text/markdown: {schema: {type: string}}}}
  /.well-known/openid-configuration:
    get:
      tags: [OAuth delegation]
      summary: Discover Sign in with Musecat endpoints and RS256 profile
      responses:
        '200': {description: OIDC discovery with issuer, authorization/token/userinfo endpoints, jwks_uri, pairwise subjects and RS256. Cache-Control no-store., content: {application/json: {schema: {type: object}}}}
        '503': {description: OAuth or OIDC signing keys are not configured.}
  /oauth/jwks:
    get:
      tags: [OAuth delegation]
      summary: Public RSA signing keys for Musecat ID tokens
      responses:
        '200': {description: Public JWK Set. Private key fields are never included., content: {application/json: {schema: {type: object, required: [keys], properties: {keys: {type: array, items: {type: object, required: [kty, use, alg, kid, n, e]}}}}}}}
        '503': {description: OIDC signing keys are not configured.}
  /oauth/userinfo:
    get:
      tags: [OAuth delegation]
      security: [{delegatedOAuth: [openid]}]
      summary: Verified login identity and approved basic profile
      description: Requires an opaque bearer access token with explicitly granted openid scope. Returns app-specific sub and, only with profile, preferred_username and nickname. No email or global user id. Live revocation and account restrictions apply. No query parameters or body allowed. Cache-Control no-store.
      responses:
        '200': {description: UserInfo, content: {application/json: {schema: {type: object, required: [sub], properties: {sub: {type: string}, preferred_username: {type: string}, nickname: {type: string}}}}}}
        '400': {description: Invalid request.}
        '401': {description: Invalid, expired or revoked bearer token.}
        '403': {description: Missing explicit openid scope.}
    post:
      tags: [OAuth delegation]
      security: [{delegatedOAuth: [openid]}]
      summary: Read UserInfo with an empty POST and bearer Authorization header
      responses:
        '200': {description: Same UserInfo as GET. Cache-Control no-store.}
        '400': {description: Query or non-empty body is not accepted.}
        '401': {description: Invalid or revoked token.}
        '403': {description: Missing explicit openid scope.}
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - OAuth delegation
      summary: Discover the configured OAuth endpoints and supported capabilities
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request or invalid grant.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '401':
          description: Invalid session, client or delegated token.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '403':
          description: Restricted user or insufficient scope.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '429':
          description: Rate limited.
        '503':
          description: OAuth is not configured.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
  /oauth/authorize:
    get:
      description: Authorization Code with PKCE S256. OpenID requests additionally require nonce (16-512 non-whitespace characters) and an application approved for login. The readonly login bundle is openid profile arcade:read. Optional response_mode must be query. Unsupported authorization parameters are rejected.
      tags:
      - OAuth delegation
      summary: Start authorization and redirect to the Musecat consent application
      responses:
        '400':
          description: Invalid request or invalid grant.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '401':
          description: Invalid session, client or delegated token.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '403':
          description: Restricted user or insufficient scope.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '429':
          description: Rate limited.
        '503':
          description: OAuth is not configured.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '302':
          description: Consent-page redirect, or a protocol error redirected only to the registered callback. Invalid clients, callbacks and ambiguous input remain local errors.
          headers:
            Location:
              schema:
                type: string
                format: uri
      parameters:
      - name: nonce
        in: query
        description: Required for openid. Random value bound to the partner login session and returned unchanged in the ID token.
        schema: {type: string, minLength: 16, maxLength: 512}
      - name: response_mode
        in: query
        schema: {type: string, enum: [query]}
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          format: uri
          type: string
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - code
      - name: scope
        in: query
        required: false
        schema:
          description: 'Space-separated registered scopes. Send openid profile arcade:read for login or account:access for general delegation. Omitted/empty defaults to account:access only if registered for that client; otherwise invalid_scope.'
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
          enum:
          - S256
  /oauth/consent:
    get:
      tags:
      - OAuth delegation
      summary: Read and bind the pending request to the current Musecat session
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - client_id
                - name
                - description
                - requested_scopes
                - expires_at
                properties:
                  client_id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  requested_scopes:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - description
                      properties:
                        id:
                          type: string
                        description:
                          type: string
        '400':
          description: Invalid request or invalid grant.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '401':
          description: Invalid session, client or delegated token.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '403':
          description: Restricted user or insufficient scope.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '429':
          description: Rate limited.
        '503':
          description: OAuth is not configured.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
      parameters:
      - name: request
        in: query
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
    post:
      tags:
      - OAuth delegation
      summary: Approve selected permissions or deny the request
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - redirect_uri
                properties:
                  redirect_uri:
                    type: string
                    format: uri
        '400':
          description: Invalid request or invalid grant.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '401':
          description: Invalid session, client or delegated token.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '403':
          description: Restricted user or insufficient scope.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        '429':
          description: Rate limited.
        '503':
          description: OAuth is not configured.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request
              - approve
              properties:
                request:
                  type: string
                approve:
                  type: boolean
                scopes:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
      description: Musecat UI/BFF only. Requires a prior consent read and the same
        user session. Approve a nonempty subset; denial does not replace existing
        consent. Do not forward a caller-selected callback URI.
      security:
      - bearerAuth: []
  /oauth/token:
    post:
      tags:
      - OAuth delegation
      summary: Exchange a one-use PKCE authorization code or rotate a refresh token
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - refresh_token
                - token_type
                - expires_in
                - scope
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                  expires_in:
                    type: integer
                    maximum: 600
                  id_token:
                    type: string
