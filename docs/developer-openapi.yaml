      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - series
              - series_public
              properties:
                series:
                  type: array
                  items:
                    type: string
                series_public:
                  type: boolean
                warp:
                  type: boolean
                  description: Omit to retain the current value.
      responses:
        '200':
          description: Saved preferences with duplicate and blank series IDs removed.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - series
                - series_public
                - warp
                properties:
                  success:
                    type: boolean
                  series:
                    type: array
                    items:
                      type: string
                  series_public:
                    type: boolean
                  warp:
                    type: boolean
        '400':
          description: Invalid preferences or unknown game series.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Inactive user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: Missing user_info record.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Storage failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
