      description: |-
        Requires account:access. Same payload, response and domain checks as POST /arcade/edit_report. Management operations are excluded even for staff.

        Creates an independent abuse report linked to one immutable changelog row. The server derives the reported editor; unresolved duplicates for the same arcade/changelog return `409`.
      security:
