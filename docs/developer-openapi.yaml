  /developer/v1/arcades:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/arcades
      description: Delegated access requires arcade:read. Existing domain visibility,
        role, ownership, location and XP rules still apply. Returns operating public
        arcades only. Public closed arcades are deliberately excluded and remain available
        through detail/search.
      parameters:
      - name: public
        in: query
        schema:
          type: boolean
        description: "`false` is rejected; this parameter exists only for explicit
          v2 compatibility diagnostics."
      - name: closed
        in: query
        schema:
          type: boolean
        description: "`true` is rejected; `/arcades` is an operating-discovery endpoint."
      - "$ref": "#/components/parameters/CountryQuery"
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Page of operating public arcade summaries.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeSummaryPage"
              example:
                page: 1
                per_page: 50
                last_page: 1
                total: 1
                items:
                - id: arcade_123
                  country: AU
                  name: Sydney Arcade
                  address: 123 George St, Sydney NSW
                  location:
                    lat: -33.8708
                    lon: 151.2062
                  game_series:
                  - series_1
                  - series_2
        '400':
          description: Invalid boolean filter.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Database lookup failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - arcade:read
  /developer/v1/arcade:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/arcade
      description: |
        Delegated access requires arcade:read. Existing domain visibility, role, ownership, location and XP rules still apply. Returns only a public arcade (open or closed) and relation ids by default.
        Private arcades always return `404`; use authenticated `GET /arcade/draft` for a creator or developer/moderator draft read.
        When `expand=game`, each `game.items[]` entry includes `version`, `series`, `updated`, and the editable game fields.
        Unauthenticated callers receive redacted sensitive data: `tag` is null, `location` and `updated` are empty strings, `price` retains only representative items with `hasHiddenPrices=true` and `accept=null`, and `expand=hour` returns only today's schedule for the arcade timezone.
      parameters:
      - name: id
        in: query
        schema:
          type: string
        description: Arcade id.
      - name: arcade
        in: query
        schema:
          type: string
        description: Alias for `id`.
      - name: expand
        in: query
        schema:
          type: string
        description: |
          `none` or empty returns relation ids only. `all` expands every section.
          Comma-separated values such as `basic,hour` expand only the requested sections.
      - name: source
        in: query
        schema:
          type: string
          enum:
          - direct
          - search
          - nearby
          - other
          - poster
          - google
          - naver
          - bing
          default: direct
        description: Optional acquisition source recorded with the page view. search
          is internal site search; poster is poster QR; google, naver, and bing are
          external search referrals. Missing or unknown values use direct.
      - name: game_series
        in: query
        description: Optional repeated or comma-separated series IDs used to reach
          the arcade.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      responses:
        '200':
          description: Arcade metadata with relation ids or expanded relation payloads.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeValueResponse"
              examples:
                idsOnly:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: '2026-04-01 12:00:00.000Z'
                      updated: '2026-04-10 09:00:00.000Z'
                    basic: basic_rel
                    hour: hour_rel
                    sns: sns_rel
                    gtk: gtk_rel
                    game: game_rel
                    photo: photo_rel
                expanded:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: '2026-04-01 12:00:00.000Z'
                      updated: '2026-04-10 09:00:00.000Z'
                    basic:
                      id: basic_rel
                      name: Sydney Arcade
                      address: 123 George St, Sydney NSW
                      direction: Level 2
                      nickname:
                      - Town Hall
                      subway_line:
                      - T1
                      location:
                        lat: -33.8708
                        lon: 151.2062
                    hour:
                      id: hour_rel
                      Monday:
                        start: 1000
                        end: 2300
                      Thursday:
                        start: 0
                        end: 0
                      Sunday: 499
                      Note: Late night on Thursdays
                    sns:
                      id: sns_rel
                      items:
                      - type: instagram
                        link: https://instagram.com/example
                        name: Official account
                    gtk:
                      id: gtk_rel
                      items:
                      - type: smoking
                        bool: false
                    game:
                      id: game_rel
                      items:
                      - id: atom_123
                        updated: '2026-04-10 09:00:00.000Z'
                        version:
                          id: version_123
                          series: series_123
                          released_on: '2025-01-01'
                          en: Version A
                          kr: Version A
                          jp: Version A
                          price_default:
                        series:
                          id: series_123
                          seriesNumber: 1
                          en: Series A
                          kr: Series A
                          jp: Series A
                          en_short: A
                          kr_short: A
                          jp_short: A
                          manufacturer:
                        location: 2F
                        quantity: 1
                        price:
                          currency: KRW
                          type: custom
                          list:
                          - value: 500
                          accept:
                          - Cash
                        tag: []
                    photo:
                      id: photo_rel
        '400':
          description: Missing target arcade id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - arcade:read
  /developer/v1/arcades/nearby:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/arcades/nearby
      parameters:
      - name: game_filter
        in: query
        description: |
          Repeat this parameter once per selected game series with a
          URL-encoded JSON object such as
          `{"series":"sdvx","cabinet":"valkyrie"}`. Omitting
          `cabinet` means all cabinets for that series. Separate objects
          use AND semantics across series. For example, maimai without a
          cabinet and SDVX with `"valkyrie"` requires both series while
          leaving maimai's cabinet unrestricted. `game_filter` cannot be combined
          with the legacy `game_series` or `game_cabinet` parameters.
        schema:
          type: array
          items:
            type: string
      - name: game_series
        in: query
        description: |
          Repeat the query parameter or pass comma-separated `game_series` ids.
          With no `game_cabinet`, every listed series is required and cabinet
          identity is ignored, including unverified cabinet revisions. When
          `game_cabinet` is present, order is significant: each series is paired
          positionally with the cabinet at the same index and every pair is required.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: game_cabinet
        in: query
        description: |
          Repeat the query parameter or pass comma-separated canonical
          `game_cabinet` ids. Cabinet filtering requires `game_series`, the
          two expanded lists must have equal lengths, and values are paired
          positionally. Each `(game_series, game_cabinet)` pair must match the
          same revision in the arcade's currently selected game state; all
          requested pairs use AND semantics. A cabinet-only request is invalid.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: lon
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: address
        in: query
        schema:
          type: string
        description: Normalized address keyword filter.
      - name: country
        in: query
        schema:
          type: string
        description: Optional ISO country-code filter.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: distance_limit
        in: query
        description: Optional maximum distance in kilometers from the supplied location.
        schema:
          type: number
          format: double
          minimum: 0
      - name: expand
        in: query
        description: |
          When true, expands each item's `game` payload with arcade game details,
          including each revision's cabinet. When game filters are supplied,
          expanded items contain only revisions matching the requested series
          and, when supplied, its selected cabinet. Separate grouped series
          remain required. Legacy positional series/cabinet pairs retain
          their compatibility behavior.
        schema:
          type: boolean
      responses:
        '200':
          description: Distance-sorted paginated nearby results. The response also
            marks campaign-target arcades and includes campaigns that have pending
            targets in the current page.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadesNearbyResponse"
              example:
                page: 1
                per_page: 15
                last_page: 1
                total: 1
                country_totals:
                  AU:
                    total: 1
                    nearest_arcade:
                      id: arcade_123
                      distance_km: 0.4
                items:
                - id: arcade_123
                  country: AU
                  name: Sydney Arcade
                  address: 123 George St, Sydney NSW
                  location:
                    lat: -33.8708
                    lon: 151.2062
                  game_series:
                  - series_1
                  game:
                    id: game_123
                    state_id: game_123
                    items:
                    - id: atom_1
                      updated: '2026-04-10 09:00:00.000Z'
                      version:
                        id: version_1
                        series: series_1
                        released_on: '2025-01-01'
                        en: Sydney Version
                        kr: Sydney Version
                        jp: Sydney Version
                        price_default:
                      series:
                        id: series_1
                        seriesNumber: 1
                        en: Sydney Series
                        kr: Sydney Series
                        jp: Sydney Series
                        en_short: Sydney
                        kr_short: Sydney
                        jp_short: Sydney
                        manufacturer:
                      cabinet:
                        id: cabinet_gold
                        en: CHUNITHM GOLD
                        kr: 츄니즘 골드
                        jp: チュウニズム ゴールド
                      location: 1F
                      quantity: 1
                      price: {}
                      tag: []
                      flags: []
                  distance_km: 0.4
                campaigns: []
        '400':
          description: |
            Invalid or missing location/page value; an invalid grouped
            `game_filter`; mixed grouped and legacy game parameters; a
            `game_cabinet` without `game_series`; or unequal expanded
            `game_series` and `game_cabinet` list lengths.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to load arcades.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - arcade:read
      description: 'Delegated access requires arcade:read. Existing domain visibility,
        role, ownership, location and XP rules still apply. '
  /developer/v1/campaigns:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/campaigns
      description: Delegated access requires campaign:read. Existing domain visibility,
        role, ownership, location and XP rules still apply. Returns at most 20 campaigns
        that are active at request time, newest start first. Target counts include
        pending and already-updated public/open targets.
      responses:
        '200':
          description: Active campaign summaries.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CampaignListResponse"
        '502':
          description: Campaigns could not be loaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - campaign:read
  /developer/v1/campaign:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/campaign
      description: |
        Delegated access requires campaign:read. Existing domain visibility, role, ownership, location and XP rules still apply. Returns the active campaign detail for the requested id. The response
        separates current old-version targets from current to-version targets,
        so the updated list includes machines already on the target version
        even when they were not updated through this campaign. It includes
        newest-first report logs with the user, arcade, game, reaction,
        location-verification status, and report time, plus the latest
        still_old report. Updated targets can be reverted by a new still_old
        report for seven days after the update. Only currently public/open
        arcades are included.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign progress, updated targets, and report log.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CampaignDetailResponse"
        '400':
          description: Missing campaign id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Campaign is not active or was not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Campaign detail could not be loaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - campaign:read
  /developer/v1/arcade/campaigns:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/arcade/campaigns
      description: Delegated access requires campaign:read. Existing domain visibility,
        role, ownership, location and XP rules still apply. Returns campaign prompts
        for the requested public/open arcade to an authenticated active user. Includes
        current from_version machines and current to_version machines with an updated
        report for the same campaign and arcade/game created less than seven days
        ago. Already-updated machines without a campaign update report and reports
        aged seven days or more are excluded. Each item includes current target status
        and report history; expiry leaves game state and campaign overview history
        intact.
      security:
      - delegatedOAuth:
        - campaign:read
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current campaign prompts for the arcade.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeCampaignListResponse"
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '502':
          description: Campaign targets could not be loaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
  /developer/v1/arcade/flag:
    post:
      tags:
      - Delegated resources
      summary: POST /developer/v1/arcade/flag
      description: Delegated access requires arcade:report:create. Existing domain
        visibility, role, ownership, location and XP rules still apply. Private drafts
        require the creator or a developer/moderator. Public arcades have no editor
        level threshold. Accepts at most 3 images, 15000000 bytes each, within a 46048576-byte
        encoded request body.
      security:
      - delegatedOAuth:
        - arcade:report:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateArcadeFlagRequest"
          multipart/form-data:
            schema:
              type: object
              required:
              - arcade
              - game_id
              - disruption
              - message
              properties:
                arcade:
                  type: string
                game_id:
                  type: string
                disruption:
                  type: string
                  enum:
                  - unplayable
                  - major
                  - bearable
                  - minor
                message:
                  type: string
                photos:
                  type: array
                  maxItems: 3
                  description: Images only; at most 15000000 bytes per file. Server
                    verifies contents.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Flag created and linked to the durable game entry.
          content:
            application/json:
              schema:
                type: object
                required:
                - arcade
                - game_id
                - flag
                - game
                - xp_feedback
                properties:
                  arcade:
                    type: string
                  game_id:
                    type: string
                  flag:
                    type: string
                  game:
                    "$ref": "#/components/schemas/ArcadeGameExpanded"
                  xp_feedback:
                    "$ref": "#/components/schemas/XpFeedback"
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '413':
          description: File or encoded request body exceeds its limit.
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
  /developer/v1/arcade/flag/reaction:
    post:
      tags:
      - Delegated resources
      summary: POST /developer/v1/arcade/flag/reaction
      description: Delegated access requires arcade:report:react. Existing domain
        visibility, role, ownership, location and XP rules still apply. Private drafts
        require the creator or a developer/moderator. Public arcades have no editor
        level threshold.
      security:
      - delegatedOAuth:
        - arcade:report:react
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FlagReactionRequest"
      responses:
        '200':
          description: Reaction state updated. The response includes the authoritative
            resolution summary, current user vote, and newest-first report history.
          content:
            application/json:
              schema:
                type: object
                required:
                - flag
                - reaction
                - action
                - reaction_id
                - solved
                - game
                - xp_feedback
                - resolution
                - reportHistory
                properties:
                  flag:
                    type: string
                  reaction:
                    type: string
                  action:
                    type: string
                  reaction_id:
                    type: string
                  solved:
                    type: boolean
                  game:
                    "$ref": "#/components/schemas/ArcadeGameExpanded"
                  xp_feedback:
                    "$ref": "#/components/schemas/XpFeedback"
                  resolution:
                    "$ref": "#/components/schemas/ArcadeFlagResolution"
                  reportHistory:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ArcadeFlagReportHistoryItem"
        '400':
          description: Invalid body or reaction rule failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '502':
          description: The reaction transaction succeeded but the authoritative resolution
            response could not be built.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
  /developer/v1/campaign/check:
    post:
      tags:
      - Delegated resources
      summary: POST /developer/v1/campaign/check
      description: |
        Delegated access requires campaign:respond. Existing domain visibility, role, ownership, location and XP rules still apply. Confirms whether one active update-campaign target is still on the old
        version or has been updated. A `still_old` result awards 1 XP once per
        user and target. The default request requires a same-day
        verified visit at the public/open arcade. `bypass_location=true` skips
        only that visit check and requires level 10 or above; an updated result
        through this path awards 1 XP; clients must obtain two warning
        confirmations before sending it.
      security:
      - delegatedOAuth:
        - campaign:respond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CampaignCheckRequest"
      responses:
        '200':
          description: Campaign check persisted; still_old results award 1 XP, while
            updated results atomically move the game state and award campaign XP,
            or 1 XP when location is bypassed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CampaignCheckResponse"
        '400':
          description: Invalid campaign check body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '404':
          description: Campaign or public arcade was not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: Campaign is inactive, target is outside scope, or game state
            is no longer eligible.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Campaign check transaction failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '429':
          description: Rate limited.
