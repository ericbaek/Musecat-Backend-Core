  /developer/v1/account/arcade/photo:
    put:
      tags:
      - Connected account
      summary: "/arcade/photo"
      description: |-
        Requires account:access. Same payload, response and domain checks as PUT /arcade/photo. Management operations are excluded even for staff.

        Pending atoms receive 2 XP each when first published, up to 10 XP per campaign target or 4 XP per other public arcade in a rolling seven-day window. Uploading alone, reordering, removing, or reusing a previously published atom awards no XP. Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateArcadePhotoRequest"
            example:
              arcade: arcade_123
              photos:
              - atom_1
              - atom_2
      responses:
        '200':
          description: 'Photo relation updated. XP is awarded only when pending atoms
            are first published: 2 XP per atom, up to 10 XP per campaign target or
            4 XP per other public arcade in a rolling seven-day window. Uploading
            alone, reordering, removing, or reusing a published atom awards no XP.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UpdateArcadePhotoResponse"
              example:
                arcade: arcade_123
                photo: photo_molecule_123
                count: 2
                xp_feedback:
                  previous_exp: 0
                  new_exp: 2
                  diff_exp: 2
                  previous_percent_to_next_level: 0
                  new_percent_to_next_level: 50
                  previous_level: 0
                  new_level: 0
                  level_diff: 0
                  remaining_exp_to_next_level: 2
                  remaining_percent_to_next_level: 50
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '502':
          description: Transaction failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
  /developer/v1/account/arcade/sns:
    put:
      tags:
      - Connected account
      summary: "/arcade/sns"
      description: |-
        Requires account:access. Same payload, response and domain checks as PUT /arcade/sns. Management operations are excluded even for staff.

        Creates a new `arcade_sns` molecule and writes the atoms under it.
        The success response returns the same expanded SNS shape used by `GET /arcade?expand=sns`.
        Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateArcadeSNSRequest"
      responses:
        '200':
          description: SNS relation updated.
          content:
            application/json:
              schema:
                type: object
                required:
                - arcade
                - sns
                - xp_feedback
                properties:
                  arcade:
                    type: string
                  sns:
                    "$ref": "#/components/schemas/ArcadeSnsExpanded"
                  xp_feedback:
                    "$ref": "#/components/schemas/XpFeedback"
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
  /developer/v1/account/user/countries:
    put:
      tags:
      - Connected account
      summary: "/user/countries"
      description: |-
        Requires account:access. Same payload, response and domain checks as PUT /user/countries. Management operations are excluded even for staff.

        Replaces the authenticated user's ordered profile country list and display mode. Empty is allowed. Accounts below level 15 may select zero or one country; accounts at level 15 or above may select up to three. Supporter and staff tags do not change this limit.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileCountriesRequest"
      responses:
        '200':
          description: Updated normalized profile countries.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileCountriesResponse"
        '400':
          description: Invalid JSON, duplicate, invalid country code, or more than
            three countries.
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Multiple countries require level 15 or above, or the account
            is inactive.
        '409':
          description: The account has not initialized user_info.
        '502':
          description: Failed to save profile countries.
