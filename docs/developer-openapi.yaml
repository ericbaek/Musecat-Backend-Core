  /developer/v1/account/user/changelog:
    get:
      tags:
      - Connected account
      summary: "/user/changelog"
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /user/changelog. Management operations are excluded even for staff.

        Returns only arcade and changed-category summaries of the user's edits in reverse
        chronological order. Anonymous callers receive rows from public
        arcades only. An authenticated caller may additionally receive rows
        from private arcades they own; `developer` and `moderator` callers may
        audit private rows. The endpoint never exposes flags, visits, or legacy
        tickets; those remain activity aggregates rather than changelog rows.
        Every caller receives only id, arcade, arcade_name, and changed. Revision
        pointers, logs, timestamps, memo snapshots, and photo assets are omitted.
        Rows whose arcade aggregate was deleted are omitted, and withdrawn
        users receive an empty page.
      parameters:
      - name: user
        in: query
        required: true
        description: User id whose server-authored changelog rows are requested.
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: changed
        in: query
        description: Optional arcade part filter. Omit to return all supported categories.
        schema:
          type: string
          enum:
          - basic
          - game
          - hour
          - sns
          - gtk
          - photo
          - memo
      responses:
        '200':
          description: User-scoped immutable changelog page.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserChangelogPage"
        '400':
          description: Missing user id, invalid pagination, or unsupported changed
            category.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: User does not exist.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to query the user changelog.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
