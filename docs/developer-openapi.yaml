        Omits historical version aliases (non-empty alias_of) while retaining their records for historical game reads. Returns only explicitly supported cabinets for each version and distinct cabinets for each series. Cabinet arrays are ordered by the earliest release date among active compatible versions, newest first; undated cabinets follow, then name and ID break ties. An unverified cabinet is represented by `null` only in arcade game entries and mutations, never as a catalog item.
      parameters:
