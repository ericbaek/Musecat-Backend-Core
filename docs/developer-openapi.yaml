  /developer/v1/account/arcade/public:
    get:
      tags:
      - Connected account
      summary: Preview public-conversion XP and requirements
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /arcade/public. Management operations are excluded even for staff.

        Reads the creator's current level-based public-conversion requirements and currently eligible public-conversion (5 XP) and draft-backfill (2 XP per eligible changed area) without changing visibility or the XP ledger. Levels 0-4 require game, contact-or-hours, and facility-photo-or-location-verification; levels 5-9 require game and facility-photo-or-location-verification; levels 10+ require game only. Only the private arcade creator may call this endpoint.
      security:
      - delegatedOAuth:
        - account:access
      parameters:
      - name: arcade
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current XP preview for converting the private arcade to public.
          content:
            application/json:
              schema:
                type: object
                required:
                - arcade
                - public
                - level
                - requirements
                - location_verified
                - xp_preview
                properties:
                  arcade:
                    type: string
                  public:
                    type: boolean
                    const: false
                  level:
                    type: integer
                  requirements:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ArcadePublicRequirement"
                  location_verified:
                    type: boolean
                  xp_preview:
                    "$ref": "#/components/schemas/ArcadePublicExpPreview"
        '400':
          description: Missing arcade id, closed arcade, or already-public arcade.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Only the draft creator may preview its public-conversion XP.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to calculate the XP preview.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    put:
