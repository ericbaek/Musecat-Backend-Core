        as PUT /user/game-preferences. Management operations are excluded even for
        staff.
  /developer/v1/account/user/profile:
    put:
      tags:
      - Connected account
      summary: Update the authenticated user's profile
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nickname
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 25
                bio:
                  type: string
                  maxLength: 100
                sns:
                  "$ref": "#/components/schemas/UserProfileSns"
                avatar:
                  type: 'null'
                  description: Null deletes the current avatar.
                background:
                  type: 'null'
                  description: Null deletes the current background; requires level
                    15.
                background_position:
                  "$ref": "#/components/schemas/UserProfile/properties/background_position"
          multipart/form-data:
            schema:
              type: object
              required:
              - nickname
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 25
                bio:
                  type: string
                  maxLength: 100
                sns:
                  type: string
                  description: JSON encoded UserProfileSns object.
                avatar:
                  type: string
                  format: binary
                  description: PNG or JPEG up to 15 MB; empty or "null" text deletes.
                background:
                  type: string
                  format: binary
                  description: PNG or JPEG up to 15 MB; empty or "null" text deletes.
                    Requires level 15.
                background_position:
                  type: string
                  description: JSON encoded x/y percentages (0 to 100), optional zoom
                    (1 to 4) and rotation (0/90/180/270); requires level 15.
      responses:
        '200':
          description: Updated self profile, including private series.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserProfile"
        '400':
          description: Invalid profile input.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Inactive user or background access requires level 15.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: Missing user_info record.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Storage or profile read failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      description: Requires account:access. Same payload, response and domain checks
        as PUT /user/profile. Management operations are excluded even for staff.
