  /developer/v1/account/arcades/nearby:
    get:
      tags:
      - Connected account
      summary: "/arcades/nearby"
      parameters:
      - name: game_filter
        in: query
        description: |
          Repeat this parameter once per selected game series with a
          URL-encoded JSON object such as
          `{"series":"sdvx","cabinet":"valkyrie"}`. Omitting
          `cabinet` means all cabinets for that series. Separate objects
          use AND semantics across series. For example, maimai without a
          cabinet and SDVX with `"valkyrie"` requires both series while
          leaving maimai's cabinet unrestricted. `game_filter` cannot be combined
          with the legacy `game_series` or `game_cabinet` parameters.
        schema:
          type: array
          items:
            type: string
      - name: game_series
        in: query
        description: |
          Repeat the query parameter or pass comma-separated `game_series` ids.
          With no `game_cabinet`, every listed series is required and cabinet
          identity is ignored, including unverified cabinet revisions. When
          `game_cabinet` is present, order is significant: each series is paired
          positionally with the cabinet at the same index and every pair is required.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: game_cabinet
        in: query
        description: |
          Repeat the query parameter or pass comma-separated canonical
          `game_cabinet` ids. Cabinet filtering requires `game_series`, the
          two expanded lists must have equal lengths, and values are paired
          positionally. Each `(game_series, game_cabinet)` pair must match the
          same revision in the arcade's currently selected game state; all
          requested pairs use AND semantics. A cabinet-only request is invalid.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: lon
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: address
        in: query
        schema:
          type: string
        description: Normalized address keyword filter.
      - name: country
        in: query
        schema:
          type: string
        description: Optional ISO country-code filter.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: distance_limit
        in: query
        description: Optional maximum distance in kilometers from the supplied location.
        schema:
          type: number
          format: double
          minimum: 0
      - name: expand
        in: query
        description: |
          When true, expands each item's `game` payload with arcade game details,
          including each revision's cabinet. When game filters are supplied,
          expanded items contain only revisions matching the requested series
          and, when supplied, its selected cabinet. Separate grouped series
          remain required. Legacy positional series/cabinet pairs retain
          their compatibility behavior.
        schema:
          type: boolean
      responses:
        '200':
          description: Distance-sorted paginated nearby results. The response also
            marks campaign-target arcades and includes campaigns that have pending
            targets in the current page.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadesNearbyResponse"
              example:
                page: 1
                per_page: 15
                last_page: 1
                total: 1
                country_totals:
                  AU:
                    total: 1
                    nearest_arcade:
                      id: arcade_123
                      distance_km: 0.4
                items:
                - id: arcade_123
                  country: AU
                  name: Sydney Arcade
                  address: 123 George St, Sydney NSW
                  location:
                    lat: -33.8708
                    lon: 151.2062
                  game_series:
                  - series_1
                  game:
                    id: game_123
                    state_id: game_123
                    items:
                    - id: atom_1
                      updated: '2026-04-10 09:00:00.000Z'
                      version:
                        id: version_1
                        series: series_1
                        released_on: 2025-01-01
                        en: Sydney Version
                        kr: Sydney Version
                        jp: Sydney Version
                        price_default:
                      series:
                        id: series_1
                        seriesNumber: 1
                        en: Sydney Series
                        kr: Sydney Series
                        jp: Sydney Series
                        en_short: Sydney
                        kr_short: Sydney
                        jp_short: Sydney
                        manufacturer:
                      cabinet:
                        id: cabinet_gold
                        en: CHUNITHM GOLD
                        kr: 츄니즘 골드
                        jp: チュウニズム ゴールド
                      location: 1F
                      quantity: 1
                      price: {}
                      tag: []
                      flags: []
                  distance_km: 0.4
                campaigns: []
        '400':
          description: |
            Invalid or missing location/page value; an invalid grouped
            `game_filter`; mixed grouped and legacy game parameters; a
            `game_cabinet` without `game_series`; or unequal expanded
            `game_series` and `game_cabinet` list lengths.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to load arcades.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
      description: Requires account:access. Same payload, response and domain checks
        as GET /arcades/nearby. Management operations are excluded even for staff.
