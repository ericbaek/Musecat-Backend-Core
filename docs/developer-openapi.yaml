  /developer/v1/account/arcade/analytics/event:
    post:
      tags:
      - Connected account
      summary: "/arcade/analytics/event"
      description: |-
        Requires account:access. Same payload, response and domain checks as POST /arcade/analytics/event. Management operations are excluded even for staff.

        Records an anonymous direction-click analytics event. The request body is limited to
        2 KiB and accepts at most ten distinct game-series IDs. To limit anonymous metric
        manipulation, each client IP may record at most 20 events per rolling 10 minutes and
        may record an event for the same arcade only once every 30 seconds. Once the arcade is
        validated, rejected series IDs also consume this quota before their database lookup. The server does
        not persist the client IP, user agent, or identity; limits are process-local and retain
        no more than 4,096 active clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ArcadeAnalyticsEventRequest"
      responses:
        '200':
          description: Analytics event recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                - recorded
                properties:
                  recorded:
                    type: boolean
                    const: true
        '400':
          description: Invalid event body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '413':
          description: Analytics event body exceeds 2 KiB.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '429':
          description: Anonymous client exceeded the per-arcade cooldown or rolling
            event limit. The `Retry-After` header is included.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until this anonymous client may retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Analytics event persistence failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
