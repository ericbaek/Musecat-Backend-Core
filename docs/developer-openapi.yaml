  /developer/v1/account/campaign/check:
    post:
      tags:
      - Connected account
      summary: "/campaign/check"
      description: |-
        Requires account:access. Same payload, response and domain checks as POST /campaign/check. Management operations are excluded even for staff.

        Confirms whether one active update-campaign target is still on the old
        version or has been updated. A `still_old` result awards 1 XP once per
        user and target. The default request requires a same-day
        verified visit at the public/open arcade. `bypass_location=true` skips
        only that visit check and requires level 10 or above; an updated result
        through this path awards 1 XP; clients must obtain two warning
        confirmations before sending it.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CampaignCheckRequest"
      responses:
        '200':
          description: Campaign check persisted; still_old results award 1 XP, while
            updated results atomically move the game state and award campaign XP,
            or 1 XP when location is bypassed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CampaignCheckResponse"
        '400':
          description: Invalid campaign check body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Active user is missing the required visit or level 10 access
            for a location bypass.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Campaign or public arcade was not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: Campaign is inactive, target is outside scope, or game state
            is no longer eligible.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Campaign check transaction failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  /developer/v1/account/support_feedback:
    post:
      tags:
      - Connected account
      summary: "/support_feedback"
      description: |-
        Requires account:access. Same payload, response and domain checks as POST /support_feedback. Management operations are excluded even for staff.

        Default per-client-IP limit is 10 requests per 600 seconds, shared by anonymous and authenticated users. Operator-configured limits and PocketBase exemptions may override the defaults. Accepts at most 3 images of 15000000 bytes each; the total encoded body is limited to 46048576 bytes (45 MB of photos plus 1 MiB of form overhead).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSupportFeedbackRequest"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/CreateSupportFeedbackMultipartRequest"
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Created support feedback record.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - message
                - status
                - createdBy
                - photos
                - created
                - updated
                properties:
                  id:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                  createdBy:
                    type: string
                  created:
                    type: string
                  updated:
                    type: string
                  photos:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '413':
          description: File exceeds 15000000 bytes or encoded request body exceeds
            46048576 bytes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PocketBaseAuthError"
        '429':
          description: Client IP request limit exceeded, including authenticated requests.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PocketBaseAuthError"
        '502':
          description: Create failure.
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
