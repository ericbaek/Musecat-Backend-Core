  /developer/v1/arcade:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/arcade
      description: |
        Delegated access requires arcade:read. Existing domain visibility, role, ownership, location and XP rules still apply. Returns only a public arcade (open or closed) and relation ids by default.
        Private arcades always return `404`; use authenticated `GET /arcade/draft` for a creator or developer/moderator draft read.
        When `expand=game`, each `game.items[]` entry includes `version`, `series`, `updated`, and the editable game fields.
        Unauthenticated callers receive redacted sensitive data: `tag` is null, `location` and `updated` are empty strings, `price` retains only representative items with `hasHiddenPrices=true` and `accept=null`, and `expand=hour` returns only today's schedule for the arcade timezone.
      parameters:
      - name: id
        in: query
        schema:
          type: string
        description: Arcade id.
      - name: arcade
        in: query
        schema:
          type: string
        description: Alias for `id`.
      - name: expand
        in: query
        schema:
          type: string
        description: |
          `none` or empty returns relation ids only. `all` expands every section.
          Comma-separated values such as `basic,hour` expand only the requested sections.
      - name: source
        in: query
        schema:
          type: string
          enum:
          - direct
          - search
          - nearby
          - other
          - poster
          - google
          - naver
          - bing
          default: direct
        description: Optional acquisition source recorded with the page view. search
          is internal site search; poster is poster QR; google, naver, and bing are
          external search referrals. Missing or unknown values use direct.
      - name: game_series
        in: query
        description: Optional repeated or comma-separated series IDs used to reach
          the arcade.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      responses:
        '200':
          description: Arcade metadata with relation ids or expanded relation payloads.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeValueResponse"
              examples:
                idsOnly:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: '2026-04-01 12:00:00.000Z'
                      updated: '2026-04-10 09:00:00.000Z'
                    basic: basic_rel
                    hour: hour_rel
                    sns: sns_rel
                    gtk: gtk_rel
                    game: game_rel
                    photo: photo_rel
                expanded:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: '2026-04-01 12:00:00.000Z'
                      updated: '2026-04-10 09:00:00.000Z'
                    basic:
                      id: basic_rel
                      name: Sydney Arcade
                      address: 123 George St, Sydney NSW
                      direction: Level 2
                      nickname:
                      - Town Hall
                      subway_line:
                      - T1
                      location:
                        lat: -33.8708
                        lon: 151.2062
                    hour:
                      id: hour_rel
                      Monday:
                        start: 1000
                        end: 2300
                      Thursday:
                        start: 0
                        end: 0
                      Sunday: 499
                      Note: Late night on Thursdays
                    sns:
                      id: sns_rel
                      items:
                      - type: instagram
                        link: https://instagram.com/example
                        name: Official account
                    gtk:
                      id: gtk_rel
                      items:
                      - type: smoking
                        bool: false
                    game:
                      id: game_rel
                      items:
                      - id: atom_123
                        updated: '2026-04-10 09:00:00.000Z'
                        version:
                          id: version_123
                          series: series_123
                          released_on: '2025-01-01'
                          en: Version A
                          kr: Version A
                          jp: Version A
                          price_default:
                        series:
                          id: series_123
                          seriesNumber: 1
                          en: Series A
                          kr: Series A
                          jp: Series A
                          en_short: A
                          kr_short: A
                          jp_short: A
                          manufacturer:
                        location: 2F
                        quantity: 1
                        price:
                          currency: KRW
                          type: custom
                          list:
                          - value: 500
                          accept:
                          - Cash
                        tag: []
                    photo:
                      id: photo_rel
        '400':
          description: Missing target arcade id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - arcade:read
  /developer/v1/arcades/nearby:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/arcades/nearby
      parameters:
      - name: game_filter
        in: query
        description: |
          Repeat this parameter once per selected game series with a
          URL-encoded JSON object such as
          `{"series":"sdvx","cabinet":"valkyrie"}`. Omitting
          `cabinet` means all cabinets for that series. Separate objects
          use AND semantics across series. For example, maimai without a
          cabinet and SDVX with `"valkyrie"` requires both series while
          leaving maimai's cabinet unrestricted. `game_filter` cannot be combined
          with the legacy `game_series` or `game_cabinet` parameters.
        schema:
          type: array
          items:
            type: string
      - name: game_series
        in: query
        description: |
          Repeat the query parameter or pass comma-separated `game_series` ids.
          With no `game_cabinet`, every listed series is required and cabinet
          identity is ignored, including unverified cabinet revisions. When
          `game_cabinet` is present, order is significant: each series is paired
          positionally with the cabinet at the same index and every pair is required.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: game_cabinet
        in: query
        description: |
          Repeat the query parameter or pass comma-separated canonical
          `game_cabinet` ids. Cabinet filtering requires `game_series`, the
          two expanded lists must have equal lengths, and values are paired
          positionally. Each `(game_series, game_cabinet)` pair must match the
          same revision in the arcade's currently selected game state; all
          requested pairs use AND semantics. A cabinet-only request is invalid.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: lon
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: address
        in: query
        schema:
          type: string
        description: Normalized address keyword filter.
      - name: country
        in: query
        schema:
          type: string
        description: Optional ISO country-code filter.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: distance_limit
        in: query
        description: Optional maximum distance in kilometers from the supplied location.
        schema:
          type: number
          format: double
          minimum: 0
      - name: expand
        in: query
        description: |
          When true, expands each item's `game` payload with arcade game details,
          including each revision's cabinet. When game filters are supplied,
          expanded items contain only revisions matching the requested series
          and, when supplied, its selected cabinet. Separate grouped series
          remain required. Legacy positional series/cabinet pairs retain
          their compatibility behavior.
        schema:
          type: boolean
      responses:
        '200':
          description: Distance-sorted paginated nearby results. The response also
            marks campaign-target arcades and includes campaigns that have pending
            targets in the current page.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadesNearbyResponse"
              example:
                page: 1
                per_page: 15
                last_page: 1
                total: 1
                country_totals:
                  AU:
                    total: 1
                    nearest_arcade:
                      id: arcade_123
                      distance_km: 0.4
                items:
                - id: arcade_123
                  country: AU
                  name: Sydney Arcade
                  address: 123 George St, Sydney NSW
                  location:
                    lat: -33.8708
                    lon: 151.2062
                  game_series:
                  - series_1
                  game:
                    id: game_123
                    state_id: game_123
                    items:
                    - id: atom_1
                      updated: '2026-04-10 09:00:00.000Z'
                      version:
                        id: version_1
                        series: series_1
                        released_on: '2025-01-01'
                        en: Sydney Version
                        kr: Sydney Version
                        jp: Sydney Version
                        price_default:
                      series:
                        id: series_1
                        seriesNumber: 1
                        en: Sydney Series
                        kr: Sydney Series
                        jp: Sydney Series
                        en_short: Sydney
                        kr_short: Sydney
                        jp_short: Sydney
                        manufacturer:
                      cabinet:
                        id: cabinet_gold
                        en: CHUNITHM GOLD
                        kr: 츄니즘 골드
                        jp: チュウニズム ゴールド
                      location: 1F
                      quantity: 1
                      price: {}
                      tag: []
                      flags: []
                  distance_km: 0.4
                campaigns: []
        '400':
          description: |
            Invalid or missing location/page value; an invalid grouped
            `game_filter`; mixed grouped and legacy game parameters; a
            `game_cabinet` without `game_series`; or unequal expanded
            `game_series` and `game_cabinet` list lengths.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to load arcades.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - arcade:read
      description: 'Delegated access requires arcade:read. Existing domain visibility,
        role, ownership, location and XP rules still apply. '
