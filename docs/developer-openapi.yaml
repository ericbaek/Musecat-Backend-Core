        staff.

x-musecat-joint-connection:
  status: server-only-preparation
  public-endpoints-enabled: false
  description: >-
    Reciprocal one-step consent requires a bilateral partner agreement and verified
    intent/receipt adapters. The internal joint ledger does not create or broaden
    OAuth grants. Existing independent OAuth/resource operations remain unchanged.
