      type: object
      required: [visibility, city_catalog_available, year, available_years, total_visits, distinct_arcades, distinct_cities, distinct_countries, new_arcades, visit_days, max_arcades_in_day, total_distance_meters, unclassified_arcades, countries, cities, months, weekdays, top_arcades]
      properties:
        visibility: {type: string, enum: [owner, summary, full]}
        city_catalog_available: {type: boolean, description: False when city reference data has not been imported.}
        year: {type: string, description: all or a four-digit year.}
        available_years: {type: array, items: {type: integer}, description: Recorded local years descending.}
        total_visits: {type: integer}
        distinct_arcades: {type: integer}
        distinct_cities: {type: integer}
        distinct_countries: {type: integer}
        new_arcades: {type: integer, description: Arcades whose lifetime first verification occurred in the selected period.}
        visit_days: {type: integer, description: Distinct local calendar date strings across all venues.}
        max_arcades_in_day: {type: integer}
        total_distance_meters: {type: number, description: Consecutive straight-line segments with both endpoints in the period. Missing coordinates break the sequence.}
        unclassified_arcades: {type: integer}
        cities: {type: array, items: {$ref: '#/components/schemas/PassportCity'}}
        countries:
          type: array
          items:
            type: object
            required: [country, arcade_count, visit_count]
            properties:
              country: {type: string}
              arcade_count: {type: integer}
              visit_count: {type: integer}
        months:
          type: array
          items:
            type: object
            required: [month, visits, new_arcades]
            properties:
              month: {type: string, description: YYYY-MM; includes empty months within recorded or selected years.}
              visits: {type: integer}
              new_arcades: {type: integer}
        weekdays:
          type: array
          items:
            type: object
            required: [weekday, visits]
            properties:
              weekday: {type: integer, minimum: 1, maximum: 7, description: Monday is 1.}
