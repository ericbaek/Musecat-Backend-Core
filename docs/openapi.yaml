              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
    delete:
      tags: [Arcade Mutations]
      summary: DELETE /arcade/report-subscription
      description: Stores an explicit per-arcade opt-out and cancels pending report pushes for this arcade and device. The canonical device remains enabled for personal activity and other arcades.
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, endpoint]
              properties:
                arcade: {type: string}
                endpoint: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
  /arcade/flag:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag
      description: Private drafts require the creator or a developer/moderator. Public arcades have no editor level threshold. Accepts at most 3 images, 15000000 bytes each, within a 46048576-byte encoded request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArcadeFlagRequest'
          multipart/form-data:
            schema:
              type: object
              required: [arcade, game_id, disruption, message]
              properties:
                arcade:
                  type: string
                game_id:
                  type: string
                disruption:
                  type: string
                  enum: [unplayable, major, bearable, minor]
                message:
                  type: string
                photos:
                  type: array
                  maxItems: 3
                  description: Images only; at most 15000000 bytes per file. Server verifies contents.
                  items:
                    type: string
                    format: binary
      responses:
        '409':
          description: Arcade uses external reporting. The response code is REPORT_EXTERNAL; no mutation or XP is committed.
        '200':
          description: Flag created and linked to the durable game entry.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, game_id, flag, game, xp_feedback]
                properties:
                  arcade:
                    type: string
                  game_id:
                    type: string
                  flag:
                    type: string
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413': {description: File or encoded request body exceeds its limit.}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/flag/delete:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag/delete
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagActionRequest'
      responses:
        '200':
          description: Flag deleted.
          content:
            application/json:
              schema:
                type: object
                required: [flag, deleted, game, xp_feedback]
                properties:
                  flag:
                    type: string
                  deleted:
                    type: boolean
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid body or delete rule failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
  /arcade/flag/reaction:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag/reaction
      description: Private drafts require the creator or a developer/moderator. Public arcades have no editor level threshold. A fixed reaction by a developer, moderator, or the official owner assigned to this arcade resolves immediately regardless of level; other users retain resolution voting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagReactionRequest'
      responses:
        '409':
          description: Arcade uses external reporting. The response code is REPORT_EXTERNAL; no mutation or XP is committed.
        '200':
          description: Reaction state updated. The response includes the authoritative resolution summary, current user vote, and newest-first report history.
          content:
            application/json:
              schema:
                type: object
                required: [flag, reaction, action, reaction_id, solved, game, xp_feedback, resolution, reportHistory]
                properties:
                  flag:
                    type: string
                  reaction:
                    type: string
                  action:
                    type: string
                  reaction_id:
                    type: string
                  solved:
                    type: boolean
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
                  resolution:
                    $ref: '#/components/schemas/ArcadeFlagResolution'
                  reportHistory:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArcadeFlagReportHistoryItem'
        '400':
          description: Invalid body or reaction rule failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: The reaction transaction succeeded but the authoritative resolution response could not be built.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /moderation/user/test-account:
    post:
      tags: [Moderator]
      summary: Create an ordinary test account and profile
      description: Active developer or moderator only. Does not change collection-wide password authentication or verify email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, nickname]
              properties:
                email: {type: string, format: email, maxLength: 254}
                username: {type: string, minLength: 4, maxLength: 15, pattern: '^[A-Za-z0-9]+$'}
                password: {type: string, minLength: 8, maxLength: 71, writeOnly: true}
                nickname: {type: string, minLength: 1, maxLength: 25}
      responses:
        '201':
          description: Account and profile created; no session token or password returned.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, username, nickname]
                properties:
                  id: {type: string}
                  email: {type: string, format: email}
                  username: {type: string}
                  nickname: {type: string}
        '400':
          description: Invalid input (code invalid_input).
        '401':
          description: Authentication required.
        '403':
          description: Active developer or moderator required.
        '409':
          description: Email or case-insensitive username exists (code duplicate_identity).
        '413':
          description: Body exceeds 16 KiB.
        '502':
          description: Transaction or authorization lookup failed.
  /moderation/user/arcade-account:
    post:
      tags: [Moderator]
      summary: Create an official arcade account and linked profile
      description: Active developer, moderator, or designer only. Atomically sets arcade_owner and owns for an existing public arcade. Does not verify email or replace the caller session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, nickname, arcadeId]
              properties:
                arcadeId: {type: string, minLength: 1}
                email: {type: string, format: email, maxLength: 254}
                username: {type: string, minLength: 4, maxLength: 15, pattern: '^[A-Za-z0-9]+$'}
                password: {type: string, minLength: 8, maxLength: 71, writeOnly: true}
                nickname: {type: string, minLength: 1, maxLength: 25}
      responses:
        '201':
          description: Account and profile created; no session token or password returned.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, username, nickname, arcadeId]
                properties:
                  arcadeId: {type: string}
                  id: {type: string}
                  email: {type: string, format: email}
                  username: {type: string}
                  nickname: {type: string}
        '400':
          description: Invalid input (code invalid_input).
        '401':
          description: Authentication required.
        '403':
          description: Active developer, moderator, or designer required.
        '404':
          description: Public arcade not found (code arcade_not_found).
        '409':
          description: Email or case-insensitive username exists (code duplicate_identity).
        '413':
          description: Body exceeds 16 KiB.
        '502':
          description: Transaction or authorization lookup failed.
  /user/signup:
    post:
      tags: [Users]
      summary: /user/signup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpJsonRequest'
          multipart/form-data:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  maxLength: 15
                nickname:
                  type: string
                bio:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Signup initialized.
          content:
            application/json:
              schema:
                type: object
                required: [success, profile]
                properties:
                  success:
                    type: boolean
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Withdrawn or banned account cannot sign up.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/AccountBannedResponse'
        '409':
          description: Username or user_info already initialized, or username already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Signup transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/check-in:
    post:
      tags: [Users]
      summary: /user/check-in
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Check-in state and XP feedback.
          content:
            application/json:
              schema:
                type: object
                required: [checked_in, already_checked_in, gained_exp, exp, level, day, xp_feedback]
                properties:
                  checked_in:
                    type: boolean
                  already_checked_in:
                    type: boolean
                  gained_exp:
                    type: integer
                  exp:
                    type: integer
                  level:
                    type: integer
                  day:
                    type: string
                    description: KST date in `YYYY-MM-DD` format.
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Withdrawn or banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Check-in transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/visits:
    get:
      tags: [Arcades]
      summary: /arcade/visits
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Public aggregate visit counts for a public arcade.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, total_visits, distinct_visitors]
                properties:
                  arcade: {type: string}
                  total_visits: {type: integer}
                  distinct_visitors: {type: integer}
  /arcade/ranking:
    get:
      tags: [Arcades]
      summary: /arcade/ranking
      description: Returns up to five users ranked by XP earned from this public arcade. The total metric combines completed visit verifications and positive arcade edit grants; edit and passport rank those sources separately. Public closed arcades remain eligible. Private arcades return 404, and visit XP with private visit visibility is omitted.
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
        - name: metric
          in: query
          required: false
          schema: {type: string, enum: [total, edit, passport], default: total}
      responses:
        '200':
          description: Top five contributors for the arcade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeVisitRankingResponse'}
        '400':
          description: Missing arcade id or invalid metric.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Ranking query failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/visit:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/visit
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArcadeVisitRequest'}
      responses:
        '200':
          description: GPS visit verification result and XP feedback. The visit echoes only its arcade and local visit date; raw GPS verification data is not returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  visited: {type: boolean}
                  already_visited: {type: boolean}
                  first_visit_to_arcade: {type: boolean, description: True only for a newly committed lifetime first visit; false for a duplicate.}
                  visit: {$ref: '#/components/schemas/Visit'}
                  gained_exp: {type: integer}
                  exp: {type: integer}
                  level: {type: integer}
                  xp_feedback: {$ref: '#/components/schemas/XpFeedback'}
        '400': {description: Invalid coordinates or GPS accuracy greater than 150 m.}
        '403': {description: Inactive user, ineligible arcade, outside the 100m radius, or a deployment-provided visit policy restriction.}
        '409': {description: Missing arcade coordinates or timezone.}
  /subway/map:
    get:
      tags: [Meta]
      summary: Get the newest subway map for a region
      parameters:
        - name: region
          in: query
          required: true
          schema: {type: string, enum: [center, busan]}
      responses:
        '200':
          description: Latest map metadata and custom file URLs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubwayMap'}
        '400': {description: Unsupported or missing region.}
        '404': {description: No map exists for the region.}
        '502': {description: Map lookup failed.}
    post:
      tags: [Moderator]
      summary: Create a subway map version
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [region, releaseDate]
              properties:
                region: {type: string, enum: [center, busan]}
                releaseDate: {type: string, format: date}
                changelog: {type: string, description: JSON string array, maxLength: 2000000}
                lightSVG: {type: string, format: binary}
                darkSVG: {type: string, format: binary}
                image: {type: string, format: binary}
                file: {type: string, format: binary}
      responses:
        '201': {description: Map version created.}
        '400': {description: Invalid multipart input or no display asset.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
    put:
      tags: [Moderator]
      summary: Update a subway map version
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                region: {type: string, enum: [center, busan]}
                releaseDate: {type: string, format: date}
                changelog: {type: string, description: JSON string array, maxLength: 2000000}
                lightSVG: {type: string, format: binary}
                darkSVG: {type: string, format: binary}
                image: {type: string, format: binary}
                file: {type: string, format: binary}
      responses:
        '200': {description: Map version updated.}
        '400': {description: Invalid multipart input or no display asset.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '404': {description: Map version was not found.}
    delete:
      tags: [Moderator]
      summary: Delete a subway map version
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Map version deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubwayMapDeleteResponse'}
        '400': {description: Missing map id.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '404': {description: Map version was not found.}
        '502': {description: Map deletion failed.}
  /subway/map/history:
    get:
      tags: [Moderator]
      summary: Get subway map version history
      security: [{bearerAuth: []}]
      parameters:
        - name: region
          in: query
          required: false
          schema: {type: string, enum: [center, busan]}
      responses:
        '200':
          description: List of subway map versions.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SubwayMap'}
                  total: {type: integer}
        '400': {description: Unsupported region.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '502': {description: Map lookup failed.}
  /subway/map/file:
    get:
      tags: [Meta]
      summary: Download a subway map asset
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
        - name: field
          in: query
          required: true
          schema: {type: string, enum: [lightSVG, darkSVG, image, file]}
      responses:
        '200': {description: The requested SVG, image, or PDF bytes.}
        '400': {description: Missing id or unsupported field.}
        '404': {description: Map or requested file was not found.}
  /campaign:
    get:
      tags: [Arcade Mutations]
      summary: /campaign
      description: |
        Returns the active campaign detail for the requested id. The response
        separates current old-version targets from current to-version targets,
        so the updated list includes machines already on the target version
        even when they were not updated through this campaign. It includes
        newest-first report logs with the user, arcade, game, reaction,
        location-verification status, and report time, plus the latest
        still_old report. Updated targets can be reverted by a new still_old
        report for seven days after the update. Only currently public/open
        arcades are included.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Campaign progress, updated targets, and report log.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignDetailResponse'}
        '400':
          description: Missing campaign id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Campaign is not active or was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign detail could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      tags: [Moderator]
      summary: Create an update campaign
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignMutationRequest'}
      responses:
        '201':
          description: Campaign created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignMutationResponse'}
        '400': {description: Invalid campaign input.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '502': {description: Campaign could not be created.}
    put:
      tags: [Moderator]
      summary: Update an update campaign
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignMutationRequest'}
      responses:
        '200':
          description: Campaign updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignMutationResponse'}
        '400': {description: Invalid campaign input or missing id.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '404': {description: Campaign was not found.}
        '502': {description: Campaign could not be updated.}
  /campaigns:
    get:
      tags: [Arcades]
      summary: List active update campaigns
      description: Returns at most 20 campaigns that are active at request time, newest start first. Target counts include pending and already-updated public/open targets. A fresh database or no active campaigns returns an empty items array.
      responses:
        '200':
          description: Active campaign summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignListResponse'}
        '502':
          description: Campaigns could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/campaigns:
    get:
      tags: [Arcades]
      summary: List active campaign prompts for an arcade
      description: Returns campaign prompts for the requested public/open arcade to an authenticated active user. Includes current from_version machines and current to_version machines within their review window. After the latest still_old (Wrong) report, one location-verified updated report or two unverified updated reports hide the prompt immediately. A single unverified updated report starts a seven-day window. Wrong resets the report counts and expiry anchor. Updated targets include review_expires_at for the countdown. Already-updated machines without a campaign update report are excluded. Each item includes current target status and report history; expiry leaves game state and campaign overview history intact.
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current campaign prompts for the arcade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeCampaignListResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token, or inactive user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign targets could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/campaigns/presence:
    get:
      tags: [Arcades]
      summary: List campaign-target game ids for an arcade
      description: Returns only game ids with active campaign prompts for a public/open arcade, using the same eligibility as /arcade/campaigns (current from_version machines or current to_version machines within seven days of the first unverified updated report after the latest Wrong report). One verified updated report or two unverified updated reports after the latest Wrong hide presence immediately; Wrong resets the report counts and expiry anchor. Already-updated machines without reports and expired reviews are excluded. Campaign configuration, rewards, locations, and reports are omitted so anonymous detail pages can show campaign presence safely.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Campaign-target game ids for the arcade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeCampaignPresenceResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign targets could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /campaign/end:
    post:
      tags: [Moderator]
      summary: End an update campaign
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignEndRequest'}
      responses:
        '200':
          description: Campaign marked ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignMutationResponse'}
        '400':
          description: Invalid request body or missing id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Active user lacks administrator access.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Campaign was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign could not be ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /campaign/photo:
    get:
      tags: [Arcades]
      summary: Photo update campaign targets
      description: |
        Returns public/open arcades whose current photo gallery has no public
        photo or whose newest public photo is at least one year old. The
        result is computed from the current `arcade.photo` molecule and is
        paginated like the public arcade list. Missing-photo targets are listed
        first, followed by stale targets from oldest to newest.
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: lat
          in: query
          description: Optional latitude for distance ordering; must be supplied with lon.
          schema: {type: number, minimum: -90, maximum: 90}
        - name: lon
          in: query
          description: Optional longitude for distance ordering; must be supplied with lat.
          schema: {type: number, minimum: -180, maximum: 180}
      responses:
        '200':
          description: Current automatic photo campaign targets.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoCampaignListResponse'}
        '400':
          description: Invalid pagination.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Photo campaign targets could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /campaign/check:
    post:
      tags: [Arcade Mutations]
      summary: /campaign/check
      description: |
        Confirms whether one active update-campaign target is still on the old
        version or has been updated. A location-verified `still_old` result awards the configured campaign XP once
        per user and target; unverified `still_old` reports award no XP. The default request requires a same-day
        verified visit at the public/open arcade. `bypass_location=true` skips
        only that visit check at any user level; an updated result
        through this path awards 1 XP; clients must obtain two warning
        confirmations before sending it. A user may append a location-verified
        updated report after their unverified updated report, hiding the
        prompt immediately without awarding update XP again. A verified still_old
        report after an unverified still_old report can earn the campaign reward.
        Repeated confirmations with the same verification do not append reports.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignCheckRequest'}
      responses:
        '200':
          description: Campaign check persisted; verified still_old results award campaign XP once per user and target, unverified still_old results award no XP. Updated results atomically move the game state and award campaign XP, or 1 XP when location is bypassed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignCheckResponse'}
        '400':
          description: Invalid campaign check body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Active user is missing the required visit without a location bypass.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Campaign or public arcade was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Campaign is inactive, target is outside scope, or game state is no longer eligible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign check transaction failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /user/visits:
    get:
      tags: [Users]
      summary: /user/visits
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authenticated user's profile-ready visit summary. It includes all visit days per arcade without raw GPS, accuracy, XP, or visit-record data.
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats: {$ref: '#/components/schemas/VisitStats'}
  /user/visit-visibility:
    put:
      tags: [Users]
      summary: /user/visit-visibility
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VisitVisibilityRequest'}
      responses:
        '200':
          description: Updated public visit visibility.
  /user/favorite-visibility:
    put:
      tags: [Users]
      summary: /user/favorite-visibility
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite_visibility]
              properties:
                favorite_visibility: {type: string, enum: [private, public]}
      responses:
        '200':
          description: Updated favorite arcade visibility.
  /arcade/favorite:
    put:
      tags: [Arcades]
      summary: /arcade/favorite
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, favorited]
              properties:
                arcade: {type: string}
                favorited: {type: boolean}
      responses:
        '200':
          description: Updated favorite state for the arcade.
        '404':
          description: Arcade does not exist or is not public.
  /arcade/favorite/order:
    put:
      tags: [Arcades]
      summary: /arcade/favorite/order
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcades]
              properties:
                arcades:
                  type: array
                  items: {type: string}
                  description: Ordered list of arcade IDs representing the user's favorite order.
      responses:
        '200':
          description: Updated favorite order for the authenticated user.
        '400':
          description: Invalid request body or contains duplicate/unfavorited arcades.
  /user/countries:
    put:
      tags: [Users]
      summary: /user/countries
      description: Replaces the authenticated user's ordered profile country list and display mode. Empty is allowed. Accounts below level 15 may select zero or one country; accounts at level 15 or above may select up to three. Supporter and staff tags do not change this limit.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileCountriesRequest'}
      responses:
        '200':
          description: Updated normalized profile countries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCountriesResponse'}
        '400':
          description: Invalid JSON, duplicate, invalid country code, or more than three countries.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Multiple countries require level 15 or above, or the account is inactive.
        '409':
          description: The account has not initialized user_info.
        '502':
          description: Failed to save profile countries.
  /user/arcade-account/credentials:
    put:
      tags: [Users]
      summary: Change the authenticated official arcade account email or password
      description: Active arcade_owner accounts only. Requires the exact current password and at least one changed credential. Revokes every existing session on success; email changes clear email verification and visibility. Does not change username, roles, ownership, or arcade content.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: {type: string, writeOnly: true}
                email: {type: string, format: email, maxLength: 254}
                newPassword: {type: string, minLength: 8, maxLength: 71, writeOnly: true}
      responses:
        '200':
          description: Credentials updated atomically. All prior session tokens are invalid; sign in again.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: {type: boolean}
        '400': {description: Invalid input or no changes (code invalid_input or no_changes).}
        '401': {description: Missing auth or incorrect current password (code invalid_password).}
        '403': {description: Restricted or non-official account (code not_official_account).}
        '409': {description: Email already in use (code duplicate_email).}
        '413': {description: Body exceeds 16 KiB.}
        '502': {description: Failed to update credentials.}
  /user/withdraw:
    post:
      tags: [Users]
      summary: /user/withdraw
      description: Official arcade accounts require their exact current password even when an OAuth provider is linked. Successful official withdrawal removes arcade_owner and clears owns so the arcade is no longer officially managed by the withdrawn account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '200':
          description: Account withdrawn successfully.
          content:
            application/json:
              schema:
                type: object
                required: [success, withdrawnAt]
                properties:
                  success:
                    type: boolean
                  withdrawnAt:
                    type: string
        '400':
          description: Invalid JSON or password missing for password accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing auth or invalid password.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account already withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Withdraw transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/report:
    get:
      tags: [Support]
      summary: /user/report
      security:
        - bearerAuth: []
      parameters:
        - name: user
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching user reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Withdrawn or banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Support]
      summary: /user/report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserReportRequest'
      responses:
        '200':
          description: User report created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Withdrawn or banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Create failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/passport:
    get:
      tags: [User]
      summary: Owner or shared passport
      description: Current public venues including closed ones. Omit user for authenticated owner. An explicit user ID allows anonymous summary/full access; withdrawn profiles return 404. Private profiles return 404 except for active developers and moderators, who receive full visit dates. Summary omits every visit date. Existing visibility settings take the new scope immediately. No shared caching or raw verification metadata.
      security: [{bearerAuth: []}, {}]
      parameters:
        - in: query
          name: user
          description: Target profile ID. Omit for the authenticated owner.
          schema: {type: string}
        - in: query
          name: year
          schema: {type: string, default: all, pattern: '^(all|[0-9]{4})$'}
      responses:
        '200':
          description: Passport result. Stable sort ties use arcade ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Passport'}
        '400': {description: Invalid filter or pagination.}
        '401': {description: Missing or invalid authentication.}
        '403': {description: Inactive account.}
        '404': {description: Private, missing or withdrawn target profile.}
        '502': {description: Failed to load passport.}
  /user/passport/stamps:
    get:
      tags: [User]
      summary: Owner or shared passport
      description: Current public venues including closed ones. Omit user for authenticated owner. An explicit user ID allows anonymous summary/full access; withdrawn profiles return 404. Private profiles return 404 except for active developers and moderators, who receive full visit dates. Summary omits every visit date. Existing visibility settings take the new scope immediately. No shared caching or raw verification metadata.
      security: [{bearerAuth: []}, {}]
      parameters:
        - in: query
          name: user
          description: Target profile ID. Omit for the authenticated owner.
          schema: {type: string}
        - in: query
          name: year
          schema: {type: string, default: all, pattern: '^(all|[0-9]{4})$'}
        - in: query
          name: country
          schema: {type: string, pattern: "^[A-Z]{2}$"}
        - in: query
          name: city
          schema: {type: string}
        - in: query
          name: sort
          schema: {type: string, enum: [recent, first, visits], default: recent}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - in: query
          name: per_page
          schema: {type: integer, minimum: 1, maximum: 100, default: 24}
      responses:
        '200':
          description: Passport result. Stable sort ties use arcade ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PassportStampPage'}
        '400': {description: Invalid filter or pagination.}
        '401': {description: Missing or invalid authentication.}
        '403': {description: Inactive account.}
        '404': {description: Private, missing or withdrawn target profile.}
        '502': {description: Failed to load passport.}

  /integrations/providers:
    get:
      tags: [Users]
      summary: List configured external account providers and game services
      description: Safe metadata only. Anonymous callers see production providers; an authenticated owner or assigned tester also sees their development providers. Empty configuration returns an empty list. No credentials, tester IDs, or token endpoints are exposed.
      responses:
        '200':
          description: Configured providers. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ExternalProvider'}
  /user/connections:
    get:
      tags: [Users]
      summary: List the active user's external account connections
      security: [{bearerAuth: []}]
      description: Owned projections only. External subjects, credentials and request secrets are omitted. Works when providers are disabled.
      responses:
        '200':
          description: Owned connections. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ExternalAccountConnection'}
        '401': {description: Missing or invalid user authentication.}
        '403': {description: Withdrawn or banned account.}
        '500': {description: Connection storage failure.}
  /user/connections/start:
    post:
      tags: [Users]
      summary: Begin an external account connection using Authorization Code and PKCE S256
      security: [{bearerAuth: []}]
      description: |
        Accepts exactly one JSON document with optional trailing whitespace and rejects unknown fields.
        Creates a five-minute, one-use request bound to the exact current Musecat token.
        A new attempt cancels prior work for the user and issuer. Only registered services
        and fixed HTTPS endpoints are used. The caller cannot supply an external subject or URL.
        Runtime default limit is 10 requests per client IP per 600 seconds across both audiences.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalConnectionStart'}
      responses:
        '200':
          description: Authorization URL and expiry. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_at]
                properties:
                  authorization_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        '400': {description: Invalid input, unknown or duplicate game service.}
        '401': {description: Missing, invalid or changed initiating session.}
        '403': {description: Withdrawn or banned account.}
        '413': {description: Body exceeds 16384 bytes.}
        '429': {description: Request rate limit exceeded.}
        '500': {description: Connection storage failure.}
        '503': {description: Linking is disabled or the provider is not configured.}
  /partner/v1/records/invalidate:
    post:
      tags: [External Connections]
      operationId: invalidatePartnerRecords
      summary: Immediately remove cached records after a partner selection or privacy change
      description: B-only and joint apps use the Musecat-issued records key. Idempotently purges only the authenticated provider's matching subject and service, without revealing whether a connection exists. A fetch already in flight cannot republish its old selection. Send after committing the reduced selection, retry failures durably, and do not claim completion until 204. Subsequent owner/background reads fetch the new selection.
      security: [{partnerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sub, service]
              properties:
                sub: {type: string, minLength: 1, maxLength: 256}
                service: {type: string}
      responses:
        '204': {description: Purged or no matching connection. No identities returned.}
        '400': {description: Invalid subject or undeclared service.}
        '401': {description: Missing or invalid Musecat-issued records key.}
        '429': {description: Retry with backoff.}
  /user/records:
    get:
      tags: [Users]
      summary: Public game records a user has published
      description: Anonymous. Returns only services the user set public in Musecat whose currently configured provider/service has a cached partner envelope with public visibility, status ok and age below 24 hours. Served from cache (refreshed hourly for published records); never triggers a partner request. Cache-Control public, max-age=300.
      parameters: [{name: user, in: query, required: true, schema: {type: string}}]
      responses:
        '200': {description: Published records., content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ExternalPublicRecord'}}}}}}}
        '400': {description: Missing user id.}
        '404': {description: Unknown or withdrawn user.}
  /user/connections/{id}/records/{service}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: service, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Users]
      summary: Owner view of one cached game record, fetching when stale
      security: [{bearerAuth: []}]
      description: Fetches from the partner when no cache exists or it is older than 24 hours; refresh=true forces a fetch unless one ran within the last minute or persisted upstream Retry-After backoff is still active. An expired access token is refreshed once and re-sealed. Partner records_private or a private envelope yields status private with no payload; the partner subject is validated against the connection and never returned.
      parameters: [{name: refresh, in: query, required: false, schema: {type: boolean}}]
      responses:
        '200': {description: Record view. Cache-Control is no-store., content: {application/json: {schema: {$ref: '#/components/schemas/ExternalRecordView'}}}}
        '401': {description: Missing, invalid or changed session.}
        '403': {description: Withdrawn or banned account.}
        '404': {description: Missing connection, another user's connection, or service not granted.}
  /user/connections/{id}/services/{service}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: service, in: path, required: true, schema: {type: string}}]
    put:
      tags: [Users]
      summary: Set the Musecat-side publication switch for one game service
      security: [{bearerAuth: []}]
      description: public shows the service on the public profile only when the partner envelope is also public. Default is private. Never changes partner data.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [visibility], properties: {visibility: {type: string, enum: [public, private]}}}}}}
      responses:
        '200': {description: Updated grant., content: {application/json: {schema: {$ref: '#/components/schemas/ExternalServiceConnection'}}}}
        '400': {description: Invalid visibility.}
        '404': {description: Missing connection or service.}
  /user/connections/complete:
    post:
      tags: [Users]
      summary: Verify the approved external account and persist private game grants
      security: [{bearerAuth: []}]
      description: |
        Requires the same Musecat token as start. The BFF forwards the code, state and issuer
        from its provider-specific callback. Code exchange and authenticated user-info lookup
        occur outside transactions. The server rechecks session validity, account restrictions,
        issuer, expiry and live request before persistence. One claim consumes each attempt;
        denied and failed exchanges require a fresh start. Reauthorization replaces game consent
        with the requested services whose scopes were actually granted; grants default private.
        Runtime default limit is 20 requests per client IP per 600 seconds across both audiences.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalConnectionComplete'}
      responses:
        '200':
          description: Safe connection projection. Cache-Control is no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalAccountConnection'}
        '400': {description: Invalid, denied, expired, replayed, superseded or disconnected attempt, wrong session or issuer.}
        '401': {description: Missing or invalid authentication, including credentials changed during exchange.}
        '403': {description: Withdrawn or banned account, including restrictions added during exchange.}
        '409': {description: Identity belongs to another Musecat user or a different external account is already connected for this issuer. No transfer occurs.}
        '413': {description: Body exceeds 16384 bytes.}
        '429': {description: Request rate limit exceeded.}
        '500': {description: Connection storage failure.}
        '502': {description: Provider exchange, identity lookup or identity validation failed. No provider error or credential is exposed.}
        '503': {description: Provider disabled, unavailable or pending verifier cannot be decrypted.}
  /user/connections/{id}:
    delete:
      tags: [Users]
      summary: Locally unlink an owned external account
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      description: |
        Atomically deletes the owned account, encrypted credentials, child game grants and pending
        attempts for its issuer. This fences in-flight callbacks. Works with disabled providers.
        Does not call or imply remote provider token revocation. No partner delegation is affected.
      responses:
        '204': {description: Local unlink completed. Cache-Control is no-store.}
        '401': {description: Missing or invalid current user session.}
        '403': {description: Withdrawn or banned account.}
        '404': {description: Missing connection or connection owned by another user.}
        '500': {description: Connection storage failure.}

  /.well-known/oauth-authorization-server:
    get:
      tags:
      - OAuth delegation
      summary: Discover the configured OAuth endpoints and supported capabilities
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request or invalid grant.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '401':
          description: Invalid session, client or delegated token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '403':
          description: Restricted user or insufficient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '429':
          description: Rate limited.
        '503':
          description: OAuth is not configured.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
  /oauth/authorize:
    get:
      description: Authorization Code with PKCE S256. OpenID requests additionally require nonce (16-512 non-whitespace characters) and an application approved for login. The readonly login bundle is openid profile arcade:read. Optional response_mode must be query. Unsupported authorization parameters are rejected.
      tags:
      - OAuth delegation
      summary: Start authorization and redirect to the Musecat consent application
      responses:
        '400':
          description: Invalid request or invalid grant.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '401':
          description: Invalid session, client or delegated token.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '403':
          description: Restricted user or insufficient scope.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '429':
          description: Rate limited.
        '503':
          description: OAuth is not configured.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '302':
          description: Consent-page redirect, or a protocol error redirected only to
            the registered callback. Invalid clients, callbacks and ambiguous input
            remain local errors.
          headers:
            Location:
              schema:
                type: string
                format: uri
      parameters:
      - name: nonce
        in: query
