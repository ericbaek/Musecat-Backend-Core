  /native/arcade/edit_report:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/edit_report. Responses are no-store.
    post:
      tags: [Arcade Mutations]
      summary: /arcade/edit_report
      description: Creates an independent abuse report linked to one immutable changelog row. The server derives the reported editor; unresolved duplicates for the same arcade/changelog return `409`.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateArcadeEditReportRequest'}
      responses:
        '200':
          description: Edit report queued for manual review. This endpoint does not roll back or ban automatically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeEditReport'}
        '400':
          description: Invalid parent id, message, or urgency.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '404':
          description: Arcade/changelog mismatch or inaccessible private arcade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: An unresolved report already exists for this changelog.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

