  /native/user/notifications/apns:
    description: Full supplies explicit APNs provider configuration. All routes require opaque native sessions, active accounts, no-store responses and at most 4096 encoded body bytes. No provider key or raw device token is returned.
    get:
      tags: [Users]
      summary: Check APNs availability before requesting OS notification permission
      security: [{nativeBearer: []}]
      responses:
        '200':
          description: Configuration availability, not proof that a particular device has registered.
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: {type: boolean}
                  environment: {type: string, enum: [sandbox, production], description: Present only when available.}
                  topic: {type: string, description: Configured bundle identifier; present only when available.}
        '401': {description: Active opaque native session required.}
    put:
      tags: [Users]
      summary: Register a real APNs device token for this native account and session family
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, locale]
              properties:
                token: {type: string, minLength: 2, maxLength: 1024, pattern: '^(?:[a-fA-F0-9]{2})+$', description: Variable-length hexadecimal device token obtained from the OS callback.}
                locale: {type: string, enum: [ko, en, ja]}
      responses:
        '200':
          description: Device registered or refreshed. Token rotation within one native session and topic/environment retains the device ID, preferences and pending deliveries. A different session adopting the same endpoint receives a new device ID; old queued deliveries and preferences cascade on transfer. Existing inbox events are not backfilled.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, device]
                properties:
                  enabled: {type: boolean, const: true}
                  device: {type: string, description: Account-scoped device record ID, retained by the client for removal and testing.}
        '400': {description: Invalid token or locale.}
        '401': {description: Active opaque native session required.}
        '413': {description: Body exceeds 4096 bytes.}
        '429': {description: Registration rate limit exceeded.}
        '503': {description: APNs configuration absent; code APNS_UNAVAILABLE. No registration is written.}
    delete:
      tags: [Users]
      summary: Remove only this account's APNs device and cascading queued deliveries/preferences
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: {type: string, maxLength: 15}
      responses:
        '200':
          description: Own registration removed; missing/foreign/non-APNs device IDs are harmless no-ops. Removal remains available when provider configuration is disabled.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean, const: false}
        '400': {description: Device is required.}
        '401': {description: Active opaque native session required.}
        '413': {description: Body exceeds 4096 bytes.}
  /native/arcade/apns-subscription/status:
    post:
      tags: [Users]
      security: [{nativeBearer: []}]
      summary: Read effective current APNs report delivery preference including the owner default
      description: Uses the same device-linked report preference and delivery policy as browser notifications. Status and enabling require arcade management access. Removal only requires ownership of the APNs device and cancels queued report deliveries for this arcade. Body limit 4096 bytes; no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, device]
              properties:
                arcade: {type: string, maxLength: 15}
                device: {type: string, maxLength: 15}
      responses:
        '200':
          description: Effective delivery preference.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
        '400': {description: Arcade and device are required.}
        '401': {description: Active opaque native session required.}
        '403': {description: Arcade management access required for status and enabling.}
        '404': {description: Arcade unavailable or device is not this account's APNs registration.}
        '413': {description: Body exceeds 4096 bytes.}
  /native/arcade/apns-subscription:
    put:
      tags: [Users]
      security: [{nativeBearer: []}]
      summary: Enable APNs report delivery for an eligible manager
      description: Uses the same device-linked report preference and delivery policy as browser notifications. Status and enabling require arcade management access. Removal only requires ownership of the APNs device and cancels queued report deliveries for this arcade. Body limit 4096 bytes; no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, device]
              properties:
                arcade: {type: string, maxLength: 15}
                device: {type: string, maxLength: 15}
      responses:
        '200':
          description: Preference saved atomically.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {description: Arcade and device are required.}
        '401': {description: Active opaque native session required.}
        '403': {description: Arcade management access required for status and enabling.}
        '404': {description: Arcade unavailable or device is not this account's APNs registration.}
        '413': {description: Body exceeds 4096 bytes.}
    delete:
      tags: [Users]
      security: [{nativeBearer: []}]
      summary: Opt this device out of arcade reports without disabling other notifications
      description: Uses the same device-linked report preference and delivery policy as browser notifications. Status and enabling require arcade management access. Removal only requires ownership of the APNs device and cancels queued report deliveries for this arcade. Body limit 4096 bytes; no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, device]
              properties:
                arcade: {type: string, maxLength: 15}
                device: {type: string, maxLength: 15}
      responses:
        '200':
          description: Preference saved atomically.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {description: Arcade and device are required.}
        '401': {description: Active opaque native session required.}
        '403': {description: Arcade management access required for status and enabling.}
        '404': {description: Arcade unavailable or device is not this account's APNs registration.}
        '413': {description: Body exceeds 4096 bytes.}
