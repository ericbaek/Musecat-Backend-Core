      summary: "/arcade/draft"
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /arcade/draft. Management operations are excluded even for staff.

        Reads a private draft only for its creator or a `developer|moderator`. Public records are intentionally rejected; clients use `/arcade` for public reads.
      security:
      - delegatedOAuth:
