              schema:
                $ref: '#/components/schemas/ArcadeNotice'
        '400':
          description: Invalid JSON or missing notice id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
