        as GET /user/visits. Management operations are excluded even for staff.
  /developer/v1/account/arcade/analytics/event:
    post:
      tags:
      - Connected account
      summary: "/arcade/analytics/event"
      description: |-
        Requires account:access. Same payload, response and domain checks as POST /arcade/analytics/event. Management operations are excluded even for staff.

        Records an anonymous direction-click analytics event. The request body is limited to
        2 KiB and accepts at most ten distinct game-series IDs. To limit anonymous metric
        manipulation, each client IP may record at most 20 events per rolling 10 minutes and
        may record an event for the same arcade only once every 30 seconds. Once the arcade is
        validated, rejected series IDs also consume this quota before their database lookup. The server does
        not persist the client IP, user agent, or identity; limits are process-local and retain
        no more than 4,096 active clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ArcadeAnalyticsEventRequest"
      responses:
        '200':
          description: Analytics event recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                - recorded
                properties:
                  recorded:
                    type: boolean
                    const: true
        '400':
          description: Invalid event body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '413':
          description: Analytics event body exceeds 2 KiB.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '429':
          description: Anonymous client exceeded the per-arcade cooldown or rolling
            event limit. The `Retry-After` header is included.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until this anonymous client may retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Analytics event persistence failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
  /developer/v1/account/arcade/edit_report:
    post:
      tags:
      - Connected account
      summary: "/arcade/edit_report"
      description: |-
        Requires account:access. Same payload, response and domain checks as POST /arcade/edit_report. Management operations are excluded even for staff.

        Creates an independent abuse report linked to one immutable changelog row. The server derives the reported editor; unresolved duplicates for the same arcade/changelog return `409`.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateArcadeEditReportRequest"
      responses:
        '200':
          description: Edit report queued for manual review. This endpoint does not
            roll back or ban automatically.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeEditReport"
        '400':
          description: Invalid parent id, message, or urgency.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '404':
          description: Arcade/changelog mismatch or inaccessible private arcade.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: An unresolved report already exists for this changelog.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
  /developer/v1/account/arcade/flag:
    post:
      tags:
      - Connected account
      summary: "/arcade/flag"
      description: |-
        Requires account:access. Same payload, response and domain checks as POST /arcade/flag. Management operations are excluded even for staff.

        Private drafts require the creator or a developer/moderator. Public arcades have no editor level threshold. Accepts at most 3 images, 15000000 bytes each, within a 46048576-byte encoded request body.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateArcadeFlagRequest"
          multipart/form-data:
            schema:
              type: object
              required:
              - arcade
              - game_id
              - disruption
              - message
              properties:
                arcade:
                  type: string
                game_id:
                  type: string
                disruption:
                  type: string
                  enum:
                  - unplayable
                  - major
                  - bearable
                  - minor
                message:
                  type: string
                photos:
                  type: array
                  maxItems: 3
                  description: Images only; at most 15000000 bytes per file. Server
                    verifies contents.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Flag created and linked to the durable game entry.
          content:
            application/json:
              schema:
                type: object
                required:
                - arcade
                - game_id
                - flag
                - game
                - xp_feedback
                properties:
                  arcade:
                    type: string
                  game_id:
                    type: string
                  flag:
                    type: string
                  game:
                    "$ref": "#/components/schemas/ArcadeGameExpanded"
                  xp_feedback:
                    "$ref": "#/components/schemas/XpFeedback"
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '413':
          description: File or encoded request body exceeds its limit.
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
