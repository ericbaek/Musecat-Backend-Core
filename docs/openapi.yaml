        Streams one photo through the custom API. A published photo of a public arcade is anonymous-readable and privately browser-cacheable for five minutes. Pending or draft photos require a bearer token with atom-list access and are never cached. Clients must use the returned `file_url`, not PocketBase `/api/files` URLs. Supported thumbnail queries return the configured derivative and never silently fall back to the original file.
