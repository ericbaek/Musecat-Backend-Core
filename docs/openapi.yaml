      tags: [Support, Users]
      summary: List the authenticated user's own feedback
      description: Active users only. Ownership is forced from the bearer token; createdBy query values are ignored. Anonymous submissions and other users' records are never returned. Includes all statuses unless filtered, with id, message, status, createdBy, photos (filenames), created and updated. This does not grant file access or open the reviewer queue.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Own records ordered newest first, with items and total; an empty history returns an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '401': {description: Missing or invalid user token.}
        '403': {description: Withdrawn or banned user.}
        '502': {description: List failure.}
  /support_feedback:
