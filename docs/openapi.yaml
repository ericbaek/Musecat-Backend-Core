  /developer/services:
    get:
      tags: [Developer Center]
      summary: Public registry of onboarding spec, consent manifests and canonical service IDs
      responses:
        '200':
          description: Registry. Cacheable for one hour.
          content:
            application/json:
              schema:
                type: object
                required: [spec, manifests, services]
                properties:
                  spec: {type: string}
                  manifests: {type: array, items: {type: string}}
                  services: {type: array, items: {type: string}}
  /developer/apps:
    get:
      tags: [Developer Center]
      summary: List the active user's partner applications
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Owned applications. Cache-Control is no-store., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplicationList'}}}}
        '401': {description: Missing or invalid user authentication.}
        '403': {description: Withdrawn or banned account.}
    post:
      tags: [Developer Center]
      summary: Register an owner-and-tester development application
      security: [{bearerAuth: []}]
      description: Accepts exactly one JSON document with optional trailing whitespace and rejects unknown fields. Validates the form structurally. At most 8 applications per owner. partner_id must not collide with another application or an executable-configured client. Runtime default limit is 30 requests per client IP per 600 seconds.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerOnboardingForm'}}}}
      responses:
        '201': {description: Registered in development mode immediately (status approved is retained for compatibility)., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '400':
          description: Malformed body or field errors.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string, enum: [invalid_form]}
                  fields: {type: object, additionalProperties: {type: string}}
        '401': {description: Missing or invalid user authentication.}
        '403': {description: Withdrawn or banned account.}
        '409': {description: partner_id_conflict, or invalid_state when the owner limit is reached.}
        '413': {description: Body exceeds 65536 bytes.}
        '429': {description: Request rate limit exceeded.}
  /developer/apps/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Developer Center]
      summary: Read an owned partner application
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Application., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '401': {description: Missing or invalid user authentication.}
        '404': {description: Missing or another user's application.}
    put:
      tags: [Developer Center]
      summary: Save a development form or propose a production change
      security: [{bearerAuth: []}]
      description: Development changes activate immediately for the owner and designated testers. Production changes update submitted_form while the reviewed approved_form stays live until production approval. An edit clears pending review. partner_id is immutable. Suspended apps cannot be edited.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerOnboardingForm'}}}}
      responses:
        '200': {description: Updated active registration., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '400': {description: Field errors (see POST /developer/apps).}
        '404': {description: Missing or another user's application.}
        '409': {description: partner_id_conflict or invalid_state.}
  /developer/apps/{id}/submit:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Developer Center]
      summary: Request production review
      security: [{bearerAuth: []}]
      responses:
        '200': {description: review_status is submitted; active development or production configuration remains usable., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '400': {description: Invalid form or non-HTTPS/loopback production callback.}
        '404': {description: Missing or another user's application.}
        '409': {description: invalid_state.}
  /developer/apps/{id}/secret:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Developer Center]
      summary: Generate (or rotate) the OAuth client secret; plaintext is returned exactly once
      security: [{bearerAuth: []}]
      description: Requires an approved, non-suspended application with nonempty Direction A redirects; B-only applications return 409 invalid_state. Only the hash is stored. Rotation changes the registration fingerprint and invalidates existing grants for the client. The registration becomes live immediately on this instance and within one minute on others.
      responses:
        '200':
          description: One-time secret. Cache-Control no-store, Referrer-Policy no-referrer.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret]
                properties:
                  client_id: {type: string}
                  client_secret: {type: string}
        '404': {description: Missing or another user's application.}
        '409': {description: invalid_state.}
        '503': {description: oauth_not_configured.}
  /developer/apps/{id}/credentials:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    put:
      tags: [Developer Center]
      summary: Store the partner-issued Musecat client credentials for Direction B
      security: [{bearerAuth: []}]
      description: Sealed with the connection key and bound to this application; never returned. Allowed once the submitted or approved form declares direction_b. Activates the external provider immediately when the approved form declares it; duplicate issuer/callback with another live provider returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id: {type: string, maxLength: 256}
                client_secret: {type: string, minLength: 16, maxLength: 512}
      responses:
        '200': {description: Updated projection., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '400': {description: invalid_form with fields.credentials.}
        '404': {description: Missing or another user's application.}
        '409': {description: invalid_state (no direction_b declared or suspended) or partner_id_conflict (issuer/callback collision).}
        '503': {description: connections_not_configured (no MUSECAT_CONNECTION_ENCRYPTION_KEY).}
    delete:
      tags: [Developer Center]
      summary: Remove stored credentials and deactivate Direction B
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated projection., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '404': {description: Missing or another user's application.}
  /developer/apps/{id}/events:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Developer Center]
      summary: Audit timeline of an owned application
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Newest first, at most 100.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PartnerApplicationEvent'}}
        '404': {description: Missing or another user's application.}
  /moderation/developer/apps:
    get:
      tags: [Developer Center]
      summary: Operator queue of partner applications
      security: [{bearerAuth: []}]
      description: Requires developer or moderator access. Without a status filter, drafts are excluded.
      parameters: [{name: status, in: query, required: false, schema: {type: string, enum: [draft, submitted, approved, rejected, suspended]}}]
      responses:
        '200': {description: Queue, newest update first., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplicationList'}}}}
        '401': {description: Missing or invalid user authentication.}
        '403': {description: Operator access required.}
  /moderation/developer/apps/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Developer Center]
      summary: Inspect any partner application
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Application., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '403': {description: Operator access required.}
        '404': {description: Application not found.}
  /moderation/developer/apps/{id}/events:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Developer Center]
      summary: Audit timeline of any application
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Events., content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PartnerApplicationEvent'}}}}}}}
        '403': {description: Operator access required.}
  /moderation/developer/apps/{id}/approve:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Developer Center]
      summary: Approve the submitted form and activate the OAuth client registration
      security: [{bearerAuth: []}]
      description: Requires a pending production request. Installs its submitted_form as the production approved_form and sets publication production after validation; development loopback callbacks cannot be approved. Validates the merged registry before activating. Direction A serves tokens once the owner generates a secret. B-only applications do not create an OAuth client; their provider activates independently after partner-issued credential entry. A partner_id owned by an executable-configured client cannot be approved.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerReviewInput'}}}}
      responses:
        '200': {description: Approved., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '400': {description: Stored form no longer validates.}
        '403': {description: Operator access required.}
        '404': {description: Application not found.}
        '409': {description: invalid_state (not submitted) or partner_id_conflict.}
        '503': {description: oauth_not_configured.}
  /moderation/developer/apps/{id}/reject:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Developer Center]
      summary: Reject a submitted application with a note
      security: [{bearerAuth: []}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerReviewInput'}}}}
      responses:
        '200': {description: Rejected; a previously approved form stays live., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '403': {description: Operator access required.}
        '404': {description: Application not found.}
        '409': {description: invalid_state.}
  /moderation/developer/apps/{id}/suspend:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Developer Center]
      summary: Suspend an application; its OAuth client stops immediately
      security: [{bearerAuth: []}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerReviewInput'}}}}
      responses:
        '200': {description: Suspended. Existing tokens fail with 503 temporarily_unavailable., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '403': {description: Operator access required.}
        '404': {description: Application not found.}
        '409': {description: invalid_state (already suspended).}
  /moderation/developer/apps/{id}/reinstate:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Developer Center]
      summary: Reinstate a suspended application without issuing a new secret
      security: [{bearerAuth: []}]
      description: Returns to approved, or to draft when the owner had edited the form before suspension.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerReviewInput'}}}}
      responses:
        '200': {description: Reinstated., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '403': {description: Operator access required.}
        '404': {description: Application not found.}
        '409': {description: invalid_state.}

  /integrations/joint:
    get:
      summary: List active joint partner IDs
      description: Anonymous callers see production partners. An authenticated owner or tester also sees their development partners.
      responses:
        '200': {description: Sorted IDs, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: string}}}}}}}
  /user/joint:
    get:
      summary: List own joint connections and pending remote revocations
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Own status projections, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/JointStatus'}}}}}}}
        '401': {description: Active user session required.}
  /user/joint/begin:
    post:
      summary: Start joint connection from Musecat
      security: [{bearerAuth: []}]
      description: return_to must match the configured consent web origin and /{locale}/connect/{partner}. Query strings and external origins are rejected.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [partner, return_to], properties: {partner: {type: string}, return_to: {type: string, format: uri}}}}}}
      responses:
        '200': {description: Partner start URL and new correlation UUID, content: {application/json: {schema: {type: object, properties: {start_url: {type: string, format: uri}, correlation_id: {type: string, format: uuid}}}}}}
        '400': {description: Invalid registered return URL.}
        '503': {description: Joint connection unavailable.}
  /user/joint/lookup:
    post:
      summary: Resolve a partner intent and bind the consent to the current session
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [partner, intent], properties: {partner: {type: string}, intent: {type: string, minLength: 43, maxLength: 512}}}}}}
      responses:
        '200': {description: Consent identities and service summary, content: {application/json: {schema: {$ref: '#/components/schemas/JointConsent'}}}}
        '400': {description: Invalid, expired, consumed or differently bound intent.}
        '502': {description: Partner lookup failed.}
  /user/joint/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Read the session-bound joint consent
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Consent summary, content: {application/json: {schema: {$ref: '#/components/schemas/JointConsent'}}}}
        '404': {description: Missing or foreign attempt.}
    delete:
      summary: Disconnect both sides
      security: [{bearerAuth: []}]
      description: Locally revokes only matching generations and atomically queues remote revocation. Independent later grants survive.
      responses:
        '204': {description: Local access revoked; remote notification may be pending.}
        '404': {description: Missing or foreign attempt.}
  /user/joint/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Recheck both verified joint connection legs
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Live status, content: {application/json: {schema: {$ref: '#/components/schemas/JointStatus'}}}}
  /user/joint/{id}/approve:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Approve the joint manifest once
      security: [{bearerAuth: []}]
      description: Claims the attempt atomically, issues the Direction A code, calls partner receipts, redeems the Direction B code and verifies its subject. Failed/ambiguous requests require a fresh attempt.
      responses:
        '200': {description: Registered partner callback, content: {application/json: {schema: {type: object, properties: {redirect_uri: {type: string, format: uri}}}}}}
        '400': {description: Expired, consumed or different session.}
        '502': {description: Partner exchange failed; partial state retained.}
  /user/joint/{id}/deny:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Deny a pending joint connection
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Partner callback carrying access_denied, content: {application/json: {schema: {type: object, properties: {redirect_uri: {type: string, format: uri}}}}}}
  /partner/v1/joint/{correlation_id}:
    parameters:
      - {name: correlation_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/PartnerRequestId'}
    get:
      summary: Partner polls only its own joint attempt
      security: [{partnerBearer: []}]
      responses:
        '200': {description: Verified joint state, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerJointStatus'}}}}
        '401': {description: unauthorized_partner.}
        '404': {description: Unknown pair.}
  /partner/v1/revocations:
    post:
      summary: Revoke exactly one joint generation
      security: [{partnerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/PartnerRequestId'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [pair_id, generation, reason, revoked_at], properties: {pair_id: {type: string, format: uuid}, generation: {type: string, minLength: 1, maxLength: 64}, reason: {type: string, enum: [user, security, admin, superseded]}, revoked_at: {type: string, format: date-time}}}}}}
      responses:
        '200': {description: Idempotent generation-specific result, content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [revoked, already_revoked, unknown_generation]}}}}}}
        '400': {description: invalid_request.}
        '401': {description: unauthorized_partner.}
        '409': {description: Request ID reused with a different body.}
  /developer/apps/{id}/joint-key:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    put:
      summary: Store the partner-issued joint server key (sealed, write-only)
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [key], properties: {key: {type: string, minLength: 43, maxLength: 512, writeOnly: true}}}}}}
      responses:
        '200': {description: Updated activation flags, content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
  /developer/apps/{id}/partner-key:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Issue or rotate the Musecat partner bearer key (revealed once)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: New key; previous hash accepted for the registered rotation window, content: {application/json: {schema: {type: object, properties: {partner_id: {type: string}, key: {type: string}}}}}}

  /developer/apps/{id}/checks:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{15}$'}}
    get:
      summary: Read the latest ten conformance reports
      security: [{bearerAuth: []}]
      description: Application owner only; foreign IDs return 404. Reports exclude fixtures, remote bodies and credentials. current is false after form/credential changes or after 30 days.
      responses:
        '200': {description: Safe check history., content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ConformanceReport'}}}}}}}
        '401': {description: Active session required.}
        '403': {description: Operator access required on moderation routes.}
        '404': {description: Application not found.}
    post:
      summary: Queue an asynchronous conformance run
      security: [{bearerAuth: []}]
      description: >-
        Probes registered HTTPS endpoints only. Runs start within one minute; at most one
        run is active per app, three per actor, and a one-minute application cooldown applies.
        Missing staging fixtures are action_required, never pass. Refresh tests require explicit
        destructive consent and revoke the supplied disposable family. Fixtures are encrypted
        while queued and wiped on completion, cancellation or interrupted-run recovery.
        Execution never grants OAuth consent or approves an application.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ConformanceFixtures'}}}}
      responses:
        '202': {description: Queued., content: {application/json: {schema: {$ref: '#/components/schemas/ConformanceReport'}}}}
        '400': {description: Invalid fixtures or missing destructive consent.}
        '401': {description: Active session required.}
        '403': {description: Operator access required on moderation routes.}
        '404': {description: Application not found.}
        '409': {description: Suspended application.}
        '429': {description: checks_busy; active run or cooldown.}
  /moderation/developer/apps/{id}/checks:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{15}$'}}
    get:
      summary: Read the latest ten conformance reports
      security: [{bearerAuth: []}]
      description: Active operator access required. Reports exclude fixtures, remote bodies and credentials. current is false after form/credential changes or after 30 days.
      responses:
        '200': {description: Safe check history., content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ConformanceReport'}}}}}}}
        '401': {description: Active session required.}
        '403': {description: Operator access required on moderation routes.}
        '404': {description: Application not found.}
    post:
      summary: Queue an asynchronous conformance run
      security: [{bearerAuth: []}]
      description: >-
        Probes registered HTTPS endpoints only. Runs start within one minute; at most one
        run is active per app, three per actor, and a one-minute application cooldown applies.
        Missing staging fixtures are action_required, never pass. Refresh tests require explicit
        destructive consent and revoke the supplied disposable family. Fixtures are encrypted
        while queued and wiped on completion, cancellation or interrupted-run recovery.
        Execution never grants OAuth consent or approves an application.
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ConformanceFixtures'}}}}
      responses:
        '202': {description: Queued., content: {application/json: {schema: {$ref: '#/components/schemas/ConformanceReport'}}}}
        '400': {description: Invalid fixtures or missing destructive consent.}
        '401': {description: Active session required.}
        '403': {description: Operator access required on moderation routes.}
        '404': {description: Application not found.}
        '409': {description: Suspended application.}
        '429': {description: checks_busy; active run or cooldown.}

  /developer/apps/{id}/console:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    get:
      tags: [Developer Center]
      summary: Read owned application activity and integration settings
      security: [{bearerAuth: []}]
      description: >-
        Owner-only, outside delegated account access. Returns issuer, approved active scopes and redirect_uris,
        connected_count for non-revoked current-config grants with unexpired token families,
        and at most 25 accounts (subject, optional name, scopes, connected). Each subject is pairwise for this
        app; names require profile consent and never include email or a global user ID. Account entries also
        verify account restrictions and token-key binding. Fourteen UTC usage rows expose day, api, codes,
        refreshes and errors. API includes userinfo and delegated resources. Counters start at rollout;
        unauthenticated/unattributable requests are excluded. No raw tokens, IPs, queries or bodies are stored.
        Aggregates are retained for 30 days. Responses use Cache-Control no-store.
      responses:
        '200':
          description: Console data; issuer, scopes, redirect_uris, connected_count, accounts, page, usage.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, scopes, redirect_uris, connected_count, accounts, page, usage]
                properties:
                  issuer: {type: string, format: uri}
                  scopes: {type: array, items: {type: string}}
                  redirect_uris: {type: array, items: {type: string, format: uri}}
                  connected_count: {type: integer, minimum: 0}
                  page: {type: integer, minimum: 1}
                  accounts: {type: array, maxItems: 25, items: {type: object, required: [subject, scopes, connected], properties: {subject: {type: string}, name: {type: string}, scopes: {type: array, items: {type: string}}, connected: {type: string, format: date-time}}}}
                  usage: {type: array, minItems: 14, maxItems: 14, items: {type: object, required: [day, api, codes, refreshes, errors], properties: {day: {type: string, format: date}, api: {type: integer}, codes: {type: integer}, refreshes: {type: integer}, errors: {type: integer}}}}
        '400': {description: Invalid pagination.}
        '401': {description: User session required.}
        '403': {description: Restricted account.}
        '404': {description: Missing or another owner's application.}
        '503': {description: OAuth delegation unavailable.}

  /user/arcade-inquiry-onboarding:
    get:
      tags: [Users, Arcade]
      summary: List current official owner's inquiry settings
      description: Active authenticated users only; reloads current exact arcade_owner role and owns relations. All currently owned arcades are returned, including configured arcades, including scoped private names. Staff-only and ordinary accounts receive empty items. Missing arcade relations are skipped; missing basic relations yield an empty name. Private no-store response.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unconfigured currently owned arcades.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [arcadeId, arcadeName, settings, reportSettings]
                      properties:
                        arcadeId: {type: string}
                        arcadeName: {type: string}
                        settings:
                          $ref: '#/components/schemas/InquirySettings'
                        reportSettings:
                          type: object
                          required: [mode, contactType, contactValue, guide]
                          properties:
                            mode: {type: string, enum: [internal, external]}
                            contactType: {type: string}
                            contactValue: {type: string, maxLength: 2048}
                            guide: {type: string, maxLength: 2000}
        '401': {description: Authentication required.}
        '403': {description: Inactive account.}
  /arcade/inquiry-settings:
    put:
      tags: [Arcade]
      summary: Configure arcade inquiry destination
      description: Current official owners assigned to this arcade and strict developer/moderator accounts only. Independent of fault-report settings. External mode requires an HTTP(S) URL or phone. Missing/invalid saved mode defaults to disabled with configured false. Explicit modes return derived configured true; client configured is ignored and never persisted. Disabled requires no contact. Existing conversations remain readable and replyable. No XP or arcade changelog.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, mode]
              properties:
                arcade: {type: string}
                mode: {type: string, enum: [internal, external, disabled]}
                loginRequired: {type: boolean, default: false, description: Require an authenticated account for new internal arcade inquiries while a current official account exists.}
                contactType: {type: string, enum: [url, phone]}
                contactValue: {type: string, maxLength: 2048}
                guide: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Saved settings with derived configured true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquirySettings'
        '400': {description: Invalid or missing external contact.}
        '401': {description: Authentication required.}
        '403': {description: Not an assigned official owner or strict staff.}
        '404': {description: Arcade not found.}

