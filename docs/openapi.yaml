          application/json:
            schema:
              type: object
              required: [arcade, public, closed, country, timezone]
              properties:
                arcade: {type: string, minLength: 15, maxLength: 15}
                public: {type: boolean}
                closed: {type: boolean}
                country: {type: string, description: ISO 3166-1 alpha-2 code; trimmed and uppercased}
                timezone: {type: string, description: Valid IANA timezone name; Local is rejected}
      responses:
        '200':
          description: Updated arcade admin settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  arcade: {type: string}
                  public: {type: boolean}
                  closed: {type: boolean}
                  country: {type: string, description: ISO 3166-1 alpha-2 code; trimmed and uppercased}
                  timezone: {type: string, description: Valid IANA timezone name; Local is rejected}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Active developer or moderator required}
        '404': {description: Arcade not found}
  /moderation/arcade/edit-reports:
