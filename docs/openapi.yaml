        - account:access
      parameters:
      - name: arcade
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current XP preview for converting the private arcade to public.
          content:
            application/json:
              schema:
                type: object
                required:
                - arcade
                - public
                - level
                - requirements
                - location_verified
                - xp_preview
                properties:
                  arcade:
                    type: string
                  public:
                    type: boolean
                    const: false
                  level:
                    type: integer
                  requirements:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ArcadePublicRequirement"
                  location_verified:
                    type: boolean
                  xp_preview:
                    "$ref": "#/components/schemas/ArcadePublicExpPreview"
        '400':
          description: Missing arcade id, closed arcade, or already-public arcade.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Only the draft creator may preview its public-conversion XP.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to calculate the XP preview.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Connected account
      summary: "/arcade/public"
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ArcadeOnlyRequest"
      responses:
        '200':
          description: Arcade is now public. The creator receives 5 XP for the conversion
            plus 2 XP for each eligible draft information area that has not already
            received its backfill.
          content:
            application/json:
              schema:
                type: object
                required:
                - arcade
                - public
                - xp_feedback
                properties:
                  arcade:
                    type: string
                  public:
                    type: boolean
                  xp_feedback:
                    "$ref": "#/components/schemas/XpFeedback"
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Only the private arcade creator may request public conversion.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Validation or update failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      description: Requires account:access. Same payload, response and domain checks
