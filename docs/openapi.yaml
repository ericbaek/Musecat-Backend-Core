      summary: Read protected game catalog management data
      description: Active developer or moderator, or an active supporter or founding supporter at level 30 or above. Historical version aliases (non-empty alias_of) are omitted from the versions list without deleting their records or historical references. Cabinets are ordered by the earliest release date among active compatible versions, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [en-US, ko-KR, ja-JP]
      responses:
        '200':
          description: Full catalog management view.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Moderator]
      summary: Create a catalog item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Created item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Duplicate or conflicting operation. }
    put:
      tags: [Moderator]
      summary: Update a catalog item with optimistic concurrency
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Updated item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Stale revision or dependency conflict. }
    delete:
      tags: [Moderator]
      summary: Archive a catalog item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Archived item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Item is referenced by active data. }
  /moderation/game/catalog/restore:
    post:
      tags: [Moderator]
      summary: Restore an archived catalog item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Restored item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
  /moderation/game/catalog/compatibilities:
    post:
      tags: [Moderator]
      summary: Atomically replace a version's compatible cabinet set
      description: Reconciles creates, restores, and archives in one transaction. The expected active revisions reject stale checklist submissions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogCompatibilityMutationRequest'
      responses:
        '200':
          description: The complete resulting compatibility set and immutable audit rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogCompatibilityMutationResponse'
        '409': { description: Stale checklist, incompatible cabinet, or a link referenced by active data. }
