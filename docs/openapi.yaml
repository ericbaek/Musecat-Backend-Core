        after:
          anyOf:
            - {$ref: '#/components/schemas/ArcadeMemoDocument'}
            - {type: 'null'}
          description: Immutable Tiptap document, or null when absent/unavailable.
        before_status:
          type: string
          enum: [available, absent, unavailable]
        after_status:
          type: string
          enum: [available, absent, unavailable]
