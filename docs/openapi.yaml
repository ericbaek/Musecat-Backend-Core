openapi: 3.1.0
info:
  title: Musecat Backend API
  version: 2.0.0
  summary: API v2 wire contract for frontend-facing Musecat endpoints.
  description: |
    API v2 is a breaking cutover: frontend integrations use documented custom endpoints,
    not PocketBase collection REST. See `docs/architecture-contract.md` for authorization,
    state-transition, and migration rules.
servers:
  - url: http://localhost:8090
    description: Local development server
tags:
  - name: Meta
    description: Service metadata and helper endpoints.
  - name: Geo
    description: Country, timezone, and geocoding helper endpoints.
  - name: Search
    description: Public lookup endpoints for unified search.
  - name: Arcades
    description: Public arcade read endpoints.
  - name: Moderator
    description: Moderator-facing arcade and content review endpoints.
  - name: Support
    description: Supporter XP and request endpoints.
  - name: Users
    description: Public and authenticated user profile endpoints.
  - name: Community
    description: Community posts and delayed cached translations.
  - name: Arcade Mutations
    description: Authenticated arcade editing endpoints.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitQuery:
      name: limit
      in: query
      description: Positive integer limit. Endpoint-specific caps apply.
      schema:
        type: integer
        minimum: 1
    CountryQuery:
      name: country
      in: query
      description: Country code stored in `arcade.country`.
      schema:
        type: string
    UserIdQuery:
      name: id
      in: query
      description: Target record id.
      schema:
        type: string
    UsernameQuery:
      name: username
      in: query
      description: Target username.
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string
        code:
          type: string
    CommunityPostInput:
      type: object
      required: [body]
      properties:
        title:
          type: string
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 10000
        flair:
          type: string
          enum: [achievement, question, tip, news, event, art, chitchat]
          default: chitchat
        game_series:
          type: string
          description: Optional canonical game_series id.
    CommunityPost:
      type: object
      required: [id, author, game_series, title, body, flair, locale, requested_locale, source_locale, translated, translation_status, editable_until, created, updated]
      properties:
        id: {type: string}
        author: {type: string}
        game_series: {type: string}
        title: {type: string}
        body: {type: string}
        flair: {type: string, enum: [achievement, question, tip, news, event, art, chitchat]}
        locale: {type: string, enum: [ko-KR, en-US, ja-JP]}
        requested_locale: {type: string, enum: [ko-KR, en-US, ja-JP]}
        source_locale: {type: string, enum: [ko-KR]}
        translated:
          type: boolean
          description: True only when a cached translation is served.
        translation_status: {type: string, enum: [pending, processing, ready, failed]}
        editable_until: {type: string, format: date-time}
        translated_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: string, maxLength: 0}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    CommunityPostList:
      type: object
      required: [page, per_page, last_page, total, items]
      properties:
        page: {type: integer}
        per_page: {type: integer}
        last_page: {type: integer}
        total: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: '#/components/schemas/CommunityPost'}
    PocketBaseAuthError:
      type: object
      required: [data, message, status]
      properties:
        data:
          type: object
          additionalProperties: true
        message:
          type: string
        status:
          type: integer
          example: 401
    Location:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    XpFeedback:
      type: object
      description: XP is awarded only when the authenticated user's account has a non-empty username. Before username setup, XP feedback reports no XP change.
      required:
        - previous_exp
        - new_exp
        - diff_exp
        - previous_percent_to_next_level
        - new_percent_to_next_level
        - previous_level
        - new_level
        - level_diff
        - remaining_exp_to_next_level
        - remaining_percent_to_next_level
      properties:
        previous_exp:
          type: integer
        new_exp:
          type: integer
        diff_exp:
          type: integer
        previous_percent_to_next_level:
          type: integer
          description: Progress percentage before the change. Use `100 - remaining_percent_to_next_level` semantics.
        new_percent_to_next_level:
          type: integer
          description: Progress percentage after the change. Use `100 - remaining_percent_to_next_level` semantics.
        previous_level:
          type: integer
        new_level:
          type: integer
        level_diff:
          type: integer
        remaining_exp_to_next_level:
          type: integer
        remaining_percent_to_next_level:
          type: integer
          description: Percent remaining to the next level. Use `100 - remaining_percent_to_next_level` for progress fill.
    ArcadePublicExpPreview:
      type: object
      required: [current_exp, public_exp, backfill_exp, estimated_exp, estimated_gain, xp_feedback]
      properties:
        current_exp:
          type: integer
          description: Creator's current XP before public conversion.
        public_exp:
          type: integer
          description: XP currently eligible from the public-conversion grant.
        backfill_exp:
          type: integer
          description: XP currently eligible from draft contributions and other backfilled grants. Draft arcade areas are backfilled once per arcade independently of the seven-day edit cooldown.
        estimated_exp:
          type: integer
          description: Estimated creator XP after a successful public conversion.
        estimated_gain:
          type: integer
          description: Estimated total XP increase. The PUT response is authoritative if the draft changes before conversion.
        xp_feedback:
          $ref: '#/components/schemas/XpFeedback'
    GeoLookupResponse:
      type: object
      required: [country, timezone]
      properties:
        country:
          type: string
        timezone:
          type: string
    GeocodeCandidate:
      type: object
      required: [address, lat, lon]
      properties:
        address:
          type: string
        road_address:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        place_id:
          type: string
    GeocodeResponse:
      type: object
      required: [provider, query, results]
      properties:
        provider:
          type: string
          enum: [google, kakao, osm]
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/GeocodeCandidate'
    ReverseGeocodeResponse:
      type: object
      required: [provider, lat, lon, address, display_name]
      properties:
        provider:
          type: string
          enum: [google, kakao, osm]
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        address:
          type: string
        road_address:
          type: string
        display_name:
          type: string
        place_id:
          type: string
    StatsResponse:
      type: object
      required: [arcade_count, changelog_count, flag_count]
      properties:
        arcade_count:
          type: integer
          format: int64
        changelog_count:
          type: integer
          format: int64
        flag_count:
          type: integer
          format: int64
    RankingProfile:
      type: object
      required: [id, nickname, username, avatar, primary_country, level, tags]
      properties:
        id: {type: string}
        nickname: {type: string}
        username: {type: string}
        avatar: {type: string}
        primary_country:
          type: string
          description: Primary profile country as an ISO 3166-1 alpha-2 code, or an empty string when unset.
        level: {type: integer}
        tags:
          type: array
          items: {type: string}
    RankingEntry:
      oneOf:
        - type: object
          required: [rank, score, profile]
          properties:
            rank: {type: integer}
            score: {type: integer, format: int64}
            profile: {$ref: '#/components/schemas/RankingProfile'}
            stats: {$ref: '#/components/schemas/RankingStats'}
        - type: object
          required: [rank, score, arcade]
          properties:
            rank: {type: integer}
            score: {type: integer, format: int64}
            arcade: {$ref: '#/components/schemas/RankingArcade'}
            stats: {$ref: '#/components/schemas/RankingArcadeStats'}
    RankingStats:
      type: object
      required: [travel_distance_km]
      properties:
        travel_distance_km: {type: integer, format: int64}
    RankingArcade:
      type: object
      required: [id, name, country]
      properties:
        id: {type: string}
        name: {type: string}
        country: {type: string}
    RankingArcadeStats:
      type: object
      required: [visit_count]
      properties:
        visit_count: {type: integer, format: int64}
    RankingResponse:
      type: object
      required: [metric, period, entries, viewer]
      properties:
        metric: {type: string, enum: [explorer, visits, xp, level, photographer, arcade_visits]}
        period: {type: string, enum: [week, month, half_year, year, all]}
        entries:
          type: array
          items: {$ref: '#/components/schemas/RankingEntry'}
        viewer:
          description: The authenticated user's own public leaderboard entry, or null when unauthenticated or not ranked.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RankingEntry'
    ArcadeVisitRankingEntry:
      type: object
      required: [rank, score, profile]
      properties:
        rank: {type: integer}
        score:
          type: integer
          format: int64
          description: XP earned from this arcade's completed visit verifications and arcade edit changelog grants.
        profile: {$ref: '#/components/schemas/RankingProfile'}
    ArcadeVisitRankingResponse:
      type: object
      required: [arcade, entries]
      properties:
        arcade: {type: string}
        entries:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/ArcadeVisitRankingEntry'}
    SearchUserItem:
      type: object
      required: [username, nickname, avatar, primary_country, level]
      properties:
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
          description: Avatar filename only.
        primary_country:
          type: string
          description: Primary profile country as an ISO 3166-1 alpha-2 code, or an empty string when unset.
        level: {type: integer}
    SearchArcadeItem:
      type: object
      required: [id, country, name, address, nickname, closed]
      properties:
        id:
          type: string
        country:
          type: string
        name:
          type: string
        address:
          type: string
        nickname:
          type: array
          items:
            type: string
        closed:
          type: boolean
        distance_km:
          type: number
          format: double
          description: Distance from the supplied user location in kilometers.
    SearchResponse:
      type: object
      required: [users, arcades]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/SearchUserItem'
        arcades:
          type: array
          items:
            $ref: '#/components/schemas/SearchArcadeItem'
    ArcadeSummary:
      type: object
      required: [id, country, game_series]
      properties:
        id:
          type: string
        country:
          type: string
        name:
          type: string
        address:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        game_series:
          type: array
          items:
            type: string
    ArcadeAdminSummary:
      type: object
      required: [id, public, closed, country, timezone, createdBy, created, updated]
      properties:
        id:
          type: string
        public:
          type: boolean
        closed:
          type: boolean
        country:
          type: string
        timezone:
          type: string
        createdBy:
          type: string
        created:
          type: string
        updated:
          type: string
    ArcadeBasicExpanded:
      type: object
      required: [id, name, address, direction, nickname, subway_line, location]
      properties:
        city_id: {type: string}
        id:
          type: string
        name:
          type: string
        address:
          type: string
        direction:
          type: string
        nickname:
          type: array
          items:
            type: string
        subway_line:
          type: array
          items:
            type: string
        location:
          $ref: '#/components/schemas/Location'
    DayHoursObject:
      type: object
      required: [start, end]
      properties:
        start:
          type: integer
          minimum: 0
          maximum: 2359
          description: HHMM integer.
        end:
          type: integer
          minimum: 0
          maximum: 2400
          description: HHMM integer. `2400` is only valid for 24-hour operation.
    DayHoursValue:
      oneOf:
        - $ref: '#/components/schemas/DayHoursObject'
        - type: integer
          const: 499
          description: Closed marker.
        - type: 'null'
          description: Unknown or unset.
      description: |
        Weekly opening hours value. Use `499` for closed, `null` for unknown, or an object with
        `start` and `end` HHMM values.
    ArcadeHourExpanded:
      type: object
      required: [id]
      properties:
        id:
          type: string
        Monday:
          $ref: '#/components/schemas/DayHoursValue'
        Tuesday:
          $ref: '#/components/schemas/DayHoursValue'
        Wednesday:
          $ref: '#/components/schemas/DayHoursValue'
        Thursday:
          $ref: '#/components/schemas/DayHoursValue'
        Friday:
          $ref: '#/components/schemas/DayHoursValue'
        Saturday:
          $ref: '#/components/schemas/DayHoursValue'
        Sunday:
          $ref: '#/components/schemas/DayHoursValue'
        Note:
          type: string
    ArcadeSnsItem:
      type: object
      required: [type, link]
      properties:
        type:
          type: string
        link:
          type: string
        name:
          type: string
    ArcadeSnsExpanded:
      type: object
      required: [id, items]
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeSnsItem'
    ArcadeGtkType:
      type: string
      enum:
        - Basket
        - FreeGloves
        - FreeSlipper
        - FreeWater
        - FreeDrumStick
        - FreeBachi
        - FreeWifi
        - Locker
        - Toilet
        - SmokingRoom
        - AC
        - Fan
        - Refrigerator
        - PowerOutlet
        - SellGloves
        - SellDrumStick
        - SellBachi
        - SellSlipper
        - SellDrink
        - SellFood
        - SellAmusementIC
        - SellAMPASS
        - Parking
        - ATM
        - SeatingArea
    ArcadeGtkItem:
      type: object
      required: [type, bool]
      properties:
        type:
          $ref: '#/components/schemas/ArcadeGtkType'
        bool:
          type: boolean
        note:
          type: string
        meta:
          $ref: '#/components/schemas/ParkingMeta'
    ArcadeGtkExpanded:
      type: object
      required: [id, items]
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeGtkItem'
    ParkingGeo:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
        lon:
          type: number
    ParkingMeta:
      type: object
      additionalProperties: false
      properties:
        geo:
          $ref: '#/components/schemas/ParkingGeo'
        availability:
          type: string
          enum: [always_plenty, somewhat_plenty, somewhat_difficult, difficult]
        options:
          type: array
          items:
            type: string
            enum: [free_parking_lot, paid_parking_lot, free_street_parking, paid_street_parking]
        ev_charging:
          type: boolean
        gov_parking:
          type: boolean
    ArcadeFlagReaction:
      type: object
      required: [id, reaction, createdBy, created, updated]
      properties:
        id:
          type: string
        reaction:
          type: string
        createdBy:
          type: string
        created:
          type: string
        updated:
          type: string
        resolutionContext:
          type: string
          enum: [legacy, report, vote]
          description: Legacy history, pre-vote report history, or current resolution vote context.
        voteRound:
          type: string
          description: Resolution round for fixed/wrong votes.
        levelSnapshot:
          type: integer
          minimum: 0
          description: Voter level captured when the current-round vote was created.
    ArcadeFlagMyReport:
      type: object
      required: [action, nextAt]
      properties:
        action:
          type: string
          enum: [add, delete, cooldown]
          description: Server-authorized next action for the authenticated user's latest issue_persist report.
        nextAt:
          oneOf:
            - type: string
            - type: 'null'
    ArcadeFlagResolution:
      type: object
      required: [state, round, startedAt, resolveAt, delaySeconds, fixedLevelTotal, wrongLevelTotal, score, fixedVoterCount, wrongVoterCount, myVote]
      properties:
        state:
          type: string
          enum: [idle, active]
        round:
          type: string
        startedAt:
          oneOf:
            - type: string
            - type: 'null'
        resolveAt:
          oneOf:
            - type: string
            - type: 'null'
        delaySeconds:
          type: integer
          minimum: 0
        fixedLevelTotal:
          type: integer
          minimum: 0
        wrongLevelTotal:
          type: integer
          minimum: 0
        score:
          type: integer
        fixedVoterCount:
          type: integer
          minimum: 0
        wrongVoterCount:
          type: integer
          minimum: 0
        myVote:
          oneOf:
            - type: string
              enum: [fixed, wrong]
            - type: 'null'
        myReport:
          oneOf:
            - $ref: '#/components/schemas/ArcadeFlagMyReport'
            - type: 'null'
    ArcadeFlagReportHistoryItem:
      type: object
      required: [id, kind, createdBy, created]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [initial, issue_persist]
        createdBy:
          type: string
        created:
          type: string
    ArcadeFlagExpanded:
      type: object
      required: [id, arcade, disruption, solved, message, photos, createdBy, created, updated, reactions, resolution, reportHistory]
      description: Open flag payload returned under game items or orphan flag lists.
      properties:
        id:
          type: string
        arcade:
          type: string
        disruption:
          type: string
        solved:
          type: boolean
        message:
          type: string
        photos:
          type: array
          items:
            type: string
        createdBy:
          type: string
        created:
          type: string
        updated:
          type: string
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeFlagReaction'
        resolution:
          $ref: '#/components/schemas/ArcadeFlagResolution'
        reportHistory:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeFlagReportHistoryItem'
        canWithdraw:
          type: boolean
          description: Whether the authenticated flag creator may withdraw this unresolved flag now.
    ArcadeGameArcade:
      type: object
      required: [id, country, name, address, location]
      properties:
        id:
          type: string
        country:
          type: string
        name:
          type: string
        address:
          type: string
        location:
          $ref: '#/components/schemas/Location'
    ArcadeGameVersion:
      type: object
      required: [id, series, released_on, en, kr, jp, price_default]
      properties:
        id:
          type: string
        series:
          oneOf:
            - type: string
            - type: 'null'
        released_on:
          oneOf:
            - type: string
            - type: 'null'
        en:
          type: string
        kr:
          type: string
        jp:
          type: string
        price_default:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
            - type: integer
            - type: number
            - type: 'null'
    ArcadeGameItem:
      type: object
      additionalProperties: true
      required: [id, updated]
      properties:
        arcade:
          oneOf:
            - $ref: '#/components/schemas/ArcadeGameArcade'
            - type: 'null'
        game:
          type: string
        version:
          oneOf:
            - $ref: '#/components/schemas/ArcadeGameVersion'
            - type: 'null'
        series:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        cabinet:
          oneOf:
            - $ref: '#/components/schemas/ArcadeGameCabinet'
            - type: string
            - type: 'null'
          description: |
            `GET /arcade` and expanded nearby game items return the catalog
            object. `GET /arcade/games` retains the canonical ID string.
            Unverified revisions return null in expanded game responses.
        location:
          type: string
        quantity:
          type: integer
        price:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
            - type: integer
            - type: number
            - type: 'null'
        tag:
          type: array
          items:
            type: object
            additionalProperties: true
        id:
          type: string
        updated:
          type: string
          description: Last time this specific game atom was edited.
        flags:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeFlagExpanded'
    ArcadeGameCabinet:
      type: object
      required: [id, en, kr, jp]
      properties:
        id:
          type: string
          description: Canonical `game_cabinet` record ID.
        en:
          type: string
        kr:
          type: string
        jp:
          type: string
    ArcadeGameExpanded:
      type: object
      required: [id, state_id, items]
      properties:
        id:
          type: string
        state_id:
          type: string
          description: Current immutable state batch id. This wire name is retained alongside `id`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeGameItem'
        orphanFlags:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeFlagExpanded'
    ArcadePhotoExpanded:
      type: object
      additionalProperties: true
      description: Expanded photo molecule payload.
    ArcadeBasicValue:
      oneOf:
        - type: string
        - type: 'null'
        - $ref: '#/components/schemas/ArcadeBasicExpanded'
    ArcadeHourValue:
      oneOf:
        - type: string
        - type: 'null'
        - $ref: '#/components/schemas/ArcadeHourExpanded'
    ArcadeSnsValue:
      oneOf:
        - type: string
        - type: 'null'
        - $ref: '#/components/schemas/ArcadeSnsExpanded'
    ArcadeGtkValue:
      oneOf:
        - type: string
        - type: 'null'
        - $ref: '#/components/schemas/ArcadeGtkExpanded'
    ArcadeGameValue:
      oneOf:
        - type: string
        - type: 'null'
        - $ref: '#/components/schemas/ArcadeGameExpanded'
    ArcadePhotoValue:
      oneOf:
        - type: string
        - type: 'null'
        - $ref: '#/components/schemas/ArcadePhotoExpanded'
    ArcadeValueResponse:
      type: object
      required: [admin, basic, hour, sns, gtk, game, photo]
      properties:
        admin:
          $ref: '#/components/schemas/ArcadeAdminSummary'
        basic:
          $ref: '#/components/schemas/ArcadeBasicValue'
        hour:
          $ref: '#/components/schemas/ArcadeHourValue'
        sns:
          $ref: '#/components/schemas/ArcadeSnsValue'
        gtk:
          $ref: '#/components/schemas/ArcadeGtkValue'
        game:
          $ref: '#/components/schemas/ArcadeGameValue'
        photo:
          $ref: '#/components/schemas/ArcadePhotoValue'
    ArcadeAnalyticsCount:
      type: object
      required: [count]
      properties:
        source:
          type: string
        game_series:
          type: string
        count:
          type: integer
          format: int64
    ArcadeAnalyticsResponse:
      type: object
      required: [arcade, page_views, fault_reports, edit_count]
      properties:
        arcade:
          type: string
        page_views:
          type: integer
          format: int64
          description: Public detail-page loads. Anonymous-safe.
        fault_reports:
          type: integer
          format: int64
          description: All created fault reports, including solved reports.
        edit_count:
          type: integer
          format: int64
          description: All immutable changelog rows for the arcade.
        page_views_by_source:
          type: array
          description: Returned only to an official arcade owner or developer/moderator.
          items:
            $ref: '#/components/schemas/ArcadeAnalyticsCount'
        series_filter_entries:
