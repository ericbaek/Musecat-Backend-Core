                  location: 2F
                  quantity: 1
                  price:
                    currency: KRW
                    type: custom
                    list:
                      - value: 1000
                    accept: []
                  tag:
                    - category: 기타
                      quantity: 1
                      note: ok
                  version:
                    id: version_123
                    series: series_123
                    released_on: "2025-06-01"
                    en: Filter Version
                    kr: Filter Version
                    jp: Filter Version
                    price_default: {}
                  series:
                    id: series_123
                    seriesNumber: 7
                    en: Filter Series
                    kr: Filter Series
                    jp: Filter Series
                    en_short: Filter Series
                    kr_short: Filter Series
                    jp_short: Filter Series
                    manufacturer: manufacturer_123
        '502':
