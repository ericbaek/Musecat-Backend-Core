                warp: false
                series: []
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '404':
