      responses:
        '200':
          description: Updated support feedback record.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, status, createdBy, photos, created, updated]
                properties:
                  id: {type: string}
                  message: {type: string}
                  status: {type: string}
                  createdBy: {type: string}
                  created: {type: string}
                  updated: {type: string}
                  photos: {type: array, items: {type: string}}
        '400': {description: Validation failed.}
        '401': {description: Missing or invalid user token.}
        '403': {description: Developer or moderator access required.}
        '404': {description: Support feedback was not found.}
        '502':
          description: Update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
