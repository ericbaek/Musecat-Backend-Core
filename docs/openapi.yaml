  /geo:
    get:
      tags: [Geo]
      summary: /geo
      description: >-
        Resolves the original coordinate using offline country and timezone boundaries.
        A country miss may use a unique exterior boundary within 1000 metres to
        tolerate coastline approximation. A missing or invalid country code falls back
        to BigDataCloud, then Nominatim, within an eight-second total budget, retaining
        the offline timezone. Only successful fallback results are cached for 24 hours.
        Ambiguous countries, missing or ambiguous timezones, and exhausted country
        providers still fail. The coordinate is not moved. Default per-client-IP limit
        is 60 requests per 60 seconds, shared by anonymous and authenticated users.
        Operator-configured limits and PocketBase exemptions may override the defaults.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Country and timezone for the coordinate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoLookupResponse'
        '400':
          description: Invalid or missing coordinates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Client IP request limit exceeded, including authenticated requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '502':
          description: Country or timezone lookup failure, including missing or ambiguous offline boundaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /geocode:
    get:
      tags: [Geo]
      summary: /geocode
      description: Default per-client-IP limit is 30 requests per 60 seconds, shared by anonymous and authenticated users. Operator-configured limits and PocketBase exemptions may override the defaults. Cached responses preserve the requested query or exact coordinates.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
          description: "`kr` prefers Kakao."
        - name: mode
          in: query
          schema:
            type: string
          description: "`free` uses OSM where applicable."
      responses:
        '200':
          description: Normalized geocoding candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '400':
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Client IP request limit exceeded, including authenticated requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '502':
          description: Upstream geocoding failure.
