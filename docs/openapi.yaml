  /user/arcade-inquiry-onboarding:
    get:
      tags: [Users, Arcade]
      summary: List current official owner's inquiry settings
      description: Active authenticated users only; reloads current exact arcade_owner role and owns relations. All currently owned arcades are returned, including configured arcades, including scoped private names. Staff-only and ordinary accounts receive empty items. Missing arcade relations are skipped; missing basic relations yield an empty name. Private no-store response.
