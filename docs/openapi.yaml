              schema:
                $ref: '#/components/schemas/GameCatalog'
        '400':
          description: Missing or unsupported locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to load the catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
