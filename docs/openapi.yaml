                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/game:
    put:
      tags: [Arcade Mutations]
      summary: /arcade/game
      description: |
        Applies an add/modify/remove delta to the current immutable game state and
        updates only `arcade.game_v2`. All three arrays are required. `modify`
        objects are complete replacements, not partial patches. Existing item ids
        are durable entries; a deleted entry may be reused when the same arcade,
        series, and verified cabinet match historical state. Cabinet ids must be
        supported by the submitted version. Price titles accept strings or numbers
        (for example, a numeric credit count) and preserve their stored type.
        Fields and catalog references are validated only for submitted add/modify
        items; untouched revisions are preserved. The resulting list still requires
        unique entry ids and version/cabinet pairs. Public game edits use a rolling
        seven-day distinct-entry XP window with target `min(10, 2*n)`;
        private edits do not award normal edit XP, and administrative bulk
        updates do not award it either.
        Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeGameRequest'
      responses:
        '200':
          description: Game relation updated.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, game, count, xp_feedback]
                properties:
                  arcade:
                    type: string
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  count:
                    type: integer
                    description: Number of active entries in the resulting state.
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`base_state_id` is stale and does not equal the current `arcade.game_v2`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/report-settings:
    get:
      tags: [Arcade Mutations]
      summary: GET /arcade/report-settings
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: arcade
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeReportSettings'
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
    put:
      tags: [Arcade Mutations]
      summary: PUT /arcade/report-settings
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArcadeReportSettings'
                - type: object
                  required: [arcade]
                  properties:
                    arcade: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeReportSettings'
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
  /user/feedback/thread/photo:
    get:
      tags: [User]
      summary: Download a private original or reply attachment as a current inquiry participant
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema: {type: string}
          description: Reply message id. Supply exactly one of id or feedbackId.
        - in: query
          name: feedbackId
          schema: {type: string}
          description: Original inquiry id. Supply exactly one of id or feedbackId.
        - in: query
          name: file
          required: true
          schema: {type: string}
          description: Exact filename returned in the selected original inquiry or reply photos array.
      responses:
        '200':
          description: Attachment bytes, private no-store. Raw PocketBase file URLs remain locked.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {description: Missing or ambiguous attachment record selector}
        '401': {description: Authentication required}
        '404': {description: Missing file or inaccessible parent inquiry}
  /user/feedback/thread:
    get:
      tags: [User]
      summary: Read a private inquiry conversation (author, current scoped official, or strict staff)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema: {type: string}
        - in: query
          name: before
          schema: {type: string}
          description: Oldest reply id from the preceding page; replies are returned chronologically, 50 per page.
      responses:
        '200':
          description: Original inquiry, attachment filenames, chronological items and older-page cursor. Private no-store.
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
    post:
      tags: [User]
      summary: Append an immutable reply and atomically notify the other participant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedbackId, message]
              properties:
                feedbackId: {type: string}
                message: {type: string, minLength: 1, maxLength: 4000}
          multipart/form-data:
            schema:
              type: object
              required: [feedbackId]
              properties:
                feedbackId: {type: string}
                message: {type: string, maxLength: 4000}
                photos:
                  type: array
                  maxItems: 3
                  items: {type: string, format: binary}
                  description: Images (content-sniffed, matching initial inquiry uploads); at most 15,000,000 bytes per file. Text or at least one photo is required.
      responses:
        '201': {description: Persisted reply with server-derived author, staff/official role, and photos filename array. Reply photo bytes require the private thread/photo endpoint.}
        '400': {description: Invalid reply}
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
        '413': {description: Photo or total multipart body exceeds upload limits}
    patch:
      tags: [User]
      summary: Resolve or reopen an inquiry as its author, current scoped official, or strict staff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedbackId, status]
              properties:
                feedbackId: {type: string}
                status: {type: string, enum: [solved, waiting]}
      responses:
        '200': {description: Persisted id and status. Private no-store. No reply is created.}
        '400': {description: Invalid status}
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
        '413': {description: Request exceeds 4 KiB}
  /user/notifications:
    get:
      summary: List the authenticated user's notifications
      description: Active account required. Private, no-store inbox with up to 20 visible entries, newest first. Rechecks source visibility and current arcade management rights. The durable arcade_setup notice remains visible to current active exact arcade_owner accounts regardless of saved inquiry/report modes; reading it never changes settings. Does not expose endpoints or subscription credentials.
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: string}, description: Last notification id from the previous page.}
      responses:
        '200':
          description: Inbox page and unread count.
          content:
            application/json:
              schema:
                type: object
                required: [items, unread, next]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, read, created, arcadeName, gameName, message, reaction, url]
                      properties:
                        id: {type: string}
                        kind: {type: string, enum: [report_created, report_reaction, feedback_created, feedback_reply, arcade_setup]}
                        read: {type: boolean}
                        created: {type: string}
                        arcadeName: {type: string}
                        gameName: {type: string}
                        message: {type: string}
                        reaction: {type: string}
                        url: {type: string, description: Server-generated relative deep link. arcade_setup opens /account/arcade-dashboard/setup.}
                  unread: {type: integer, minimum: 0}
                  next: {type: string, description: Empty at the end of the inbox.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
  /user/notifications/read:
    post:
      summary: Persist read state for one or all own notifications
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                all: {type: boolean}
      responses:
        '200': {description: Own notifications marked read. A foreign id cannot modify another account.}
        '400': {description: Notification id or all=true required.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '413': {description: Request exceeds 4 KiB.}
  /user/notifications/device:
    post:
      summary: Read whether the current account registered this device
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: {type: string, maxLength: 2048}
      responses:
        '200':
          description: Private, no-store device status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
        '400': {description: Invalid endpoint.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '413': {description: Request exceeds 4 KiB.}
    put:
      summary: Register this browser endpoint for the authenticated account
      description: Transfers a shared browser endpoint away from the previous account, including legacy arcade subscriptions. No browser permission is granted by this API; the browser must explicitly subscribe first.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription: {$ref: '#/components/schemas/ReportPushSubscription'}
                locale: {type: string, enum: [ko, en, ja]}
      responses:
        '200': {description: Device registered idempotently; enabled=true.}
        '400': {description: Invalid subscription.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '413': {description: Request exceeds 16 KiB.}
    delete:
      summary: Disable this account's notifications on one device
      description: Removes this caller's canonical device and its related arcade preferences; pending deliveries cascade away. Other devices and accounts are unaffected.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: {type: string, maxLength: 2048}
      responses:
        '200': {description: Device unregistered; enabled=false.}
        '400': {description: Invalid endpoint.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '413': {description: Request exceeds 4 KiB.}
    patch:
      tags: [User]
      summary: Synchronize locale on this account's already registered device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, locale]
              properties:
                endpoint: {type: string, maxLength: 2048}
                locale: {type: string, enum: [ko, en, ja]}
      responses:
        '200': {description: Existing-device enabled status. Never registers, enables or transfers an endpoint.}
        '400': {description: Invalid endpoint or locale}
        '401': {description: Authentication required}
  /user/notifications/test:
    post:
      summary: Send an account notification test to this device (Full only)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: {type: string, maxLength: 2048}
      responses:
        '202': {description: Push provider accepted the test. Does not confirm display on the device.}
        '400': {description: Invalid endpoint or subscription.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '404': {description: Own device registration not found.}
        '410': {description: Expired device registration removed.}
        '413': {description: Request exceeds 4 KiB.}
        '502': {description: Push provider rejected the request.}
        '503': {description: VAPID delivery is not configured.}
  /arcade/report-subscription/status:
    post:
      tags: [Arcade Mutations]
      summary: Read current device report subscription status
      description: Active arcade managers only. Returns only the caller's subscription status for the supplied arcade and device endpoint. No subscription credentials are returned. Endpoint stays in the bounded request body, never a URL query.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, endpoint]
              properties:
                arcade: {type: string}
                endpoint: {type: string, maxLength: 2048}
      responses:
        '200':
          description: Private, no-store current device status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
        '400': {description: Invalid subscription.}
        '401': {description: Authentication required.}
        '403': {description: Arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Request exceeds 4 KiB.}
  /arcade/report-subscription/test:
    post:
      tags: [Arcade Mutations]
      summary: Send a test notification to the caller's current device (Full only)
      description: Registered by Full's report push delivery module. Requires current arcade management access, internal report mode, and an existing subscription matching the caller, arcade and endpoint. Sends through the same VAPID sender as real reports. Success confirms provider acceptance, not display on the device. No arcade flag, changelog or XP is created.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, endpoint]
              properties:
                arcade: {type: string}
                endpoint: {type: string, maxLength: 2048}
      responses:
        '202': {description: Push provider accepted the test notification.}
        '400': {description: Invalid subscription.}
        '401': {description: Authentication required.}
        '403': {description: Arcade management access required.}
        '404': {description: Arcade or caller device subscription not found.}
        '409': {description: Arcade uses external reporting.}
        '410': {description: Expired subscription removed; enable alerts again.}
        '413': {description: Request exceeds 4 KiB.}
        '502': {description: Push provider rejected the test notification.}
        '503': {description: VAPID delivery is not configured.}
  /arcade/report-subscription:
    put:
      tags: [Arcade Mutations]
      summary: PUT /arcade/report-subscription
      description: Compatibility entry that upserts one canonical device and enables its per-arcade preference. Credentials are not duplicated per arcade.
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, subscription]
              properties:
                arcade: {type: string}
                subscription:
                  $ref: '#/components/schemas/ReportPushSubscription'
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
    delete:
      tags: [Arcade Mutations]
      summary: DELETE /arcade/report-subscription
      description: Stores an explicit per-arcade opt-out and cancels pending report pushes for this arcade and device. The canonical device remains enabled for personal activity and other arcades.
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, endpoint]
              properties:
                arcade: {type: string}
                endpoint: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
  /arcade/flag:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag
      description: Private drafts require the creator or a developer/moderator. Public arcades have no editor level threshold. Accepts at most 3 images, 15000000 bytes each, within a 46048576-byte encoded request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArcadeFlagRequest'
          multipart/form-data:
            schema:
              type: object
              required: [arcade, game_id, disruption, message]
              properties:
                arcade:
                  type: string
                game_id:
                  type: string
                disruption:
                  type: string
                  enum: [unplayable, major, bearable, minor]
                message:
                  type: string
                photos:
                  type: array
                  maxItems: 3
                  description: Images only; at most 15000000 bytes per file. Server verifies contents.
                  items:
                    type: string
                    format: binary
      responses:
        '409':
          description: Arcade uses external reporting. The response code is REPORT_EXTERNAL; no mutation or XP is committed.
        '200':
          description: Flag created and linked to the durable game entry.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, game_id, flag, game, xp_feedback]
                properties:
                  arcade:
                    type: string
                  game_id:
                    type: string
                  flag:
                    type: string
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413': {description: File or encoded request body exceeds its limit.}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/flag/delete:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag/delete
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagActionRequest'
      responses:
        '200':
          description: Flag deleted.
          content:
            application/json:
              schema:
                type: object
                required: [flag, deleted, game, xp_feedback]
                properties:
                  flag:
                    type: string
                  deleted:
                    type: boolean
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid body or delete rule failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
  /arcade/flag/reaction:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag/reaction
      description: Private drafts require the creator or a developer/moderator. Public arcades have no editor level threshold. A fixed reaction by a developer, moderator, or the official owner assigned to this arcade resolves immediately regardless of level; other users retain resolution voting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagReactionRequest'
      responses:
        '409':
          description: Arcade uses external reporting. The response code is REPORT_EXTERNAL; no mutation or XP is committed.
        '200':
          description: Reaction state updated. The response includes the authoritative resolution summary, current user vote, and newest-first report history.
          content:
            application/json:
              schema:
                type: object
                required: [flag, reaction, action, reaction_id, solved, game, xp_feedback, resolution, reportHistory]
                properties:
                  flag:
                    type: string
                  reaction:
                    type: string
                  action:
                    type: string
                  reaction_id:
                    type: string
                  solved:
                    type: boolean
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
                  resolution:
                    $ref: '#/components/schemas/ArcadeFlagResolution'
                  reportHistory:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArcadeFlagReportHistoryItem'
        '400':
          description: Invalid body or reaction rule failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: The reaction transaction succeeded but the authoritative resolution response could not be built.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /moderation/user/test-account:
    post:
      tags: [Moderator]
      summary: Create an ordinary test account and profile
      description: Active developer or moderator only. Does not change collection-wide password authentication or verify email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, nickname]
              properties:
                email: {type: string, format: email, maxLength: 254}
                username: {type: string, minLength: 4, maxLength: 15, pattern: '^[A-Za-z0-9]+$'}
                password: {type: string, minLength: 8, maxLength: 71, writeOnly: true}
                nickname: {type: string, minLength: 1, maxLength: 25}
      responses:
        '201':
          description: Account and profile created; no session token or password returned.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, username, nickname]
                properties:
                  id: {type: string}
                  email: {type: string, format: email}
                  username: {type: string}
                  nickname: {type: string}
        '400':
          description: Invalid input (code invalid_input).
        '401':
          description: Authentication required.
        '403':
          description: Active developer or moderator required.
        '409':
          description: Email or case-insensitive username exists (code duplicate_identity).
        '413':
          description: Body exceeds 16 KiB.
        '502':
          description: Transaction or authorization lookup failed.
  /moderation/user/arcade-account:
    post:
      tags: [Moderator]
      summary: Create an official arcade account and linked profile
      description: Active developer, moderator, or designer only. Atomically sets arcade_owner and owns for an existing public arcade. Does not verify email or replace the caller session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, nickname, arcadeId]
              properties:
                arcadeId: {type: string, minLength: 1}
                email: {type: string, format: email, maxLength: 254}
                username: {type: string, minLength: 4, maxLength: 15, pattern: '^[A-Za-z0-9]+$'}
                password: {type: string, minLength: 8, maxLength: 71, writeOnly: true}
                nickname: {type: string, minLength: 1, maxLength: 25}
      responses:
        '201':
          description: Account and profile created; no session token or password returned.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, username, nickname, arcadeId]
                properties:
                  arcadeId: {type: string}
                  id: {type: string}
                  email: {type: string, format: email}
                  username: {type: string}
                  nickname: {type: string}
        '400':
          description: Invalid input (code invalid_input).
        '401':
          description: Authentication required.
        '403':
          description: Active developer, moderator, or designer required.
        '404':
          description: Public arcade not found (code arcade_not_found).
        '409':
          description: Email or case-insensitive username exists (code duplicate_identity).
        '413':
          description: Body exceeds 16 KiB.
        '502':
          description: Transaction or authorization lookup failed.
  /user/signup:
    post:
      tags: [Users]
      summary: /user/signup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpJsonRequest'
          multipart/form-data:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  maxLength: 15
                nickname:
                  type: string
                bio:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Signup initialized.
          content:
            application/json:
              schema:
                type: object
                required: [success, profile]
                properties:
                  success:
                    type: boolean
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Withdrawn or banned account cannot sign up.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/AccountBannedResponse'
        '409':
          description: Username or user_info already initialized, or username already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Signup transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/check-in:
    post:
      tags: [Users]
      summary: /user/check-in
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Check-in state and XP feedback.
          content:
            application/json:
              schema:
                type: object
                required: [checked_in, already_checked_in, gained_exp, exp, level, day, xp_feedback]
                properties:
                  checked_in:
                    type: boolean
                  already_checked_in:
                    type: boolean
                  gained_exp:
                    type: integer
                  exp:
                    type: integer
                  level:
                    type: integer
                  day:
                    type: string
                    description: KST date in `YYYY-MM-DD` format.
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Withdrawn or banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Check-in transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/visits:
    get:
      tags: [Arcades]
      summary: /arcade/visits
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Public aggregate visit counts for a public arcade.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, total_visits, distinct_visitors]
                properties:
                  arcade: {type: string}
                  total_visits: {type: integer}
                  distinct_visitors: {type: integer}
  /arcade/ranking:
    get:
      tags: [Arcades]
      summary: /arcade/ranking
      description: Returns up to five users ranked by XP earned from this public arcade. The total metric combines completed visit verifications and positive arcade edit grants; edit and passport rank those sources separately. Public closed arcades remain eligible. Private arcades return 404, and visit XP with private visit visibility is omitted.
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
        - name: metric
          in: query
          required: false
          schema: {type: string, enum: [total, edit, passport], default: total}
      responses:
        '200':
          description: Top five contributors for the arcade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeVisitRankingResponse'}
        '400':
          description: Missing arcade id or invalid metric.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Ranking query failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/visit:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/visit
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArcadeVisitRequest'}
      responses:
        '200':
          description: GPS visit verification result and XP feedback. The visit echoes only its arcade and local visit date; raw GPS verification data is not returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  visited: {type: boolean}
                  already_visited: {type: boolean}
                  first_visit_to_arcade: {type: boolean, description: True only for a newly committed lifetime first visit; false for a duplicate.}
                  visit: {$ref: '#/components/schemas/Visit'}
                  gained_exp: {type: integer}
                  exp: {type: integer}
                  level: {type: integer}
                  xp_feedback: {$ref: '#/components/schemas/XpFeedback'}
        '400': {description: Invalid coordinates or GPS accuracy greater than 150 m.}
        '403': {description: Inactive user, ineligible arcade, outside the 100m radius, or a deployment-provided visit policy restriction.}
        '409': {description: Missing arcade coordinates or timezone.}
  /subway/map:
    get:
      tags: [Meta]
      summary: Get the newest subway map for a region
      parameters:
        - name: region
          in: query
          required: true
          schema: {type: string, enum: [center, busan]}
      responses:
        '200':
          description: Latest map metadata and custom file URLs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubwayMap'}
        '400': {description: Unsupported or missing region.}
        '404': {description: No map exists for the region.}
        '502': {description: Map lookup failed.}
    post:
      tags: [Moderator]
      summary: Create a subway map version
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [region, releaseDate]
              properties:
                region: {type: string, enum: [center, busan]}
                releaseDate: {type: string, format: date}
                changelog: {type: string, description: JSON string array, maxLength: 2000000}
                lightSVG: {type: string, format: binary}
                darkSVG: {type: string, format: binary}
                image: {type: string, format: binary}
                file: {type: string, format: binary}
      responses:
        '201': {description: Map version created.}
        '400': {description: Invalid multipart input or no display asset.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
    put:
      tags: [Moderator]
      summary: Update a subway map version
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                region: {type: string, enum: [center, busan]}
                releaseDate: {type: string, format: date}
                changelog: {type: string, description: JSON string array, maxLength: 2000000}
                lightSVG: {type: string, format: binary}
                darkSVG: {type: string, format: binary}
                image: {type: string, format: binary}
                file: {type: string, format: binary}
      responses:
        '200': {description: Map version updated.}
        '400': {description: Invalid multipart input or no display asset.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '404': {description: Map version was not found.}
    delete:
      tags: [Moderator]
      summary: Delete a subway map version
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Map version deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubwayMapDeleteResponse'}
        '400': {description: Missing map id.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '404': {description: Map version was not found.}
        '502': {description: Map deletion failed.}
  /subway/map/history:
    get:
      tags: [Moderator]
      summary: Get subway map version history
      security: [{bearerAuth: []}]
      parameters:
        - name: region
          in: query
          required: false
          schema: {type: string, enum: [center, busan]}
      responses:
        '200':
          description: List of subway map versions.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SubwayMap'}
                  total: {type: integer}
        '400': {description: Unsupported region.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '502': {description: Map lookup failed.}
  /subway/map/file:
    get:
      tags: [Meta]
      summary: Download a subway map asset
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
        - name: field
          in: query
          required: true
          schema: {type: string, enum: [lightSVG, darkSVG, image, file]}
      responses:
        '200': {description: The requested SVG, image, or PDF bytes.}
        '400': {description: Missing id or unsupported field.}
        '404': {description: Map or requested file was not found.}
  /campaign:
    get:
      tags: [Arcade Mutations]
      summary: /campaign
      description: |
        Returns the active campaign detail for the requested id. The response
        separates current old-version targets from current to-version targets,
        so the updated list includes machines already on the target version
        even when they were not updated through this campaign. It includes
        newest-first report logs with the user, arcade, game, reaction,
        location-verification status, and report time, plus the latest
        still_old report. Updated targets can be reverted by a new still_old
        report for seven days after the update. Only currently public/open
        arcades are included.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Campaign progress, updated targets, and report log.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignDetailResponse'}
        '400':
          description: Missing campaign id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Campaign is not active or was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign detail could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      tags: [Moderator]
      summary: Create an update campaign
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignMutationRequest'}
      responses:
        '201':
          description: Campaign created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignMutationResponse'}
        '400': {description: Invalid campaign input.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '502': {description: Campaign could not be created.}
    put:
      tags: [Moderator]
      summary: Update an update campaign
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignMutationRequest'}
      responses:
        '200':
          description: Campaign updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignMutationResponse'}
        '400': {description: Invalid campaign input or missing id.}
        '401': {description: Missing or invalid bearer token.}
        '403': {description: Active user lacks administrator access.}
        '404': {description: Campaign was not found.}
        '502': {description: Campaign could not be updated.}
  /campaigns:
    get:
      tags: [Arcades]
      summary: List active update campaigns
      description: Returns at most 20 campaigns that are active at request time, newest start first. Target counts include pending and already-updated public/open targets.
      responses:
        '200':
          description: Active campaign summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignListResponse'}
        '502':
          description: Campaigns could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/campaigns:
    get:
      tags: [Arcades]
      summary: List active campaign prompts for an arcade
      description: Returns campaign prompts for the requested public/open arcade to an authenticated active user. Includes current from_version machines and current to_version machines within their review window. After the latest still_old (Wrong) report, one location-verified updated report or two unverified updated reports hide the prompt immediately. A single unverified updated report starts a seven-day window. Wrong resets the report counts and expiry anchor. Updated targets include review_expires_at for the countdown. Already-updated machines without a campaign update report are excluded. Each item includes current target status and report history; expiry leaves game state and campaign overview history intact.
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current campaign prompts for the arcade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeCampaignListResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token, or inactive user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign targets could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/campaigns/presence:
    get:
      tags: [Arcades]
      summary: List campaign-target game ids for an arcade
      description: Returns only game ids with active campaign prompts for a public/open arcade, using the same eligibility as /arcade/campaigns (current from_version machines or current to_version machines within seven days of the first unverified updated report after the latest Wrong report). One verified updated report or two unverified updated reports after the latest Wrong hide presence immediately; Wrong resets the report counts and expiry anchor. Already-updated machines without reports and expired reviews are excluded. Campaign configuration, rewards, locations, and reports are omitted so anonymous detail pages can show campaign presence safely.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Campaign-target game ids for the arcade.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeCampaignPresenceResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign targets could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /campaign/end:
    post:
      tags: [Moderator]
      summary: End an update campaign
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignEndRequest'}
      responses:
        '200':
          description: Campaign marked ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignMutationResponse'}
        '400':
          description: Invalid request body or missing id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Active user lacks administrator access.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Campaign was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign could not be ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /campaign/photo:
    get:
      tags: [Arcades]
      summary: Photo update campaign targets
      description: |
        Returns public/open arcades whose current photo gallery has no public
        photo or whose newest public photo is at least one year old. The
        result is computed from the current `arcade.photo` molecule and is
        paginated like the public arcade list. Missing-photo targets are listed
        first, followed by stale targets from oldest to newest.
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: lat
          in: query
          description: Optional latitude for distance ordering; must be supplied with lon.
          schema: {type: number, minimum: -90, maximum: 90}
        - name: lon
          in: query
          description: Optional longitude for distance ordering; must be supplied with lat.
          schema: {type: number, minimum: -180, maximum: 180}
      responses:
        '200':
          description: Current automatic photo campaign targets.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoCampaignListResponse'}
        '400':
          description: Invalid pagination.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Photo campaign targets could not be loaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /campaign/check:
    post:
      tags: [Arcade Mutations]
      summary: /campaign/check
      description: |
        Confirms whether one active update-campaign target is still on the old
        version or has been updated. A location-verified `still_old` result awards the configured campaign XP once
        per user and target; unverified `still_old` reports award no XP. The default request requires a same-day
        verified visit at the public/open arcade. `bypass_location=true` skips
        only that visit check at any user level; an updated result
        through this path awards 1 XP; clients must obtain two warning
        confirmations before sending it. A user may append a location-verified
        updated report after their unverified updated report, hiding the
        prompt immediately without awarding update XP again. A verified still_old
        report after an unverified still_old report can earn the campaign reward.
        Repeated confirmations with the same verification do not append reports.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignCheckRequest'}
      responses:
        '200':
          description: Campaign check persisted; verified still_old results award campaign XP once per user and target, unverified still_old results award no XP. Updated results atomically move the game state and award campaign XP, or 1 XP when location is bypassed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignCheckResponse'}
        '400':
          description: Invalid campaign check body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Active user is missing the required visit without a location bypass.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Campaign or public arcade was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Campaign is inactive, target is outside scope, or game state is no longer eligible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Campaign check transaction failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /user/visits:
    get:
      tags: [Users]
      summary: /user/visits
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authenticated user's profile-ready visit summary. It includes all visit days per arcade without raw GPS, accuracy, XP, or visit-record data.
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats: {$ref: '#/components/schemas/VisitStats'}
  /user/visit-visibility:
    put:
      tags: [Users]
      summary: /user/visit-visibility
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VisitVisibilityRequest'}
      responses:
        '200':
          description: Updated public visit visibility.
  /user/favorite-visibility:
    put:
      tags: [Users]
      summary: /user/favorite-visibility
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite_visibility]
              properties:
                favorite_visibility: {type: string, enum: [private, public]}
      responses:
        '200':
          description: Updated favorite arcade visibility.
  /arcade/favorite:
    put:
      tags: [Arcades]
      summary: /arcade/favorite
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, favorited]
              properties:
                arcade: {type: string}
                favorited: {type: boolean}
      responses:
        '200':
          description: Updated favorite state for the arcade.
        '404':
          description: Arcade does not exist or is not public.
  /arcade/favorite/order:
    put:
      tags: [Arcades]
      summary: /arcade/favorite/order
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcades]
              properties:
                arcades:
                  type: array
                  items: {type: string}
                  description: Ordered list of arcade IDs representing the user's favorite order.
      responses:
        '200':
          description: Updated favorite order for the authenticated user.
        '400':
          description: Invalid request body or contains duplicate/unfavorited arcades.
  /user/countries:
    put:
      tags: [Users]
      summary: /user/countries
      description: Replaces the authenticated user's ordered profile country list and display mode. Empty is allowed. Accounts below level 15 may select zero or one country; accounts at level 15 or above may select up to three. Supporter and staff tags do not change this limit.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileCountriesRequest'}
      responses:
        '200':
          description: Updated normalized profile countries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCountriesResponse'}
        '400':
          description: Invalid JSON, duplicate, invalid country code, or more than three countries.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Multiple countries require level 15 or above, or the account is inactive.
        '409':
          description: The account has not initialized user_info.
        '502':
          description: Failed to save profile countries.
  /user/arcade-account/credentials:
    put:
      tags: [Users]
      summary: Change the authenticated official arcade account email or password
      description: Active arcade_owner accounts only. Requires the exact current password and at least one changed credential. Revokes every existing session on success; email changes clear email verification and visibility. Does not change username, roles, ownership, or arcade content.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: {type: string, writeOnly: true}
