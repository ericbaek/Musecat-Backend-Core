                  xp_feedback: {$ref: '#/components/schemas/XpFeedback'}
        '400': {description: Invalid coordinates or GPS accuracy greater than 150 m.}
        '403': {description: Inactive user, ineligible arcade, outside the 100m radius, or a deployment-provided visit policy restriction.}
        '409': {description: Missing arcade coordinates or timezone.}
  /native/session/code:
    post:
      tags: [Users]
      summary: Native session code
      description: Browser server issues a 120-second single-use PKCE S256 code. Exact registered client and redirect required. Routes are disabled unless native clients are configured. All responses use no-store; request limit is 4096 bytes.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, code_challenge]
              properties:
                client_id: {type: string}
                redirect_uri: {type: string}
                code_challenge: {type: string}
      responses:
        '200':
          description: Authorization result.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string}
        '400': {description: Invalid request.}
        '401': {description: Invalid or expired credential.}
        '403': {description: Account is inactive or banned.}
  /native/session/exchange:
    post:
      tags: [Users]
      summary: Native session exchange
      description: Atomically redeem the authorization code with PKCE S256. Reject consumed, expired, or mismatched code. Routes are disabled unless native clients are configured. All responses use no-store; request limit is 4096 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier, client_id, redirect_uri]
              properties:
                code: {type: string}
                code_verifier: {type: string}
                client_id: {type: string}
                redirect_uri: {type: string}
      responses:
        '200':
          description: Authorization result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeCredentials'
        '400': {description: Invalid request.}
        '401': {description: Invalid or expired credential.}
        '403': {description: Account is inactive or banned.}
  /native/session/refresh:
    post:
      tags: [Users]
      summary: Native session refresh
      description: Rotate access and refresh credentials. Reuse of any consumed refresh credential revokes only its device family. Routes are disabled unless native clients are configured. All responses use no-store; request limit is 4096 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: Authorization result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeCredentials'
        '400': {description: Invalid request.}
        '401': {description: Invalid or expired credential.}
        '403': {description: Account is inactive or banned.}
  /native/session/revoke:
    post:
      tags: [Users]
      summary: Native session revoke
      description: Idempotently revoke this device family. Accepts a previously rotated refresh credential; does not revoke web or partner grants. Routes are disabled unless native clients are configured. All responses use no-store; request limit is 4096 bytes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '204': {description: Family revoked or already absent.}
        '400': {description: Invalid request.}
        '401': {description: Invalid or expired credential.}
        '403': {description: Account is inactive or banned.}

  /native/user/notifications:
    get:
      summary: List the authenticated user's notifications
      description: Active account required. Private, no-store inbox with up to 20 visible entries, newest first. Rechecks source visibility and current arcade management rights. The durable arcade_setup notice remains visible to current active exact arcade_owner accounts regardless of saved inquiry/report modes; reading it never changes settings. Does not expose endpoints or subscription credentials.
      security: [{nativeBearer: []}]
