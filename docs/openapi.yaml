          type: string
          format: uri-reference
          description: Custom API URL for this file. Clients must not construct PocketBase `/api/files` URLs.
        public: {type: boolean}
        createdBy: {type: string}
        captured_at:
          type: string
          description: UTC EXIF capture date, empty when unavailable. Photo labels and campaign freshness prefer this over created; ordering remains unchanged.
        created: {type: string}
        updated: {type: string}
    ArcadePhotoAtomListResponse:
      type: object
      required: [arcade, items, total]
