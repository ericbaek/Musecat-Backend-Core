  /arcade/notice:
    get:
      tags: [Arcades]
      summary: /arcade/notice
      parameters:
        - name: arcade
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching notices ordered by priority with 0 treated as the lowest priority, then latest first within the same priority. Soft-deleted notices are excluded. Notices whose `until` is reached are soft-deleted before the response is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListArcadeNoticeResponse'
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Requires `developer`, `moderator`, or `arcade_owner` in `tag` or `tags`, or a `supporter`/`founding_supporter` at level 30 or above. Developers and moderators may create on any arcade. Official accounts may create only on their own `owns` arcades. Level-30+ supporters may create unless another official account manages the target through `owns`. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - bearerAuth: []
      x-upload-limits: {maxPhotos: 3, maxPhotoBytes: 5242880, maxBodyBytes: 16777216}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArcadeNoticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateArcadeNoticeMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Created notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeNotice'
        '413': {description: Image exceeds 5 MiB or encoded body exceeds 16 MiB.}
        '400':
          description: Invalid JSON or missing arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Notice role or supporter level-30 access is missing, official ownership is missing, or a supporter attempted to post on an officially managed arcade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Create failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Developers and moderators may update every notice. Official account authors may update their own notices. Level-30+ supporter authors may update their own notices. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - bearerAuth: []
      x-upload-limits: {maxPhotos: 3, maxPhotoBytes: 5242880, maxBodyBytes: 16777216}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Updated notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeNotice'
        '413': {description: Image exceeds 5 MiB or encoded body exceeds 16 MiB.}
        '400':
          description: Invalid JSON or missing notice id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: The caller lacks the required notice author role and level, or is neither the notice author nor a developer or moderator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Developers and moderators may delete every notice. Official account authors may delete their own notices. Level-30+ supporter authors may delete their own notices. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteArcadeNoticeRequest'
      responses:
        '200':
          description: Soft-deleted notice.
          content:
            application/json:
              schema:
                type: object
                required: [id, delete]
                properties:
                  id:
                    type: string
                  delete:
                    type: boolean
        '400':
          description: Invalid JSON or missing notice id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: The caller lacks the required notice author role and level, or is neither the notice author nor a developer or moderator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Delete failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/rollback:
    post:
      tags: [Support]
      summary: /arcade/rollback
      description: Applies an immediate rollback. With `report=true`, it atomically creates a `rollback_report` linked to the cited changelog; it never auto-bans the cited editor. Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackArcadeRequest'
      responses:
        '200':
          description: Rollback applied.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation or rollback rule failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An unresolved report already exists for the cited changelog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Rollback transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/game/bulk_version:
    post:
      tags: [Moderator]
      summary: /arcade/game/bulk_version
      description: |
        Requires an authenticated user with `developer` or `moderator` access. The selected stable game entries may span multiple arcades. Each affected arcade receives an immutable game-state batch and its own `changed=game` changelog row. This administrative version swap records only the resulting game-state change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateArcadeGameVersionRequest'
      responses:
        '200':
          description: Bulk update applied through immutable game-state batches.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, count, changed]
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  count:
                    type: integer
                  changed:
                    type: string
                    description: Always `game`.
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Developer or moderator access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Transaction or notification failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/basic:
    put:
      tags: [Arcade Mutations]
      summary: /arcade/basic
      description: Active authenticated users may edit public arcades without a level threshold; private drafts require the creator or a developer/moderator. Location changes are limited by the editor's level below 10 (at most 1 km), 10-14 (at most 5 km), 15-29 (at most 10 km), and 30 or above (any distance within the current country). Policy denials return a machine-readable code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeBasicRequest'
      responses:
        '200':
          description: Updated arcade basic relation.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, basic, changed, xp_feedback]
                properties:
                  arcade:
                    type: string
                  basic:
                    type: string
                  changed:
                    type: array
                    items:
                      type: string
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid JSON, validation failure, or no changed fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Withdrawn or banned user, or a location move denied by the level policy. Location policy codes are location_move_distance_exceeded, location_move_country_changed, and location_move_origin_missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Load or persistence failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required geo lookup failed; no location change is persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/public:
    get:
      tags: [Arcade Mutations]
      summary: Preview public-conversion XP and requirements
      description: Reads the creator's current level-based public-conversion requirements and currently eligible public-conversion (5 XP) and draft-backfill (2 XP per eligible changed area) without changing visibility or the XP ledger. Levels 0-4 require game, contact-or-hours, and facility-photo-or-location-verification; levels 5-9 require game and facility-photo-or-location-verification; levels 10+ require game only. Only the private arcade creator may call this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current XP preview for converting the private arcade to public.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, public, level, requirements, location_verified, xp_preview]
                properties:
                  arcade:
                    type: string
                  public:
                    type: boolean
                    const: false
                  level:
                    type: integer
                  requirements:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArcadePublicRequirement'
                  location_verified:
                    type: boolean
                  xp_preview:
                    $ref: '#/components/schemas/ArcadePublicExpPreview'
        '400':
          description: Missing arcade id, closed arcade, or already-public arcade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Only the draft creator may preview its public-conversion XP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to calculate the XP preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Arcade Mutations]
      summary: /arcade/public
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArcadeOnlyRequest'
      responses:
        '200':
          description: Arcade is now public. The creator receives 5 XP for the conversion plus 2 XP for each eligible draft information area that has not already received its backfill.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, public, xp_feedback]
                properties:
                  arcade:
                    type: string
                  public:
                    type: boolean
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Only the private arcade creator may request public conversion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Validation or update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/location-verification:
    post:
      tags: [Arcade Mutations]
      summary: Verify the creator's current location for publication
      description: Stores a one-time location proof tied to the arcade's current basic-information revision. Editing basic information changes that revision and invalidates the proof. This endpoint does not create a Passport visit or award XP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyArcadeLocationRequest'
      responses:
        '200':
          description: Current location was verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyArcadeLocationResponse'
        '400':
          description: Invalid coordinates, accuracy, or arcade state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Only the creator may verify the private arcade, or the current position is outside the 100-meter radius.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The arcade has no usable basic-information location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/gtk:
    put:
      tags: [Arcade Mutations]
