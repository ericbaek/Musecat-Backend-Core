      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Developers and moderators may update every notice. Official account authors may update their own notices. Level-30+ supporter authors may update their own notices.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeMultipartRequest'
            encoding:
              photos:
