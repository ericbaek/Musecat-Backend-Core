              schema: {$ref: '#/components/schemas/ArcadeModerationRequest'}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Active developer or moderator required}
        '404': {description: Request not found}
        '409': {description: Already resolved}
  /moderation/arcade/status:
    get:
