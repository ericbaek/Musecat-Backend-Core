          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Caller is not the draft creator.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Draft not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Published arcades or private aggregates with required dependent records cannot be deleted. Required-reference conflicts return code draft_referenced and preserve audit history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Draft deletion failed because of another storage error; no partial deletion is committed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/arcade/public:
    description: Opaque native session and active account required. Responses are no-store. Maximum encoded request body is 4096 bytes.
    get:
      tags: [Arcade Mutations]
      summary: Preview public-conversion XP and requirements
      description: Reads the creator's current level-based public-conversion requirements and currently eligible public-conversion (5 XP) and draft-backfill (2 XP per eligible changed area) without changing visibility or the XP ledger. Levels 0-4 require game, contact-or-hours, and facility-photo-or-location-verification; levels 5-9 require game and facility-photo-or-location-verification; levels 10+ require game only. Only the private arcade creator may call this endpoint.
      security:
        - nativeBearer: []
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current XP preview for converting the private arcade to public.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, public, level, requirements, location_verified, xp_preview]
                properties:
                  arcade:
                    type: string
                  public:
                    type: boolean
                    const: false
                  level:
                    type: integer
                  requirements:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArcadePublicRequirement'
                  location_verified:
                    type: boolean
                  xp_preview:
                    $ref: '#/components/schemas/ArcadePublicExpPreview'
        '400':
          description: Missing arcade id, closed arcade, or already-public arcade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Only the draft creator may preview its public-conversion XP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to calculate the XP preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Arcade Mutations]
      summary: /arcade/public
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArcadeOnlyRequest'
      responses:
        '200':
          description: Arcade is now public. The creator receives 5 XP for the conversion plus 2 XP for each eligible draft information area that has not already received its backfill.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, public, xp_feedback]
                properties:
                  arcade:
                    type: string
                  public:
                    type: boolean
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Only the private arcade creator may request public conversion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Validation or update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413': {description: Encoded native request body exceeds 4096 bytes.}
  /native/arcade/location-verification:
    description: Opaque native session and active account required. Responses are no-store. Maximum encoded request body is 4096 bytes.
    post:
      tags: [Arcade Mutations]
      summary: Verify the creator's current location for publication
      description: Stores a one-time location proof tied to the arcade's current basic-information revision. Editing basic information changes that revision and invalidates the proof. This endpoint does not create a Passport visit or award XP.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyArcadeLocationRequest'
      responses:
        '200':
          description: Current location was verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyArcadeLocationResponse'
        '400':
          description: Invalid coordinates, accuracy, or arcade state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Only the creator may verify the private arcade, or the current position is outside the 100-meter radius.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The arcade has no usable basic-information location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413': {description: Encoded native request body exceeds 4096 bytes.}

  /native/arcade/memo:
    description: Active opaque native session required for every operation; responses are no-store. Existing web domain permissions and last-save-wins semantics apply; no expected revision or idempotency key is accepted.
    get:
      security: [{nativeBearer: []}]
      tags: [Arcades]
      summary: /arcade/memo
      description: Returns the current immutable memo revision. Public arcades are anonymously readable; private arcades require the creator or a developer/moderator bearer token.
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current memo revision, or null when no memo has been written.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeMemoResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or private access is denied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      x-body-limit-bytes: 33554432
      tags: [Arcade Mutations]
      summary: /arcade/memo
      description: Creates an immutable Tiptap JSON revision and moves the arcade memo pointer. Requires an authenticated user with arcade write access. Saves and changelog creation are atomic.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutArcadeMemoRequest'}
      responses:
        '200':
          description: Memo saved; unchanged documents return changed=false without creating a revision.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, changed, memo]
                properties:
                  arcade: {type: string}
                  changed: {type: boolean}
                  memo:
                    $ref: '#/components/schemas/ArcadeMemo'
        '400':
          description: Invalid arcade id or Tiptap document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Authenticated arcade write access is required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or private access is denied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '413': {description: Encoded request body exceeds 32 MiB. Documents remain limited to 200000 bytes.}

  /native/arcade/notice:
    description: Active opaque native session required for every operation; responses are no-store. Existing web domain permissions and last-save-wins semantics apply; no expected revision or idempotency key is accepted.
    get:
      security: [{nativeBearer: []}]
      tags: [Arcades]
      summary: /arcade/notice
      parameters:
        - name: arcade
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching notices ordered by priority with 0 treated as the lowest priority, then latest first within the same priority. Soft-deleted notices are excluded. Notices whose `until` is reached are soft-deleted before the response is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListArcadeNoticeResponse'
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Requires `developer`, `moderator`, or `arcade_owner` in `tag` or `tags`, or a `supporter`/`founding_supporter` at level 30 or above. Developers and moderators may create on any arcade. Official accounts may create only on their own `owns` arcades. Level-30+ supporters may create unless another official account manages the target through `owns`. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - nativeBearer: []
      x-upload-limits: {maxPhotos: 3, maxPhotoBytes: 5242880, maxBodyBytes: 16777216}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/CreateArcadeNoticeRequest'}
                - {required: [arcade, document]}
          multipart/form-data:
            schema:
              allOf:
                - {$ref: '#/components/schemas/CreateArcadeNoticeMultipartRequest'}
                - {required: [arcade, document]}
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Created notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeNotice'
        '413': {description: Image exceeds 5 MiB or encoded body exceeds 16 MiB.}
        '400':
          description: Invalid JSON or missing arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Notice role or supporter level-30 access is missing, official ownership is missing, or a supporter attempted to post on an officially managed arcade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Create failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Developers and moderators may update every notice. Official account authors may update their own notices. Level-30+ supporter authors may update their own notices. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - nativeBearer: []
      x-upload-limits: {maxPhotos: 3, maxPhotoBytes: 5242880, maxBodyBytes: 16777216}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Updated notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeNotice'
        '413': {description: Image exceeds 5 MiB or encoded body exceeds 16 MiB.}
        '400':
          description: Invalid JSON or missing notice id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: The caller lacks the required notice author role and level, or is neither the notice author nor a developer or moderator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Developers and moderators may delete every notice. Official account authors may delete their own notices. Level-30+ supporter authors may delete their own notices. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteArcadeNoticeRequest'
      responses:
        '200':
          description: Soft-deleted notice.
          content:
            application/json:
              schema:
                type: object
                required: [id, delete]
                properties:
                  id:
                    type: string
                  delete:
                    type: boolean
        '400':
          description: Invalid JSON or missing notice id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: The caller lacks the required notice author role and level, or is neither the notice author nor a developer or moderator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Delete failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/arcade:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade. Responses are no-store.
    get:
      security:
        - nativeBearer: []
      tags: [Arcades]
      summary: /arcade
      description: |
        Returns only a public arcade (open or closed) and relation ids by default.
        Private arcades always return `404`; use authenticated `GET /arcade/draft` for a creator or developer/moderator draft read.
        When `expand=game`, each `game.items[]` entry includes `version`, `series`, `updated`, and the editable game fields.
        Unauthenticated callers receive redacted sensitive data: `tag` is null, `location` and `updated` are empty strings, `price` retains only representative items with `hasHiddenPrices=true` and `accept=null`, and `expand=hour` returns only today's schedule for the arcade timezone.
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Arcade id.
        - name: arcade
          in: query
          schema:
            type: string
          description: Alias for `id`.
        - name: expand
          in: query
          schema:
            type: string
          description: |
            `none` or empty returns relation ids only. `all` expands every section.
            Comma-separated values such as `basic,hour` expand only the requested sections.
        - name: source
          in: query
          schema:
            type: string
            enum: [direct, search, nearby, other, poster, google, naver, bing]
            default: direct
          description: Optional acquisition source recorded with the page view. search is internal site search; poster is poster QR; google, naver, and bing are external search referrals. Missing or unknown values use direct.
        - name: game_series
          in: query
          description: Optional repeated or comma-separated series IDs used to reach the arcade.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Arcade metadata with relation ids or expanded relation payloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeValueResponse'
              examples:
                idsOnly:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: "2026-04-01 12:00:00.000Z"
                      updated: "2026-04-10 09:00:00.000Z"
                    basic: basic_rel
                    hour: hour_rel
                    sns: sns_rel
                    gtk: gtk_rel
                    game: game_rel
                    photo: photo_rel
                expanded:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: "2026-04-01 12:00:00.000Z"
                      updated: "2026-04-10 09:00:00.000Z"
                    basic:
                      id: basic_rel
                      name: Sydney Arcade
                      address: 123 George St, Sydney NSW
                      direction: Level 2
                      nickname: [Town Hall]
                      subway_line: [T1]
                      location:
                        lat: -33.8708
                        lon: 151.2062
                    hour:
                      id: hour_rel
                      Monday:
                        start: 1000
                        end: 2300
                      Thursday:
                        start: 0
                        end: 0
                      Sunday: 499
                      Note: Late night on Thursdays
                    sns:
                      id: sns_rel
                      items:
                        - type: instagram
                          link: https://instagram.com/example
                          name: Official account
                    gtk:
                      id: gtk_rel
                      items:
                        - type: smoking
                          bool: false
                    game:
                      id: game_rel
                      items:
                        - id: atom_123
                          updated: "2026-04-10 09:00:00.000Z"
                          version:
                            id: version_123
                            series: series_123
                            released_on: "2025-01-01"
                            en: Version A
                            kr: Version A
                            jp: Version A
                            price_default: null
                          series:
                            id: series_123
                            seriesNumber: 1
                            en: Series A
                            kr: Series A
                            jp: Series A
                            en_short: A
                            kr_short: A
                            jp_short: A
                            manufacturer: null
                          location: 2F
                          quantity: 1
                          price:
                            currency: KRW
                            type: custom
                            list:
                              - value: 500
                            accept: [Cash]
                          tag: []
                    photo:
                      id: photo_rel
        '400':
          description: Missing target arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/arcade/changelog:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/changelog. Responses are no-store.
    get:
      tags: [Arcades]
      summary: /arcade/changelog
      description: Detailed changelog requires an active authenticated user, including for public open/closed arcades. Private history is available only to the creator or a developer/moderator.
      security:
        - nativeBearer: []
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: changed
          in: query
          description: Optional arcade part filter. Omit to return all supported categories.
          schema:
            type: string
            enum: [basic, game, hour, sns, gtk, photo, memo]
      responses:
        '200':
          description: Immutable changelog page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeChangelogPage'}
        '400':
          description: Invalid pagination, missing arcade id, or unsupported changed category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid user authentication.
        '403':
          description: User is inactive.
        '404':
          description: Arcade does not exist or private history is inaccessible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/arcades/updates/history:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcades/updates/history. Responses are no-store.
    get:
      tags: [Arcades]
      summary: Authenticated recent change history
      security:
        - nativeBearer: []
      description: Historical public open arcade activity, excluding passport verifications before block grouping and pagination. Requires a user session.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CountryQuery'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      responses:
        '200':
          description: Historical block pagination envelope.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, per_page, last_page, total]
                properties:
                  items:
                    type: array
