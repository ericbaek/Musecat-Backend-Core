        document:
          $ref: '#/components/schemas/ArcadeMemoDocument'
          description: Canonical Tiptap JSON document.
        link:
          type: string
        delete:
          type: boolean
        until:
          oneOf:
            - type: string
              format: date-time
            - type: string
        priority:
          type: number
        photos:
          type: array
          items:
            type: string
        created:
          oneOf:
            - type: string
              format: date-time
            - type: string
        updated:
          oneOf:
            - type: string
              format: date-time
            - type: string
    ListArcadeNoticeResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArcadeNotice'
        total:
          type: integer
    ArcadeMemoDocument:
      description: >-
        Recursive Tiptap document. Nodes and marks require a nonempty string type;
        text nodes require string text. Present content and marks must be arrays,
        attrs must be objects, and heading levels must be integers 1 through 6.
        At most 5000 nodes, 64 nested content levels, and 128 total JSON nesting levels are accepted. Each node allows at most 32 marks. Malformed
        documents return 400 without saving notices, memo revisions, or history.
        Extension node and mark names are preserved.
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: doc
        content:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ArcadeMemo:
      type: object
      required: [id, arcade, document, by, created]
      properties:
        id: {type: string}
        arcade: {type: string}
        document:
          $ref: '#/components/schemas/ArcadeMemoDocument'
        by:
          type: string
          description: Authenticated author user id.
        created:
          type: string
          format: date-time
    ArcadeMemoResponse:
      type: object
      required: [arcade, memo]
      properties:
        arcade: {type: string}
        memo:
          oneOf:
            - $ref: '#/components/schemas/ArcadeMemo'
            - type: 'null'
    PutArcadeMemoRequest:
      type: object
      required: [arcade, document]
      properties:
        arcade: {type: string}
        document:
          $ref: '#/components/schemas/ArcadeMemoDocument'
    ArcadeOnlyRequest:
      type: object
      required: [arcade]
      properties:
        arcade:
          type: string
    ArcadePublicRequirement:
      type: object
      required: [kind, satisfied]
      properties:
        kind:
          type: string
          enum: [game, channelOrHour, photoOrLocation]
        satisfied:
          type: boolean
    VerifyArcadeLocationRequest:
      type: object
      required: [arcade, lat, lon, accuracy]
      properties:
        arcade: {type: string}
        lat: {type: number, format: double}
        lon: {type: number, format: double}
        accuracy:
          type: number
          format: double
          minimum: 0
          maximum: 100
    VerifyArcadeLocationResponse:
      type: object
      required: [arcade, verified, basic, distance_meters, accuracy_meters]
      properties:
        arcade: {type: string}
        verified: {type: boolean}
        basic: {type: string}
        distance_meters: {type: number, format: double}
        accuracy_meters: {type: number, format: double}
    GTKAtomInput:
      type: object
      required: [type, bool]
      properties:
        type:
          $ref: '#/components/schemas/ArcadeGtkType'
        bool:
          type: boolean
        note:
          type: string
        meta:
          $ref: '#/components/schemas/ParkingMeta'
    UpdateArcadeGTKRequest:
      type: object
      required: [arcade, gtk]
      properties:
        arcade:
          type: string
        gtk:
          type: array
          items:
            $ref: '#/components/schemas/GTKAtomInput'
    SNSAtomInput:
      type: object
      required: [type, link]
      properties:
        type:
          type: string
        link:
          type: string
        name:
          type: string
    UpdateArcadeSNSRequest:
      type: object
      required: [arcade, sns]
      properties:
        arcade:
          type: string
        sns:
          type: array
          items:
            $ref: '#/components/schemas/SNSAtomInput'
    PriceItem:
      type: object
      properties:
        title:
          oneOf:
            - type: string
            - type: number
        value:
          oneOf:
            - type: number
              format: float
            - type: 'null'
        paseli_value:
          type: number
          exclusiveMinimum: 0
          description: Optional PASELI price for a numeric JPY row with PASELI acceptance (gamemode, credit, song, time, custom_v1 or legacy object-form custom). Unavailable for free or text prices. Omit when unknown.
        mode_key:
          type: string
        represent:
          type: boolean
    Price:
      type: object
      required: [currency, type, list, accept]
      allOf:
        - if:
            properties:
              type: {enum: [gamemode, credit, song, time, free, custom_v1]}
          then:
            properties:
              list:
                items:
                  $ref: '#/components/schemas/PriceItem'
                minItems: 1
        - if:
            properties:
              type: {const: custom_v2}
          then:
            properties:
              list:
                items: {type: string, minLength: 1}
      properties:
        currency:
          type: string
          enum: [KRW, JPY, USD]
        type:
          type: string
          enum: [gamemode, credit, song, time, free, custom, custom_v1, custom_v2]
        list:
          type: array
          description: custom_v1 uses named numeric PriceItem objects with currency conversion. custom_v2 uses literal strings, one per line (empty array means unknown). Legacy custom accepts either shape without rewriting existing data.
          anyOf:
            - items: {type: string, minLength: 1}
            - items:
                $ref: '#/components/schemas/PriceItem'
        accept:
          type: array
          items:
            type: string
            enum: ['Credit Card', 'Prepaid Card', Cash, PASELI]
    TagItem:
      type: object
      required: [category, note]
      properties:
        category:
          type: string
          enum: ['케비넷 타입', '로테이션 버전', '모니터', '스위치', '사운드', '녹화방송', '기타']
        note:
          type: string
    GameAtomInput:
      type: object
      required: [game, location, quantity, price, tag]
      properties:
        game:
          type: string
        id:
          type: string
          description: Stable `arcade_game_id` id. Forbidden in `add`; required in `modify` and never supplied in `remove`.
        cabinet:
          oneOf:
            - type: string
            - type: 'null'
          description: |
            Canonical `game_cabinet` id for this revision. The cabinet must be
            supported by the submitted version through `game_series_version_cabinet`.
            Use null only when the cabinet is genuinely unverified.
        location:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Price'
        tag:
          type: array
          items:
            $ref: '#/components/schemas/TagItem'
    GameAtomModifyInput:
      type: object
      required: [id, game, location, quantity, tag]
      properties:
        game:
          type: string
        id:
          type: string
          description: Stable `arcade_game_id` id. Forbidden in `add`; required in `modify` and never supplied in `remove`.
        cabinet:
          oneOf:
            - type: string
            - type: 'null'
          description: |
            Canonical `game_cabinet` id for this revision. The cabinet must be
            supported by the submitted version through `game_series_version_cabinet`.
            Use null only when the cabinet is genuinely unverified.
        location:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Price'
        tag:
          type: array
          items:
            $ref: '#/components/schemas/TagItem'
    UpdateArcadeGameRequest:
      type: object
      required: [arcade, base_state_id, add, modify, remove]
      properties:
        arcade:
          type: string
        base_state_id:
          type: string
          description: Current `arcade.game_v2`; stale values return 409. Use an empty string only for the first registration.
        add:
          type: array
          items:
            $ref: '#/components/schemas/GameAtomInput'
          description: Complete game objects without `id`. Each object creates one active installation identity, or reuses an eligible inactive identity.
        modify:
          type: array
          items:
            $ref: '#/components/schemas/GameAtomModifyInput'
          description: Replacement objects with an active `id`. Omit `price` to preserve the stored price exactly, including an unregistered price. Explicit null is invalid.
        remove:
          type: array
          items:
            type: string
          description: Active `arcade_game_id` values to remove from the next state. The durable entries remain in history.
    CreateArcadeFlagRequest:
      type: object
      required: [arcade, game_id, disruption, message]
      properties:
        arcade:
          type: string
        game_id:
          type: string
