  /developer/v1/account/arcade/basic:
    put:
      tags:
      - Connected account
      summary: "/arcade/basic"
      description: |-
        Requires account:access. Same payload, response and domain checks as PUT /arcade/basic. Management operations are excluded even for staff.

        Active authenticated users may edit public arcades without a level threshold; private drafts require the creator or a developer/moderator. Location changes are limited by the editor's level below 10 (at most 1 km), 10-14 (at most 5 km), 15-29 (at most 10 km), and 30 or above (any distance within the current country). Policy denials return a machine-readable code.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateArcadeBasicRequest"
      responses:
        '200':
          description: Updated arcade basic relation.
          content:
            application/json:
              schema:
                type: object
                required:
                - arcade
                - basic
                - changed
                - xp_feedback
                properties:
                  arcade:
                    type: string
                  basic:
                    type: string
                  changed:
                    type: array
                    items:
                      type: string
                  xp_feedback:
                    "$ref": "#/components/schemas/XpFeedback"
        '400':
          description: Invalid JSON, validation failure, or no changed fields.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Withdrawn or banned user, or a location move denied by the
            level policy. Location policy codes are location_move_distance_exceeded,
            location_move_country_changed, and location_move_origin_missing.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Load or persistence failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: Required geo lookup failed; no location change is persisted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
