                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /moderation/game/catalog:
    get:
      tags: [Moderator]
      summary: Read protected game catalog management data
      description: Active developer or moderator, or an active supporter or founding supporter at level 30 or above. Historical version aliases (non-empty alias_of) are omitted from the versions list without deleting their records or historical references. Cabinets are ordered by the earliest release date among active compatible versions, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [en-US, ko-KR, ja-JP]
      responses:
        '200':
          description: Full catalog management view.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Moderator]
      summary: Create a catalog item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Created item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Duplicate or conflicting operation. }
    put:
      tags: [Moderator]
      summary: Update a catalog item with optimistic concurrency
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Updated item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Stale revision or dependency conflict. }
    delete:
      tags: [Moderator]
      summary: Archive a catalog item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Archived item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Item is referenced by active data. }
  /moderation/game/catalog/restore:
    post:
      tags: [Moderator]
      summary: Restore an archived catalog item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Restored item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
  /moderation/game/catalog/compatibilities:
    post:
      tags: [Moderator]
      summary: Atomically replace a version's compatible cabinet set
      description: Reconciles creates, restores, and archives in one transaction. The expected active revisions reject stale checklist submissions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogCompatibilityMutationRequest'
      responses:
        '200':
          description: The complete resulting compatibility set and immutable audit rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogCompatibilityMutationResponse'
        '409': { description: Stale checklist, incompatible cabinet, or a link referenced by active data. }
  /moderation/game/catalog/changes:
    get:
      tags: [Moderator]
      summary: List immutable game catalog changes
      security:
        - bearerAuth: []
      parameters:
        - name: entity
          in: query
          schema: {type: string}
        - name: entity_id
          in: query
          schema: {type: string}
        - name: actor
          in: query
          schema: {type: string}
        - name: action
          in: query
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Paginated catalog audit evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /moderation/game/catalog/changes/revert:
    post:
      tags: [Moderator]
      summary: Revert a catalog change as a new audited operation
      description: Restores the persisted before snapshot, including archive state. A creation with no before snapshot is archived after reference checks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Reverted item and new immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Current item cannot safely be reverted. }
  /user/feedback:
    get:
      tags: [Support, Users]
      summary: List the authenticated user's own feedback
      description: Active users only. Ownership is forced from the bearer token; createdBy query values are ignored. Anonymous submissions and other users' records are never returned. Includes all statuses unless filtered, with id, message, status, createdBy, photos (filenames), created and updated. This does not grant file access or open the reviewer queue.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Own records ordered newest first, with items and total; an empty history returns an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '401': {description: Missing or invalid user token.}
        '403': {description: Withdrawn or banned user.}
        '502': {description: List failure.}
  /support_feedback:
    get:
      tags: [Support]
      summary: /support_feedback
      description: Strict support review queue. Requires an active `developer` or `moderator`; supporter tags are insufficient.
      security:
        - bearerAuth: []
      parameters:
        - name: createdBy
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching support feedback entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Active developer or moderator access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Support]
      summary: /support_feedback
      description: Default per-client-IP limit is 10 requests per 600 seconds, shared by anonymous and authenticated users. With no official account, arcade-scoped inquiries accept guests through moderator fallback. With a current official account, missing configuration defaults to OFF and disabled mode rejects creation with 409 INQUIRY_DISABLED; loginRequired rejects anonymous submissions with 401 LOGIN_REQUIRED; external mode rejects creation with 409 INQUIRY_EXTERNAL. Private arcades remain inaccessible to guests. Guest submissions preserve existing initial-receipt semantics and do not grant authenticated conversation access. Operator-configured limits and PocketBase exemptions may override the defaults. Accepts at most 3 images of 15000000 bytes each; the total encoded body is limited to 46048576 bytes (45 MB of photos plus 1 MiB of form overhead).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportFeedbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSupportFeedbackMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Created support feedback record.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, status, createdBy, photos, created, updated]
                properties:
                  id:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                  createdBy:
                    type: string
                  created:
                    type: string
                  updated:
                    type: string
                  photos:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': {description: LOGIN_REQUIRED for a scoped inquiry requiring sign-in, or inactive account.}
        '404': {description: Missing or inaccessible arcade.}
        '409': {description: INQUIRY_DISABLED for OFF or unconfigured official arcades; INQUIRY_EXTERNAL for official arcades using external contact.}
        '413':
          description: File exceeds 15000000 bytes or encoded request body exceeds 46048576 bytes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '429':
          description: Client IP request limit exceeded, including authenticated requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '502':
          description: Create failure.
    put:
      tags: [Support]
      summary: Review a support feedback record
      description: Strict support review queue. Requires an active developer or moderator.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: {type: string}
                status: {type: string, enum: [waiting, recognised, solved]}
      responses:
        '200':
          description: Updated support feedback record.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, status, createdBy, photos, created, updated]
                properties:
                  id: {type: string}
                  message: {type: string}
                  status: {type: string}
                  createdBy: {type: string}
                  created: {type: string}
                  updated: {type: string}
                  photos: {type: array, items: {type: string}}
        '400': {description: Validation failed.}
        '401': {description: Missing or invalid user token.}
        '403': {description: Developer or moderator access required.}
        '404': {description: Support feedback was not found.}
        '502':
          description: Update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
