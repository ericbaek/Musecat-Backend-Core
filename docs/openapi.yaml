    ChangelogPhotoAsset:
      type: object
      required: [id, file_url]
      properties:
        id: {type: string}
        file_url:
          type: string
          format: uri-reference
          description: Custom /arcade/photo/file?id= URL; file delivery rechecks current access.
      description: Read-time reference to an accessible photo in this row's arcade. Missing, foreign, and inaccessible atoms are omitted.
    ArcadeChangelogItem:
      type: object
