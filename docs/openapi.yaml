        changed:
          type: string
          enum: [basic, game, hour, sns, gtk, photo, memo]
        from:
          description: Authenticated, authorized rows only.
        to:
          description: Authenticated, authorized rows only.
        by:
          type: string
          description: Authenticated, authorized rows only.
        log:
          description: Authenticated, authorized rows only.
        created:
          type: string
          description: Authenticated, authorized rows only.
        memo: {$ref: '#/components/schemas/ChangelogMemoSnapshots'}
        photo_assets:
          type: array
          items: {$ref: '#/components/schemas/ChangelogPhotoAsset'}
    UserChangelogPage:
      type: object
      required: [page, per_page, last_page, total, items]
      properties:
        page: {type: integer}
        per_page: {type: integer}
        last_page: {type: integer}
        total: {type: integer, format: int64}
        items:
