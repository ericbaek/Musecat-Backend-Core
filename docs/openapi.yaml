  /user/activity:
    get:
      tags: [Users]
      summary: /user/activity
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
        - $ref: '#/components/parameters/UsernameQuery'
        - name: tz
          in: query
          description: IANA timezone. Defaults to `UTC`.
