  /developer/v1/account/arcade/photo:
    put:
      tags:
      - Connected account
      summary: "/arcade/photo"
      description: |-
        Requires account:access. Same payload, response and domain checks as PUT /arcade/photo. Management operations are excluded even for staff.

        Pending atoms receive 2 XP each when first published, up to 20 XP per campaign target or 10 XP per other public arcade in a rolling seven-day window. Uploading alone, reordering, removing, or reusing a previously published atom awards no XP. Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
      - delegatedOAuth:
        - account:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateArcadePhotoRequest"
            example:
              arcade: arcade_123
              photos:
              - atom_1
              - atom_2
      responses:
        '200':
          description: 'Photo relation updated. XP is awarded only when pending atoms
            are first published: 2 XP per atom, up to 20 XP per campaign target or
            10 XP per other public arcade in a rolling seven-day window. Uploading
            alone, reordering, removing, or reusing a published atom awards no XP.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UpdateArcadePhotoResponse"
              example:
                arcade: arcade_123
                photo: photo_molecule_123
                count: 2
                xp_feedback:
                  previous_exp: 0
                  new_exp: 2
                  diff_exp: 2
                  previous_percent_to_next_level: 0
                  new_percent_to_next_level: 50
                  previous_level: 0
                  new_level: 0
                  level_diff: 0
                  remaining_exp_to_next_level: 2
                  remaining_percent_to_next_level: 50
        '400':
          description: Invalid JSON or validation failure.
          content:
