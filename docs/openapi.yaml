        review_outcome: {type: string, enum: [upheld, dismissed, actioned]}
        review_note: {type: string}
        created: {type: string}
        updated: {type: string}
    ArcadeModerationRequest:
      type: object
      required: [id, kind, arcade, changelog, reported_editor, urgency, message, status, createdBy]
      properties:
        id: {type: string}
        kind: {type: string, enum: [general, edit_report, rollback_report]}
        arcade: {type: string}
        changelog: {type: string}
        reported_editor: {type: string}
        urgency: {type: string, enum: [high, medium, low]}
        message: {type: string}
        status: {type: string, enum: [waiting, approved, rejected, processing, done]}
        createdBy: {type: string}
        reviewed_by: {type: string}
        reviewed_at: {type: string}
        review_outcome: {type: string, enum: [upheld, dismissed, actioned]}
        review_note: {type: string}
        created: {type: string}
        updated: {type: string}
    ExternalService:
      type: object
      required: [id, name, scopes]
      properties:
        id: {type: string}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
    ExternalProvider:
      type: object
      required: [id, name, issuer, services]
      properties:
        id: {type: string}
        name: {type: string}
        issuer: {type: string, format: uri}
        services:
          type: array
          items: {$ref: '#/components/schemas/ExternalService'}
    ExternalServiceConnection:
      type: object
      description: Native CHUNITHM Info grants are public after OAuth consent; other providers default to private. Upstream privacy and development audience restrictions still apply.
      required: [service, visibility, fields]
      properties:
        service: {type: string}
        visibility:
          type: string
          enum: [private, public]
          description: New and reauthorized grants are private. No publish API exists in this phase.
        fields: {type: array, items: {type: string}}
    ExternalAccountConnection:
      type: object
      required: [id, provider, issuer, scopes, services, created, updated]
      properties:
        id: {type: string}
        provider: {type: string}
        issuer: {type: string, format: uri}
        scopes: {type: array, items: {type: string}}
        services:
          type: array
          items: {$ref: '#/components/schemas/ExternalServiceConnection'}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    ExternalConnectionStart:
      type: object
      additionalProperties: false
      required: [provider, services]
      properties:
        provider: {type: string}
        services:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string}
      example: {provider: rhythm, services: [chunithm, sdvx]}
    ExternalConnectionComplete:
      type: object
      additionalProperties: false
      required: [provider, state]
      properties:
        provider: {type: string}
        state: {type: string, minLength: 43, maxLength: 43}
        code: {type: string, maxLength: 4096}
        error: {type: string, maxLength: 256}
        iss:
          type: string
          description: Exact authorization response issuer. Required when the provider declares issuer support.
      oneOf:
        - required: [code]
          properties:
            code: {minLength: 1}
            error: {maxLength: 0}
        - required: [error]
          properties:
            error: {minLength: 1}
            code: {maxLength: 0}
    ConformanceReport:
      type: object
      required: [id, spec, status, current, created, cases]
      properties:
        id: {type: string}
        spec: {type: string, const: musecat-conformance/v1}
        status: {type: string, enum: [queued, running, passed, failed, incomplete, cancelled]}
        current: {type: boolean}
        created: {type: string}
        started: {type: string}
        finished: {type: string}
        cases:
          type: array
          items:
            type: object
            required: [id, status, code]
            properties:
              id: {type: string}
              status: {type: string, enum: [pass, fail, action_required, not_applicable]}
              code: {type: string, description: Bounded result code; never a remote response body.}
    ConformanceFixtures:
      type: object
      additionalProperties: false
      description: Optional dedicated staging-account fixtures. Never returned or logged. Use a separate disposable refresh family from the public/private access fixtures.
      properties:
        access_token: {type: string, maxLength: 4096, writeOnly: true}
        private_access_token: {type: string, maxLength: 4096, writeOnly: true}
        refresh_token: {type: string, maxLength: 4096, writeOnly: true}
        fresh_intent: {type: string, maxLength: 4096, writeOnly: true}
        expired_intent: {type: string, maxLength: 4096, writeOnly: true}
        consumed_intent: {type: string, maxLength: 4096, writeOnly: true}
        expected_subject: {type: string, maxLength: 256, writeOnly: true}
        private_subject: {type: string, maxLength: 256, writeOnly: true, description: Private test account subject when different from expected_subject.}
        joint_attempt_id: {type: string, maxLength: 15, description: Must belong to the application owner and the currently approved partner configuration.}
        destructive: {type: boolean, default: false, description: Required before refreshing and revoking a disposable refresh-token family.}
    JointConsent:
      type: object
      required: [id, partner, partner_name, partner_account, services, manifest, expires_at]
      properties:
        id: {type: string}
        partner: {type: string}
        partner_name: {type: string}
        partner_account: {type: string}
        services: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}}}}
        manifest: {type: string, enum: [musecat-joint/v1]}
        expires_at: {type: string, format: date-time}
    JointStatus:
      type: object
      properties:
        id: {type: string}
        partner: {type: string}
        status: {type: string, enum: [pending, approving, partial, connected, degraded, cancelled, expired, invalidated, revoked]}
        musecat_access: {type: boolean}
        partner_access: {type: boolean}
        remote_revocation_pending: {type: boolean}
        expires_at: {type: string, format: date-time}
    PartnerJointStatus:
      type: object
      properties:
        correlation_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approving, partial, connected, degraded, cancelled, expired, invalidated, revoked]}
        generation: {type: string}
        musecat_access: {type: boolean}
        partner_access: {type: boolean}
    PartnerLocalized:
      type: object
      properties:
        ko: {type: string, maxLength: 1024}
        en: {type: string, maxLength: 1024}
        ja: {type: string, maxLength: 1024}
    PartnerOnboardingForm:
      type: object
      description: Partner-authored onboarding document (musecat-partner-onboarding/v1). Never contains credentials. At least one direction is required. Direction B-only apps may omit direction_a; login and joint require nonempty Direction A redirects.
      required: [spec, partner_id, display_name, contact_email]
      anyOf:
        - required: [direction_a]
          properties:
            direction_a:
              required: [redirect_uris]
              properties:
                redirect_uris: {minItems: 1}
        - required: [direction_b]
      allOf:
        - if:
            required: [direction_a]
            properties:
              direction_a:
                required: [login_enabled]
                properties:
                  login_enabled: {const: true}
          then:
            properties:
              direction_a:
                required: [redirect_uris]
                properties:
                  redirect_uris: {minItems: 1}
        - if:
            required: [joint]
            properties:
              joint:
                required: [enabled]
                properties:
                  enabled: {const: true}
          then:
            required: [direction_a, direction_b]
            properties:
              direction_a:
                required: [redirect_uris]
                properties:
                  redirect_uris: {minItems: 1}
      properties:
        spec: {type: string, enum: [musecat-partner-onboarding/v1]}
        partner_id: {type: string, pattern: '^[a-z][a-z0-9_-]{0,127}$', description: Immutable after approval; also the OAuth client ID when Direction A is enabled.}
        display_name: {$ref: '#/components/schemas/PartnerLocalized'}
        description: {$ref: '#/components/schemas/PartnerLocalized'}
        contact_email: {type: string, format: email}
        website: {type: string, format: uri, maxLength: 2048}
        privacy_url: {type: string, format: uri, maxLength: 2048}
        terms_url: {type: string, format: uri, maxLength: 2048}
        support_url: {type: string, format: uri, maxLength: 2048}
        direction_a:
          type: object
          description: Omit or use empty redirect_uris for a Direction B-only application.
          properties:
            login_enabled: {type: boolean, default: false, description: Enable Sign in with Musecat; development access is owner and designated testers only.}
            redirect_uris: {type: array, minItems: 0, maxItems: 8, items: {type: string, format: uri}}
        direction_b:
          type: object
          description: Activates after validated registration and credential entry; development access is restricted to the owner and designated testers.
          required: [issuer, authorization_url, token_url, userinfo_url, revocation_url, records_url, client_auth_method, identity_scope, services]
          properties:
            issuer: {type: string, format: uri}
            authorization_url: {type: string, format: uri}
            token_url: {type: string, format: uri}
            userinfo_url: {type: string, format: uri}
            revocation_url: {type: string, format: uri}
            records_url: {type: string, format: uri}
            client_auth_method: {type: string, enum: [client_secret_basic]}
            identity_scope: {type: string}
            services:
              type: array
              minItems: 1
              maxItems: 16
              items:
                type: object
                required: [id, scope]
                properties:
                  id: {type: string, description: Canonical service ID from GET /developer/services.}
                  scope: {type: string}
        joint:
          type: object
          properties:
            enabled: {type: boolean}
            manifests: {type: array, items: {type: string, enum: [musecat-joint/v1]}}
            joint_url: {type: string, format: uri}
            connect_start_url: {type: string, format: uri}
            key_rotation_window_hours: {type: integer, minimum: 1, maximum: 168, default: 24}
    PartnerApplication:
      type: object
      description: Safe projection; secret material is never returned. status approved means validated active configuration. publication development limits use to owner and designated testers; production requires operator review. live means at least one registered direction is active. Direction A needs its own generated secret; Direction B needs only its partner-issued credentials. Suspension disables both.
      required: [id, partner_id, owner, status, live, display_name, description, submitted_form, approved_form, has_secret, review_note, created, updated]
      properties:
        id: {type: string}
        partner_id: {type: string}
        owner: {type: string}
        status: {type: string, enum: [draft, submitted, approved, rejected, suspended]}
        publication: {type: string, enum: [development, production]}
        review_status: {type: string, enum: [none, submitted, rejected]}
        testers: {type: array, maxItems: 10, items: {type: string}, description: Designated Musecat user IDs; owner is implicit.}
        tester_usernames: {type: array, maxItems: 10, items: {type: string}}
        live: {type: boolean}
        display_name: {$ref: '#/components/schemas/PartnerLocalized'}
        description: {$ref: '#/components/schemas/PartnerLocalized'}
        contact_email: {type: string}
        submitted_form: {$ref: '#/components/schemas/PartnerOnboardingForm'}
        approved_form:
          oneOf: [{$ref: '#/components/schemas/PartnerOnboardingForm'}, {type: 'null'}]
        has_secret: {type: boolean}
        direction_a_declared: {type: boolean, description: Submitted or approved form contains nonempty Direction A redirects.}
        direction_a_live: {type: boolean, description: Approved Direction A redirects and a generated Musecat secret exist and the application is not suspended.}
        direction_b_declared: {type: boolean}
        has_direction_b_credentials: {type: boolean}
        direction_b_live: {type: boolean, description: Approved form declares Direction B, credentials are stored, not suspended, and the server has a connection key. The partner then appears in GET /integrations/providers.}
        musecat_redirect_uri: {type: string, format: uri, description: Callback the partner must register for Musecat's Direction-B client; present whenever Direction B is declared.}
        review_note: {type: string}
        approved_at: {type: string, format: date-time}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    PartnerApplicationEvent:
      type: object
      required: [id, kind, actor, note, created]
      properties:
        id: {type: string}
        kind: {type: string, enum: [created, updated, submitted, approved, rejected, suspended, reinstated, secret_generated, credentials_set, credentials_cleared]}
        actor: {type: string}
        note: {type: string}
        created: {type: string, format: date-time}
    PartnerApplicationList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PartnerApplication'}}
    PartnerReviewInput:
      type: object
      properties:
        note: {type: string, maxLength: 2000}
    ExternalRecordLabel:
      type: object
      required: [en]
      properties: {ko: {type: string}, en: {type: string}, ja: {type: string}}
    ExternalRecordField:
      type: object
      required: [key, label, type, value]
      properties:
        key: {type: string, maxLength: 64}
        label: {$ref: '#/components/schemas/ExternalRecordLabel'}
        type: {type: string, enum: [integer, decimal, string, percent, datetime, date, rank]}
        value: {}
        precision: {type: integer, minimum: 0, maximum: 6}
    ExternalRecentPlays:
      type: object
      required: [plays]
      description: Latest first. IDs are provider-local; scores and performance metrics retain game-specific units. Omitted metrics are never zero-filled.
      properties:
        total: {type: integer, minimum: 0}
        more_url: {type: string, format: uri, description: HTTPS source history URL.}
        plays:
          type: array
          maxItems: 50
          items:
            type: object
            required: [played_at, song, chart, fields]
            properties:
              id: {type: string, maxLength: 128}
              played_at: {type: string, format: date-time}
              song:
                type: object
                required: [title]
                properties:
                  id: {type: string, maxLength: 128}
                  title: {type: string, minLength: 1, maxLength: 256}
                  artist: {type: string, maxLength: 256}
                  image_url: {type: [string, "null"], format: uri, maxLength: 2048, description: Optional HTTPS song cover URL without credentials. Null or empty is omitted from the cached projection; no cover is fabricated.}
              chart:
                type: object
                required: [difficulty]
                properties:
                  id: {type: string, maxLength: 128}
                  difficulty: {type: string, minLength: 1, maxLength: 64}
                  level: {type: string, maxLength: 32}
                  mode: {type: string, maxLength: 64}
              fields: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/ExternalRecordField'}}
    ExternalRecordSelection:
      type: object
      required: [key, status]
      description: Explains an omitted group or item. The corresponding data MUST be absent. Keys are player, fields, sections, recent_plays, fields.KEY or sections.KEY. Missing selection metadata means unspecified, never consent.
      properties:
        key: {type: string, maxLength: 73}
        status: {type: string, enum: [denied, no_data, unsupported]}
    ExternalRecordEnvelope:
      type: object
      description: Validated musecat-records/v1 envelope. The partner subject is removed before storage. The fixed CHUNITHM Info adapter projects authorized @me profile/rating/stats/scores into this same envelope; recent plays remain unsupported until the upstream exposes their detail.
      required: [spec, service, visibility, updated_at, source, fields, sections]
      properties:
        spec: {type: string, enum: [musecat-records/v1]}
        game_schema: {type: string, enum: [musecat-game/maimai/v1, musecat-game/chunithm/v1, musecat-game/sdvx/v1, musecat-game/iidx/v1, musecat-game/nostalgia/v1], description: Optional semantic profile matching the service. Unspecified service IDs keep generic typed rendering.}
        recent_plays: {$ref: '#/components/schemas/ExternalRecentPlays'}
        selection: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/ExternalRecordSelection'}}
        service: {type: string}
        visibility: {type: string, enum: [public, private]}
        updated_at: {type: string, format: date-time}
        source: {type: object, required: [name], properties: {name: {type: string}, url: {type: string, format: uri}}}
        player: {type: object, properties: {name: {type: string}, title: {type: string}, level: {type: integer}, team: {type: string}}}
        fields:
          type: array
          maxItems: 24
          items:
            type: object
            required: [key, label, type, value]
            properties:
              key: {type: string}
              label: {$ref: '#/components/schemas/ExternalRecordLabel'}
              type: {type: string, enum: [integer, decimal, string, percent, datetime, date, rank]}
              value: {}
              precision: {type: integer, minimum: 0, maximum: 6}
        sections:
          type: array
          maxItems: 4
          items:
            type: object
            required: [key, label, columns, rows]
            properties:
              key: {type: string}
              label: {$ref: '#/components/schemas/ExternalRecordLabel'}
              columns: {type: array, maxItems: 8, items: {type: object, required: [key, label, type], properties: {key: {type: string}, label: {$ref: '#/components/schemas/ExternalRecordLabel'}, type: {type: string}}}}
              rows: {type: array, maxItems: 50, items: {type: array, items: {}}}
              total: {type: integer}
              more_url: {type: string, format: uri}
    ExternalRecordView:
      type: object
      required: [connection, provider, service, status, fetched_at, updated_at, payload]
      properties:
        connection: {type: string}
        provider: {type: string}
        service: {type: string}
        status: {type: string, enum: [ok, private, unavailable, unsupported]}
        error: {type: string, description: Machine code such as token_refresh, unauthorized, forbidden, not_found, rate_limited, invalid_envelope, provider_disabled, network, never_fetched. A rate_limited result honors persisted upstream Retry-After seconds before another request.}
        fetched_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
        payload:
          oneOf: [{$ref: '#/components/schemas/ExternalRecordEnvelope'}, {type: 'null'}]
    ExternalPublicRecord:
      type: object
      required: [provider, provider_name, service, service_name, fetched_at, updated_at, payload]
      properties:
        provider: {type: string}
        provider_name: {type: string}
        service: {type: string}
        service_name: {type: string}
        fetched_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        payload: {$ref: '#/components/schemas/ExternalRecordEnvelope'}
paths:
  /community/comments:
    get:
      tags: [Community]
      summary: List root comments or replies with optional viewer personalization
      description: Twenty items per page, newest first with an opaque older cursor. Deleted roots remain only while active replies exist. Deleted posts are inaccessible. Responses are private and no-store.
      parameters:
        - {name: post, in: query, required: true, schema: {type: string}}
        - {name: parent, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: locale, in: query, schema: {type: string, enum: [ko-KR, en-US, ja-JP]}}
      responses:
        '200':
          description: Comment page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityCommentsPage'}
        '400': {description: Invalid parent, cursor or locale}
        '404': {description: Post not found}
  /community/comment:
    get:
      tags: [Community]
      summary: Read an active comment or its original
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
        - {name: locale, in: query, schema: {type: string, enum: [ko-KR, en-US, ja-JP]}}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityComment'}
        '400': {description: Invalid input}
        '404': {description: Comment or post not found}
    post:
      tags: [Community]
      summary: Create a comment or one-level reply
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommunityCommentInput'}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CommunityCommentInput'}
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityComment'}
        '400': {description: Invalid input}
        '404': {description: Comment or post not found}
        '401': {description: Sign-in required}
        '403': {description: Author-only operation or inactive account}
    put:
      tags: [Community]
      summary: Edit own comment within five minutes
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommunityCommentInput'}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CommunityCommentInput'}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityComment'}
        '400': {description: Invalid input}
        '404': {description: Comment or post not found}
        '401': {description: Sign-in required}
        '403': {description: Author-only operation or inactive account}
        '409': {description: Five-minute edit window closed}
    delete:
      tags: [Community]
      summary: Delete own comment at any time
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '204':
          description: Successful operation
        '400': {description: Invalid input}
        '404': {description: Comment or post not found}
        '401': {description: Sign-in required}
        '403': {description: Author-only operation or inactive account}
  /community/post/like:
    put:
      tags: [Community]
      summary: Set a post like idempotently
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authoritative current count and viewer state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityLike'}
        '401': {description: Sign-in required}
        '403': {description: Inactive account}
        '404': {description: Target or parent post not active}
    delete:
      tags: [Community]
      summary: Remove a post like idempotently
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authoritative current count and viewer state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityLike'}
        '401': {description: Sign-in required}
        '403': {description: Inactive account}
        '404': {description: Target or parent post not active}
  /community/comment/like:
    put:
      tags: [Community]
      summary: Set a comment like idempotently
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authoritative current count and viewer state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityLike'}
        '401': {description: Sign-in required}
        '403': {description: Inactive account}
        '404': {description: Target or parent post not active}
    delete:
      tags: [Community]
      summary: Remove a comment like idempotently
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authoritative current count and viewer state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityLike'}
        '401': {description: Sign-in required}
        '403': {description: Inactive account}
        '404': {description: Target or parent post not active}
  /developer/sign-in-with-musecat.md:
    get:
      tags: [OAuth delegation]
      summary: Sign in with Musecat integration guide and runnable partner example
      responses:
        '200': {description: Markdown guide, content: {text/markdown: {schema: {type: string}}}}
  /.well-known/openid-configuration:
    get:
      tags: [OAuth delegation]
      summary: Discover Sign in with Musecat endpoints and RS256 profile
      responses:
        '200': {description: OIDC discovery with issuer, authorization/token/userinfo endpoints, jwks_uri, pairwise subjects and RS256. Cache-Control no-store., content: {application/json: {schema: {type: object}}}}
        '503': {description: OAuth or OIDC signing keys are not configured.}
  /oauth/jwks:
    get:
      tags: [OAuth delegation]
      summary: Public RSA signing keys for Musecat ID tokens
      responses:
        '200': {description: Public JWK Set. Private key fields are never included., content: {application/json: {schema: {type: object, required: [keys], properties: {keys: {type: array, items: {type: object, required: [kty, use, alg, kid, n, e]}}}}}}}
        '503': {description: OIDC signing keys are not configured.}
  /oauth/userinfo:
    get:
      tags: [OAuth delegation]
      security: [{delegatedOAuth: [openid]}]
      summary: Verified login identity and approved basic profile
      description: Requires an opaque bearer access token with explicitly granted openid scope. Returns app-specific sub and, only with profile, preferred_username, nickname and an optional absolute public avatar picture URL. No email or global user id. Live revocation and account restrictions apply. No query parameters or body allowed. Cache-Control no-store.
      responses:
        '200': {description: UserInfo, content: {application/json: {schema: {type: object, required: [sub], properties: {sub: {type: string}, preferred_username: {type: string}, nickname: {type: string}, picture: {type: string, format: uri}}}}}}
        '400': {description: Invalid request.}
        '401': {description: Invalid, expired or revoked bearer token.}
        '403': {description: Missing explicit openid scope.}
    post:
      tags: [OAuth delegation]
      security: [{delegatedOAuth: [openid]}]
      summary: Read UserInfo with an empty POST and bearer Authorization header
      responses:
        '200': {description: Same UserInfo as GET. Cache-Control no-store.}
        '400': {description: Query or non-empty body is not accepted.}
        '401': {description: Invalid or revoked token.}
        '403': {description: Missing explicit openid scope.}
  /search:
    get:
      tags: [Search]
      summary: /search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Case-insensitive search keyword.
        - $ref: '#/components/parameters/LimitQuery'
        - name: lat
          in: query
          schema:
            type: number
            format: double
          description: User latitude. Provide together with `lon` to boost nearby arcade results.
        - name: lon
          in: query
          schema:
            type: number
            format: double
          description: User longitude. Provide together with `lat` to boost nearby arcade results.
      responses:
        '200':
          description: Search results grouped by resource bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              example:
                users:
                  - username: searchhero
                    nickname: Alpha Nick
                    avatar: ""
                arcades:
                  - id: ubbeq9qzfck5s4w
                    country: KR
                    name: Search Palace
                    address: 101 Exact Road
                    nickname: [First Spot]
                    closed: false
                    distance_km: 0.4
        '400':
          description: Missing search query or invalid limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream database lookup failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade:
    get:
      tags: [Arcades]
      summary: /arcade
      description: |
        Returns only a public arcade (open or closed) and relation ids by default.
        Private arcades always return `404`; use authenticated `GET /arcade/draft` for a creator or developer/moderator draft read.
        When `expand=game`, each `game.items[]` entry includes `version`, `series`, `updated`, and the editable game fields.
        Unauthenticated callers receive redacted sensitive data: `tag` is null, `location` and `updated` are empty strings, `price` retains only representative items with `hasHiddenPrices=true` and `accept=null`, and `expand=hour` returns only today's schedule for the arcade timezone.
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Arcade id.
        - name: arcade
          in: query
          schema:
            type: string
          description: Alias for `id`.
        - name: expand
          in: query
          schema:
            type: string
          description: |
            `none` or empty returns relation ids only. `all` expands every section.
            Comma-separated values such as `basic,hour` expand only the requested sections.
        - name: source
          in: query
          schema:
            type: string
            enum: [direct, search, nearby, other, poster, google, naver, bing]
            default: direct
          description: Optional acquisition source recorded with the page view. search is internal site search; poster is poster QR; google, naver, and bing are external search referrals. Missing or unknown values use direct.
        - name: game_series
          in: query
          description: Optional repeated or comma-separated series IDs used to reach the arcade.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Arcade metadata with relation ids or expanded relation payloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeValueResponse'
              examples:
                idsOnly:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: "2026-04-01 12:00:00.000Z"
                      updated: "2026-04-10 09:00:00.000Z"
                    basic: basic_rel
                    hour: hour_rel
                    sns: sns_rel
                    gtk: gtk_rel
                    game: game_rel
                    photo: photo_rel
                expanded:
                  value:
                    admin:
                      id: arcade_123
                      public: true
                      closed: false
                      country: AU
                      timezone: Australia/Sydney
                      createdBy: user_123
                      created: "2026-04-01 12:00:00.000Z"
                      updated: "2026-04-10 09:00:00.000Z"
                    basic:
                      id: basic_rel
                      name: Sydney Arcade
                      address: 123 George St, Sydney NSW
                      direction: Level 2
                      nickname: [Town Hall]
                      subway_line: [T1]
                      location:
                        lat: -33.8708
                        lon: 151.2062
                    hour:
                      id: hour_rel
                      Monday:
                        start: 1000
                        end: 2300
                      Thursday:
                        start: 0
                        end: 0
                      Sunday: 499
                      Note: Late night on Thursdays
                    sns:
                      id: sns_rel
                      items:
                        - type: instagram
                          link: https://instagram.com/example
                          name: Official account
                    gtk:
                      id: gtk_rel
                      items:
                        - type: smoking
                          bool: false
                    game:
                      id: game_rel
                      items:
                        - id: atom_123
                          updated: "2026-04-10 09:00:00.000Z"
                          version:
                            id: version_123
                            series: series_123
                            released_on: "2025-01-01"
                            en: Version A
                            kr: Version A
                            jp: Version A
                            price_default: null
                          series:
                            id: series_123
                            seriesNumber: 1
                            en: Series A
                            kr: Series A
                            jp: Series A
                            en_short: A
                            kr_short: A
                            jp_short: A
                            manufacturer: null
                          location: 2F
                          quantity: 1
                          price:
                            currency: KRW
                            type: custom
                            list:
                              - value: 500
                            accept: [Cash]
                          tag: []
                    photo:
                      id: photo_rel
        '400':
          description: Missing target arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/analytics:
    get:
      tags: [Arcades]
      summary: /arcade/analytics
      description: |
        Returns cumulative analytics for a public, open arcade. Anonymous and ordinary
        contributors below level 15 receive only `page_views`, `fault_reports`, and `edit_count`.
        Level-15+ users additionally receive `page_views_by_source` and `series_filter_entries`
        when `page_views` exceeds 1000. These breakdowns remain available to privileged users.
        `direction_clicks`,
        `visit_verifications`, and `distinct_visitors` are omitted unless the bearer
        user has both the `arcade_owner` tag and the arcade ID in `owns`, or has the
        `developer` or `moderator` tag. The `createdBy` relation alone is insufficient.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Public-safe or privileged cumulative analytics response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeAnalyticsResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist, is private, or is closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/analytics/event:
    post:
      tags: [Arcade Mutations]
      summary: /arcade/analytics/event
      description: |
        Records an anonymous direction-click analytics event. The request body is limited to
        2 KiB and accepts at most ten distinct game-series IDs. To limit anonymous metric
        manipulation, each client IP may record at most 20 events per rolling 10 minutes and
        may record an event for the same arcade only once every 30 seconds. Once the arcade is
        validated, rejected series IDs also consume this quota before their database lookup. The server does
        not persist the client IP, user agent, or identity; limits are process-local and retain
        no more than 4,096 active clients.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArcadeAnalyticsEventRequest'}
      responses:
        '200':
          description: Analytics event recorded.
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: {type: boolean, const: true}
        '400':
          description: Invalid event body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '413':
          description: Analytics event body exceeds 2 KiB.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Anonymous client exceeded the per-arcade cooldown or rolling event limit. The `Retry-After` header is included.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
              description: Seconds until this anonymous client may retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Analytics event persistence failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/draft:
    get:
      tags: [Arcades]
      summary: /arcade/draft
      description: Reads a private draft only for its creator or a `developer|moderator`. Public records are intentionally rejected; clients use `/arcade` for public reads.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Arcade metadata with the same shape as `GET /arcade`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeValueResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '404':
          description: Arcade does not exist or is not accessible as a draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      tags: [Arcade Mutations]
      summary: /arcade/draft
      description: Deletes only the authenticated creator's private draft. Published arcade history is never deleted by this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Draft deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: {type: string}
                  deleted: {type: boolean}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Caller is not the draft creator.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Draft not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Published arcades cannot be deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/drafts:
    get:
      tags: [Arcade Mutations]
      summary: /arcade/drafts
      description: Lists the authenticated user's private drafts only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Own draft summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeDraftListResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
  /arcade/memo:
    get:
      tags: [Arcades]
      summary: /arcade/memo
      description: Returns the current immutable memo revision. Public arcades are anonymously readable; private arcades require the creator or a developer/moderator bearer token.
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current memo revision, or null when no memo has been written.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeMemoResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or private access is denied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      tags: [Arcade Mutations]
      summary: /arcade/memo
      description: Creates an immutable Tiptap JSON revision and moves the arcade memo pointer. Requires an authenticated user with arcade write access. Saves and changelog creation are atomic.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutArcadeMemoRequest'}
      responses:
        '200':
          description: Memo saved; unchanged documents return changed=false without creating a revision.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, changed, memo]
                properties:
                  arcade: {type: string}
                  changed: {type: boolean}
                  memo:
                    $ref: '#/components/schemas/ArcadeMemo'
        '400':
          description: Invalid arcade id or Tiptap document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Authenticated arcade write access is required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or private access is denied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/changelog:
    get:
      tags: [Arcades]
      summary: /arcade/changelog
      description: Detailed changelog requires an active authenticated user, including for public open/closed arcades. Private history is available only to the creator or a developer/moderator.
      security:
        - bearerAuth: []
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: changed
          in: query
          description: Optional arcade part filter. Omit to return all supported categories.
          schema:
            type: string
            enum: [basic, game, hour, sns, gtk, photo, memo]
      responses:
        '200':
          description: Immutable changelog page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeChangelogPage'}
        '400':
          description: Invalid pagination, missing arcade id, or unsupported changed category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid user authentication.
        '403':
          description: User is inactive.
        '404':
          description: Arcade does not exist or private history is inaccessible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcade/photo/file:
    get:
      tags: [Arcades]
      summary: /arcade/photo/file
      description: Streams one photo through the custom API. A published photo of a public arcade is anonymous-readable and privately browser-cacheable for five minutes. Pending or draft photos require a bearer token with atom-list access and are never cached. Clients must use the returned `file_url`, not PocketBase `/api/files` URLs. Supported thumbnail queries return the configured derivative and never silently fall back to the original file.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
        - name: thumb
          in: query
          required: false
          schema: {type: string, enum: [96x96, 384x384, 680x0]}
          description: Returns a configured square crop or a 680px-wide aspect-preserving thumbnail.
      responses:
        '200':
          description: Photo bytes.
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '400':
          description: Missing photo atom id or unsupported thumbnail size.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Photo atom does not exist or is inaccessible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /arcades:
    get:
      tags: [Arcades]
      summary: /arcades
      description: Returns operating public arcades only. Public closed arcades are deliberately excluded and remain available through detail/search.
      parameters:
        - name: public
          in: query
          schema:
            type: boolean
          description: "`false` is rejected; this parameter exists only for explicit v2 compatibility diagnostics."
        - name: closed
          in: query
          schema:
            type: boolean
          description: "`true` is rejected; `/arcades` is an operating-discovery endpoint."
        - $ref: '#/components/parameters/CountryQuery'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Page of operating public arcade summaries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeSummaryPage'}
              example:
                page: 1
                per_page: 50
                last_page: 1
                total: 1
                items:
                  - id: arcade_123
                    country: AU
                    name: Sydney Arcade
                    address: 123 George St, Sydney NSW
                    location:
                      lat: -33.8708
                      lon: 151.2062
                    game_series: [series_1, series_2]
        '400':
          description: Invalid boolean filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Database lookup failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcades/updates:
    get:
      tags: [Arcades]
      summary: Fixed public dashboard summary
      description: Returns at most six latest blocks from distinct public open arcades. If a non-KR arcade has history, at least one is included, replacing the sixth KR entry when necessary. Results remain newest first. Query parameters, including page and limit, are rejected.
      responses:
        '200':
          description: Fixed summary array.
          content:
            application/json:
              schema:
                type: array
                maxItems: 6
                items: {$ref: '#/components/schemas/ArcadeUpdateSummary'}
        '400':
          description: Query parameters are not supported.
  /arcades/updates/history:
    get:
      tags: [Arcades]
      summary: Authenticated recent change history
      security:
        - bearerAuth: []
      description: Historical public open arcade activity, excluding passport verifications before block grouping and pagination. Requires a user session.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CountryQuery'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      responses:
        '200':
          description: Historical block pagination envelope.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, per_page, last_page, total]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ArcadeUpdateSummary'}
                  page: {type: integer}
                  per_page: {type: integer}
                  last_page: {type: integer}
                  total: {type: integer}
        '400':
          description: Invalid limit or page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User authentication required.
        '502':
          description: Failed to build update list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcades/nearby:
    get:
      tags: [Arcades]
      summary: /arcades/nearby
      parameters:
        - name: game_filter
          in: query
          description: |
            Repeat this parameter once per selected game series with a
            URL-encoded JSON object such as
            `{"series":"sdvx","cabinet":"valkyrie"}`. Omitting
            `cabinet` means all cabinets for that series. Separate objects
            use AND semantics across series. For example, maimai without a
            cabinet and SDVX with `"valkyrie"` requires both series while
            leaving maimai's cabinet unrestricted. `game_filter` cannot be combined
            with the legacy `game_series` or `game_cabinet` parameters.
          schema:
            type: array
            items:
              type: string
        - name: game_series
          in: query
          description: |
            Repeat the query parameter or pass comma-separated `game_series` ids.
            With no `game_cabinet`, every listed series is required and cabinet
            identity is ignored, including unverified cabinet revisions. When
            `game_cabinet` is present, order is significant: each series is paired
            positionally with the cabinet at the same index and every pair is required.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: game_cabinet
          in: query
          description: |
            Repeat the query parameter or pass comma-separated canonical
            `game_cabinet` ids. Cabinet filtering requires `game_series`, the
            two expanded lists must have equal lengths, and values are paired
            positionally. Each `(game_series, game_cabinet)` pair must match the
            same revision in the arcade's currently selected game state; all
            requested pairs use AND semantics. A cabinet-only request is invalid.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: address
          in: query
          schema:
            type: string
          description: Normalized address keyword filter.
        - name: country
          in: query
          schema:
            type: string
          description: Optional ISO country-code filter.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: distance_limit
          in: query
          description: Optional maximum distance in kilometers from the supplied location.
          schema:
            type: number
            format: double
            minimum: 0
        - name: expand
          in: query
          description: |
            When true, expands each item's `game` payload with arcade game details,
            including each revision's cabinet. When game filters are supplied,
            expanded items contain only revisions matching the requested series
            and, when supplied, its selected cabinet. Separate grouped series
            remain required. Legacy positional series/cabinet pairs retain
            their compatibility behavior.
          schema:
            type: boolean
      responses:
        '200':
          description: Distance-sorted paginated nearby results. The response also marks campaign-target arcades and includes campaigns that have pending targets in the current page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadesNearbyResponse'
              example:
                page: 1
                per_page: 15
                last_page: 1
                total: 1
                country_totals:
                  AU:
                    total: 1
                    nearest_arcade:
                      id: arcade_123
                      distance_km: 0.4
                items:
                  - id: arcade_123
                    country: AU
                    name: Sydney Arcade
                    address: 123 George St, Sydney NSW
                    location:
                      lat: -33.8708
                      lon: 151.2062
                    game_series: [series_1]
                    game:
                      id: game_123
                      state_id: game_123
                      items:
                        - id: atom_1
                          updated: "2026-04-10 09:00:00.000Z"
                          version:
                            id: version_1
                            series: series_1
                            released_on: 2025-01-01
                            en: Sydney Version
                            kr: Sydney Version
                            jp: Sydney Version
                            price_default: null
                          series:
                            id: series_1
                            seriesNumber: 1
                            en: Sydney Series
                            kr: Sydney Series
                            jp: Sydney Series
                            en_short: Sydney
                            kr_short: Sydney
                            jp_short: Sydney
                            manufacturer: null
                          cabinet:
                            id: cabinet_gold
                            en: CHUNITHM GOLD
                            kr: 츄니즘 골드
                            jp: チュウニズム ゴールド
                          location: 1F
                          quantity: 1
                          price: {}
                          tag: []
                          flags: []
                    distance_km: 0.4
                campaigns: []
        '400':
          description: |
            Invalid or missing location/page value; an invalid grouped
            `game_filter`; mixed grouped and legacy game parameters; a
            `game_cabinet` without `game_series`; or unequal expanded
            `game_series` and `game_cabinet` list lengths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to load arcades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /community/posts:
    get:
      tags: [Community]
      summary: List immediately public community posts
      parameters:
        - name: game_series
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items: {type: string, minLength: 1}
          description: Include posts matching any selected game series; omit to list all posts. Applied before pagination.
        - name: author
          in: query
          schema: {type: string}
          description: Restrict to this author before pagination.
        - name: flair
          in: query
          schema: {type: string, enum: [achievement, question, tip, news, event, art, chitchat]}
        - name: has_images
          in: query
          schema: {type: string, enum: ["true"]}
          description: Only posts with photos, applied before pagination.
        - name: locale
          in: query
          schema: {type: string, enum: [ko-KR, en-US, ja-JP], default: ko-KR}
          description: Requested display locale. Non-Korean variants fall back to ko-KR until translation publication is enabled.
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Paginated active posts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityPostList'}
        '400':
          description: Invalid locale or pagination.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Failed to load posts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /community/post:
    get:
      tags: [Community]
      summary: Get an immediately public community post
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
        - name: locale
          in: query
          schema: {type: string, enum: [ko-KR, en-US, ja-JP], default: ko-KR}
      responses:
        '200':
          description: Active post, localized only when translation publication is enabled and ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityPost'}
        '400':
          description: Missing id or invalid locale.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Post not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      tags: [Community]
      summary: Publish a Korean community post immediately
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommunityPostInput'}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CommunityPostInput'}
      responses:
        '201':
          description: Korean original is public immediately; translation is scheduled five minutes later.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityPost'}
        '400':
          description: Invalid body, flair, or game series.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required.
        '403':
          description: Withdrawn or banned user.
        '502':
          description: Failed to create post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      tags: [Community]
      summary: Edit the author's Korean original within five minutes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommunityPostInput'}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CommunityPostInput'}
      responses:
        '200':
          description: Updated Korean original. The original translation deadline is unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunityPost'}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication required.
        '403':
          description: Not the author, withdrawn, or banned.
        '404':
          description: Post not found.
        '409':
          description: Five-minute edit window has closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Failed to update post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      tags: [Community]
      summary: Delete the author's post at any time
      description: Retains a private tombstone, removes attached public files and cached translations, and excludes the post from detail, feeds, galleries, counts and translation jobs. Repeated deletion by the author returns 204.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted, or already deleted by this author.
        '400':
          description: Missing id.
        '401':
          description: Authentication required.
        '403':
          description: Not the author, withdrawn, or banned.
        '404':
          description: Post not found.
        '502':
          description: Failed to delete post.
  /user:
