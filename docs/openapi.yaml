          content:
            application/json:
              schema:
                type: object
                required: [from, to, count, changed]
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  count:
                    type: integer
                  changed:
                    type: string
                    description: Always `game`.
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Developer or moderator access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Transaction or notification failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

