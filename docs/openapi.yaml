      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogCompatibilityMutationRequest'
      responses:
        '200':
          description: The complete resulting compatibility set and immutable audit rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogCompatibilityMutationResponse'
        '409': { description: Stale checklist, incompatible cabinet, or a link referenced by active data. }

  /native/moderation/game/catalog/changes:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /moderation/game/catalog/changes. Responses are no-store.
    get:
      tags: [Moderator]
      summary: List immutable game catalog changes
      security:
        - nativeBearer: []
      parameters:
        - name: entity
          in: query
          schema: {type: string}
        - name: entity_id
          in: query
          schema: {type: string}
        - name: actor
          in: query
          schema: {type: string}
        - name: action
          in: query
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Paginated catalog audit evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

