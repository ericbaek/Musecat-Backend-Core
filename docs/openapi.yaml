  /developer/v1/campaign/check:
    post:
      tags:
      - Delegated resources
      summary: POST /developer/v1/campaign/check
      description: |
        Delegated access requires campaign:respond. Existing domain visibility, role, ownership, location and XP rules still apply. Confirms whether one active update-campaign target is still on the old
        version or has been updated. A `still_old` result awards 1 XP once per
        user and target. The default request requires a same-day
        verified visit at the public/open arcade. `bypass_location=true` skips
        only that visit check and requires level 10 or above; an updated result
        through this path awards 1 XP; clients must obtain two warning
        confirmations before sending it.
      security:
      - delegatedOAuth:
        - campaign:respond
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CampaignCheckRequest"
      responses:
        '200':
          description: Campaign check persisted; still_old results award 1 XP, while
            updated results atomically move the game state and award campaign XP, or
            1 XP when location is bypassed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CampaignCheckResponse"
        '400':
          description: Invalid campaign check body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '404':
          description: Campaign or public arcade was not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: Campaign is inactive, target is outside scope, or game state
            is no longer eligible.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Campaign check transaction failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '429':
          description: Rate limited.
