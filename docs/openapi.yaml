      description: |-
        Requires account:access. Same payload, response and domain checks as POST /arcade/rollback. Management operations are excluded even for staff.

        Applies an immediate rollback. With `report=true`, it atomically creates a `rollback_report` linked to the cited changelog; it never auto-bans the cited editor. Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
      - delegatedOAuth:
