            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reverse_geocode:
    get:
      tags: [Geo]
      summary: /reverse_geocode
      description: Default per-client-IP limit is 30 requests per 60 seconds, shared by anonymous and authenticated users. Operator-configured limits and PocketBase exemptions may override the defaults. Cached responses preserve the requested query or exact coordinates.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: region
          in: query
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Normalized reverse geocoding result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
        '400':
          description: Invalid or missing coordinates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Client IP request limit exceeded, including authenticated requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '502':
          description: Upstream reverse geocoding failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/games:
