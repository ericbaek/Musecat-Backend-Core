        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Reverted item and new immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Current item cannot safely be reverted. }
  /user/feedback:
