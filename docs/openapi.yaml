          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing auth or invalid password.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account already withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Withdraw transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/report:
    get:
      tags: [Support]
      summary: /user/report
      security:
        - bearerAuth: []
      parameters:
        - name: user
