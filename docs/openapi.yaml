                  page: {type: integer}
                  per_page: {type: integer}
                  last_page: {type: integer}
                  total: {type: integer}
        '400':
          description: Invalid limit or page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
