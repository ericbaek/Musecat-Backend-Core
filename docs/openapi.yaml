      description: |-
        Requires account:access. Same payload, response and domain checks as GET /arcade/campaigns/presence. Management operations are excluded even for staff.

        Returns only game ids with active campaign prompts for a public/open arcade, using the same eligibility as /arcade/campaigns (current from_version machines or current to_version machines with an updated campaign report created less than seven days ago). Already-updated machines without reports and updates aged seven days or more are excluded. Campaign configuration, rewards, locations, and reports are omitted so anonymous detail pages can show campaign presence safely.
      parameters:
