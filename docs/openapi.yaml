      responses:
        '200':
          description: Updated public visit visibility.
  /user/countries:
    put:
      tags: [Users]
      summary: /user/countries
      description: Replaces the authenticated user's ordered profile country list. Empty is allowed. Accounts below level 15 may select zero or one country; accounts at level 15 or above may select up to three. Supporter and staff tags do not change this limit.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileCountriesRequest'}
      responses:
        '200':
          description: Updated normalized profile countries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCountriesResponse'}
        '400':
          description: Invalid JSON, duplicate, invalid country code, or more than three countries.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Multiple countries require level 15 or above, or the account is inactive.
        '409':
          description: The account has not initialized user_info.
        '502':
          description: Failed to save profile countries.
  /user/withdraw:
    post:
      tags: [Users]
      summary: /user/withdraw
      security:
