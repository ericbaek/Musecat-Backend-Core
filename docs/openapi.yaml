      summary: "Advance this user's read cursor"
      description: "Active user only. Current conversation permissions are checked on every request. Responses are private, no-store."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"conversationId": {"type": "string"}, "lastReadSequence": {"type": "integer", "minimum": 0}, "unreadCount": {"type": "integer", "minimum": 0}}}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"throughSequence": {"type": "integer", "minimum": 0}}, "required": ["throughSequence"]}}}}

  /user/conversations/{id}/inquiry:
    patch:
      tags: ["Messaging"]
      summary: "Change inquiry workflow status"
      description: "Requester may set waiting/solved; current inbox responders may also set recognised. DM has no status. Status updates do not alter lastMessageAt or anyone else's read cursor."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ConversationSummary"}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"status": {"type": "string", "enum": ["waiting", "recognised", "solved"]}}, "required": ["status"]}}}}

  /user/conversations/{id}/attachments/{messageId}/{file}:
    get:
      tags: ["Messaging"]
      summary: "Read a protected conversation photo"
      description: "Current conversation ACL and exact file/message ownership required. Existing legacy files are served from their unchanged storage reference only after verifying legacy inquiry mapping. No public file token or redirect."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "Protected image; Cache-Control private, no-store.", "content": {"image/*": {"schema": {"type": "string", "format": "binary"}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "messageId", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "file", "in": "path", "required": true, "schema": {"type": "string"}}]

  /user/messaging/preferences:
    get:
      tags: ["Messaging"]
      summary: "Read DM receive preference"
      description: "Active user only. Current conversation permissions are checked on every request. Responses are private, no-store."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"receive": {"type": "string", "enum": ["everyone", "nobody"]}}, "required": ["receive"]}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
    put:
      tags: ["Messaging"]
      summary: "Set DM receive preference"
      description: "Active user only. Current conversation permissions are checked on every request. Responses are private, no-store."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"receive": {"type": "string", "enum": ["everyone", "nobody"]}}, "required": ["receive"]}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"receive": {"type": "string", "enum": ["everyone", "nobody"]}}, "required": ["receive"]}}}}

  /user/messaging/blocks:
    get:
      tags: ["Messaging"]
      summary: "List this user's blocked users"
      description: "Active user only. Current conversation permissions are checked on every request. Responses are private, no-store."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"items": {"type": "array", "maxItems": 100, "items": {"$ref": "#/components/schemas/MessagingParty"}}}}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}

  /user/messaging/blocks/{userId}:
    put:
      tags: ["Messaging"]
      summary: "Block or unblock personal DM"
      description: "Either side's block prevents new DM messages in both directions. Existing history stays accessible. Does not affect arcade/team inquiries; limit 100 directed blocks."
      security: [{"bearerAuth": []}]
      responses: {"204": {"description": "Success"}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      parameters: [{"name": "userId", "in": "path", "required": true, "schema": {"type": "string"}}]
    delete:
      tags: ["Messaging"]
      summary: "Block or unblock personal DM"
      description: "Either side's block prevents new DM messages in both directions. Existing history stays accessible. Does not affect arcade/team inquiries; limit 100 directed blocks."
      security: [{"bearerAuth": []}]
      responses: {"204": {"description": "Success"}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      parameters: [{"name": "userId", "in": "path", "required": true, "schema": {"type": "string"}}]

  /user/messaging/recipients:
    get:
      tags: ["Messaging"]
      summary: "Search public users for a personal DM"
      description: "Authenticated bounded public profile projection, excludes self and withdrawn users. Does not disclose receive preference or block state."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/MessagingParty"}}}}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      parameters: [{"name": "q", "in": "query", "schema": {"type": "string", "minLength": 2, "maxLength": 100}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 20, "default": 10}}]

  /user/messages/{messageId}/report:
    post:
      tags: ["Messaging"]
      summary: "Report an accessible message and preserve evidence"
      description: "Only a user who can currently read the conversation may report. A repeated report returns its existing id with 200. Evidence is private and immutable; reporting grants no broader conversation access."
      security: [{"bearerAuth": []}]
      responses: {"201": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"id": {"type": "string"}}}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}
      parameters: [{"name": "messageId", "in": "path", "required": true, "schema": {"type": "string"}}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"reason": {"type": "string", "minLength": 1, "maxLength": 2000}}, "required": ["reason"]}}}}

  /user/events:
    get:
      tags: ["Messaging"]
      summary: "Subscribe to one authenticated shared event stream"
      description: "SSE ready, conversation.changed {id,latestSequence,reason}, conversation.read {id,lastReadSequence}, notifications.changed, resync, session.expired. No private message payload. Auth/account and conversation ACL rechecked before delivery. 15s heartbeat, 25-minute connection lifetime, 4 streams/user and 1024/process, queue32. Slow consumers receive resync then close. Reconnect must fetch database snapshots/deltas; Last-Event-ID has no durable replay contract."
      security: [{"bearerAuth": []}]
      responses: {"200": {"description": "private,no-store SSE with proxy buffering disabled.", "content": {"text/event-stream": {"schema": {"type": "string"}}}}, "400": {"description": "Invalid input."}, "401": {"description": "Authentication required."}, "403": {"description": "Restricted account or unavailable recipient."}, "404": {"description": "Missing or inaccessible conversation/message."}, "409": {"description": "Idempotency key conflicts with stored payload or inbox is unavailable."}, "413": {"description": "Upload exceeds limits."}, "429": {"description": "Rate or stream limit. Retry-After supplies delay in seconds."}}

  /moderation/messages/reports:
    get:
      tags: ["Messaging"]
      summary: "List reported message snapshots"
      description: "Current active developer/moderator only. Access is limited to reported evidence; it grants no private DM history access. Photos are private and no-store."
      security: [{"bearerAuth": []}]
      parameters: [{"name": "cursor", "in": "query", "schema": {"type": "string"}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "default": 20, "minimum": 1, "maximum": 50}}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/MessagingReport"}}, "nextCursor": {"type": "string", "nullable": true}}}}}}, "400": {"description": "Invalid cursor or limit."}, "401": {"description": "Authentication required."}, "403": {"description": "Current active staff access required."}, "404": {"description": "Report or reported photo not found."}}

  /moderation/messages/reports/{id}:
    get:
      tags: ["Messaging"]
      summary: "Read one reported message snapshot"
      description: "Current active developer/moderator only. Access is limited to reported evidence; it grants no private DM history access. Photos are private and no-store."
      security: [{"bearerAuth": []}]
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses: {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MessagingReport"}}}}, "400": {"description": "Invalid cursor or limit."}, "401": {"description": "Authentication required."}, "403": {"description": "Current active staff access required."}, "404": {"description": "Report or reported photo not found."}}

  /moderation/messages/reports/{id}/attachments/{file}:
    get:
      tags: ["Messaging"]
      summary: "Read one photo included in a reported message snapshot"
      description: "Current active developer/moderator only. Access is limited to reported evidence; it grants no private DM history access. Photos are private and no-store."
      security: [{"bearerAuth": []}]
      parameters: [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "file", "in": "path", "required": true, "schema": {"type": "string"}}]
      responses: {"200": {"description": "Success", "content": {"application/octet-stream": {"schema": {"type": "string", "format": "binary"}}}}, "400": {"description": "Invalid cursor or limit."}, "401": {"description": "Authentication required."}, "403": {"description": "Current active staff access required."}, "404": {"description": "Report or reported photo not found."}}

  /announcements:
    get:
      summary: List published announcement stories
      description: Newest publication first, 20 items, private no-store. A cursor from a now-archived publication remains valid. Only releases targeting the requested locale are returned. Public metadata omits unselected draft variants; image bytes are fetched separately. Guests may read published content.
      parameters:
        - {name: before, in: query, schema: {type: string}}
        - {name: locale, in: query, schema: {type: string, enum: [ko, en, ja], default: ko}}
      responses:
        '200': {description: Published stories., content: {application/json: {schema: {$ref: '#/components/schemas/AnnouncementPage'}}}}
        '400': {description: Invalid cursor.}
  /announcements/unseen:
    get:
      summary: Get the latest story targeting the current locale only if this account has not viewed it
      description: Does not queue older unviewed stories after the latest matching release has been viewed. Viewing a story is independent of inbox read state and shared across selected languages.
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [ko, en, ja], default: ko}}
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Latest unseen story or null.
          content:
            application/json:
              schema:
                type: object
                required: [announcement]
                properties:
                  announcement:
                    oneOf: [{$ref: '#/components/schemas/Announcement'}, {type: 'null'}]
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
  /announcements/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Read an announcement story
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [ko, en, ja], default: ko}}
      description: Published content is public only when its selected audience includes the requested locale; mismatches return 404 with no fallback. Draft and archived content is visible only to developer or moderator accounts. Private no-store.
      responses:
        '200': {description: Story metadata., content: {application/json: {schema: {$ref: '#/components/schemas/Announcement'}}}}
        '404': {description: Missing or inaccessible story.}
  /announcements/{id}/images/{filename}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: filename, in: path, required: true, schema: {type: string}}
    get:
      summary: Read a story image through current publication visibility
      description: Raw file REST access is protected. This route verifies current story visibility and image membership, including after archive or draft removal. Unselected locale images remain private to active staff even when other languages are published. Private no-store.
      responses:
        '200': {description: PNG, JPEG or WebP bytes.}
        '404': {description: Missing or inaccessible image.}
  /announcements/{id}/view:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Idempotently mark one published story viewed by the current account
      security: [{bearerAuth: []}]
      responses:
        '200': {description: View persisted; inbox read state unchanged.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '404': {description: Missing or unpublished story.}
  /moderation/announcements:
    get:
      summary: List all announcement drafts, publications and archives
      security: [{bearerAuth: []}]
      parameters:
        - {name: before, in: query, schema: {type: string}}
      responses:
        '200': {description: 'Newest-created first, 20 items.', content: {application/json: {schema: {$ref: '#/components/schemas/AnnouncementPage'}}}}
        '400': {description: Invalid cursor.}
        '401': {description: Authentication required.}
        '403': {description: Active developer or moderator required.}
    post:
      summary: Create an announcement draft
      description: No notification is created before publication. Maximum 12 actual PNG/JPEG/WebP images per locale, 5 MiB and 40 megapixels per image; total body 181 MiB. Images containing text are supplied separately for ko, en and ja; no translation is inferred.
      security: [{bearerAuth: []}]
      requestBody: &announcementMutationBody
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnnouncementInput'}
          multipart/form-data:
            schema:
              type: object
              required: [localizations]
              properties:
                localizations: {type: string, description: JSON encoding of AnnouncementInput.localizations. Complete replacement map; ordered slides specify retained fileName or upload:N and alt text.}
                images_ko: {type: array, maxItems: 12, items: {type: string, format: binary}}
                images_en: {type: array, maxItems: 12, items: {type: string, format: binary}}
                images_ja: {type: array, maxItems: 12, items: {type: string, format: binary}}
      responses:
        '201': {description: Draft saved., content: {application/json: {schema: {$ref: '#/components/schemas/Announcement'}}}}
        '400': {description: Invalid metadata, foreign file reference, or invalid image.}
        '401': {description: Authentication required.}
        '403': {description: Active developer or moderator required.}
        '413': {description: Image or total request exceeds byte limit.}
  /moderation/announcements/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    put:
      summary: Replace draft localized content and ordered image references
      description: Omitting references removes images. Retained files need no re-upload. Published and archived content is immutable.
      security: [{bearerAuth: []}]
      requestBody: *announcementMutationBody
      responses:
        '200': {description: Draft saved., content: {application/json: {schema: {$ref: '#/components/schemas/Announcement'}}}}
        '400': {description: Invalid input.}
        '401': {description: Authentication required.}
        '403': {description: Active developer or moderator required.}
        '404': {description: Missing story.}
        '409': {description: Story is no longer a draft.}
        '413': {description: Image or total request exceeds byte limit.}
  /moderation/announcements/{id}/publish:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Publish selected language variants once
      description: Requires a nonempty unique supported locale selection. Only selected variants need titles and 1..12 images each. Image alt text may be empty. Content and selected locales become immutable. A durable bounded worker creates one logical inbox event per existing non-withdrawn account; inbox reads filter by locale. Only already registered devices with selected saved locales get deliveries, and delivery rechecks current device locale. Repeating the same selected locale set is idempotent, including after read/view. Device pushes remain at-least-once with a stable notification tag.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locales]
              properties:
                locales:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: {type: string, enum: [ko, en, ja]}
      responses:
        '200': {description: Published story., content: {application/json: {schema: {$ref: '#/components/schemas/Announcement'}}}}
        '400': {description: Invalid selection or one or more selected variants are incomplete.}
        '401': {description: Authentication required.}
        '403': {description: Active developer or moderator required.}
        '404': {description: Missing story.}
        '409': {description: Archived story cannot be republished or selected locales differ from the original publication.}
  /moderation/announcements/{id}/archive:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Archive a draft or publication without deleting event/view identities
      description: Idempotent terminal state. Stops unfinished fan-out and prevents delivery of remaining queued push receipts; hides public metadata, images and inbox entries. Previously displayed OS notifications cannot be recalled.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Archived story., content: {application/json: {schema: {$ref: '#/components/schemas/Announcement'}}}}
        '401': {description: Authentication required.}
        '403': {description: Active developer or moderator required.}
        '404': {description: Missing story.}

x-musecat-joint-connection:
  status: implemented
  public-endpoints-enabled: true
  description: Active only for operator-approved registrations with both OAuth credentials and both server keys. See /developer/integration-spec.md.

  /developer/apps/{id}/records-key:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Developer Center]
      summary: Generate or rotate the incoming record-cache invalidation server key
      security: [{bearerAuth: []}]
      description: Requires an owned non-suspended registration declaring Direction B. Supports B-only apps. Returns plaintext once with no-store and no-referrer. Shares the inbound server key and rotation window with Joint when Joint is enabled; a B-only key does not enable Joint endpoints. Default previous-key grace is 24 hours. Store only on the partner server.
      responses:
        '200': {description: One-time server key., content: {application/json: {schema: {type: object, required: [partner_id, key], properties: {partner_id: {type: string}, key: {type: string}}}}}}
        '401': {description: User authentication required.}
        '404': {description: Missing or another user's application.}
        '409': {description: Direction B not declared or application suspended.}

  /developer/apps/{id}/testers:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    put:
      tags: [Developer Center]
      summary: Replace the development tester audience
      security: [{bearerAuth: []}]
      description: Owner is always included implicitly. Resolve up to ten exact active usernames; reject duplicates, the owner, unknown or restricted users. Changing the development audience invalidates live registration fingerprints and old grants. Production audience remains public.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [usernames], properties: {usernames: {type: array, maxItems: 10, items: {type: string}}}}
      responses:
        '200': {description: Updated application., content: {application/json: {schema: {$ref: '#/components/schemas/PartnerApplication'}}}}
        '400': {description: Invalid tester usernames.}
        '404': {description: Missing or another user's application.}
        '409': {description: Suspended application.}
