            schema:
              type: object
              required: [email, username, password, nickname, arcadeId]
              properties:
                arcadeId: {type: string, minLength: 1}
                email: {type: string, format: email, maxLength: 254}
                username: {type: string, minLength: 4, maxLength: 15, pattern: '^[A-Za-z0-9]+$'}
                password: {type: string, minLength: 8, maxLength: 71, writeOnly: true}
                nickname: {type: string, minLength: 1, maxLength: 25}
      responses:
