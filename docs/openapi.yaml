      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RollbackArcadeRequest"
      responses:
        '200':
          description: Rollback applied.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation or rollback rule failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: An unresolved report already exists for the cited changelog.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '502':
          description: Rollback transaction failure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
