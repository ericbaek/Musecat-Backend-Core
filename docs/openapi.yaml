  /arcade/notice:
    get:
      tags: [Arcades]
      summary: /arcade/notice
      parameters:
        - name: arcade
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching notices ordered by priority with 0 treated as the lowest priority, then latest first within the same priority. Soft-deleted notices are excluded. Notices whose `until` is reached are soft-deleted before the response is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListArcadeNoticeResponse'
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Requires `developer`, `moderator`, or `arcade_owner` in `tag` or `tags`, or a `supporter`/`founding_supporter` at level 30 or above. Developers and moderators may create on any arcade. Official accounts may create only on their own `owns` arcades. Level-30+ supporters may create unless another official account manages the target through `owns`. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - bearerAuth: []
      x-upload-limits: {maxPhotos: 3, maxPhotoBytes: 5242880, maxBodyBytes: 16777216}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArcadeNoticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateArcadeNoticeMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Created notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeNotice'
        '413': {description: Image exceeds 5 MiB or encoded body exceeds 16 MiB.}
        '400':
          description: Invalid JSON or missing arcade id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Notice role or supporter level-30 access is missing, official ownership is missing, or a supporter attempted to post on an officially managed arcade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Create failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Developers and moderators may update every notice. Official account authors may update their own notices. Level-30+ supporter authors may update their own notices. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - bearerAuth: []
      x-upload-limits: {maxPhotos: 3, maxPhotoBytes: 5242880, maxBodyBytes: 16777216}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateArcadeNoticeMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Updated notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeNotice'
        '413': {description: Image exceeds 5 MiB or encoded body exceeds 16 MiB.}
        '400':
          description: Invalid JSON or missing notice id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: The caller lacks the required notice author role and level, or is neither the notice author nor a developer or moderator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Arcade Mutations]
      summary: /arcade/notice
      description: |
        Developers and moderators may delete every notice. Official account authors may delete their own notices. Level-30+ supporter authors may delete their own notices. Private drafts additionally require the draft creator or a developer/moderator.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteArcadeNoticeRequest'
      responses:
        '200':
          description: Soft-deleted notice.
          content:
            application/json:
              schema:
                type: object
                required: [id, delete]
                properties:
                  id:
                    type: string
                  delete:
                    type: boolean
        '400':
          description: Invalid JSON or missing notice id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: The caller lacks the required notice author role and level, or is neither the notice author nor a developer or moderator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Delete failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
