                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/sns:
    put:
      tags: [Arcade Mutations]
      summary: /arcade/sns
      description: |
        Creates a new `arcade_sns` molecule and writes the atoms under it.
        The success response returns the same expanded SNS shape used by `GET /arcade?expand=sns`.
        Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeSNSRequest'
      responses:
        '200':
          description: SNS relation updated.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, sns, xp_feedback]
                properties:
                  arcade:
                    type: string
                  sns:
                    $ref: '#/components/schemas/ArcadeSnsExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/game:
    put:
      tags: [Arcade Mutations]
      summary: /arcade/game
      description: |
        Applies an add/modify/remove delta to the current immutable game state and
        updates only `arcade.game_v2`. All three arrays are required. `modify`
        objects are complete replacements, not partial patches. Existing item ids
        are durable entries; a deleted entry may be reused when the same arcade,
        series, and verified cabinet match historical state. Cabinet ids must be
        supported by the submitted version. Price titles accept strings or numbers
        (for example, a numeric credit count) and preserve their stored type.
        Fields and catalog references are validated only for submitted add/modify
        items; untouched revisions are preserved. The resulting list still requires
        unique entry ids and version/cabinet pairs. Public game edits use a rolling
        seven-day distinct-entry XP window with target `min(10, 2*n)`;
        private edits do not award normal edit XP, and administrative bulk
        updates do not award it either.
        Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadeGameRequest'
      responses:
        '200':
          description: Game relation updated.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, game, count, xp_feedback]
                properties:
                  arcade:
                    type: string
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  count:
                    type: integer
                    description: Number of active entries in the resulting state.
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`base_state_id` is stale and does not equal the current `arcade.game_v2`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /arcade/report-settings:
    get:
      tags: [Arcade Mutations]
      summary: GET /arcade/report-settings
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: arcade
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeReportSettings'
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
    put:
      tags: [Arcade Mutations]
      summary: PUT /arcade/report-settings
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArcadeReportSettings'
                - type: object
                  required: [arcade]
                  properties:
                    arcade: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeReportSettings'
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
  /user/feedback/thread/photo:
    get:
      tags: [User]
      summary: Download a private original or reply attachment as a current inquiry participant
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema: {type: string}
          description: Reply message id. Supply exactly one of id or feedbackId.
        - in: query
          name: feedbackId
          schema: {type: string}
          description: Original inquiry id. Supply exactly one of id or feedbackId.
        - in: query
          name: file
          required: true
          schema: {type: string}
          description: Exact filename returned in the selected original inquiry or reply photos array.
      responses:
        '200':
          description: Attachment bytes, private no-store. Raw PocketBase file URLs remain locked.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {description: Missing or ambiguous attachment record selector}
        '401': {description: Authentication required}
        '404': {description: Missing file or inaccessible parent inquiry}
  /user/feedback/thread:
    get:
      tags: [User]
      summary: Read a private inquiry conversation (author, current scoped official, or strict staff)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema: {type: string}
        - in: query
          name: before
          schema: {type: string}
          description: Oldest reply id from the preceding page; replies are returned chronologically, 50 per page.
      responses:
        '200':
          description: Original inquiry, attachment filenames, chronological items and older-page cursor. The nullable conversationId identifies its canonical messaging inquiry after migration. Private no-store.
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
    post:
      tags: [User]
      summary: Append an immutable reply and atomically notify the other participant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedbackId, message]
              properties:
                feedbackId: {type: string}
                message: {type: string, minLength: 1, maxLength: 4000}
          multipart/form-data:
            schema:
              type: object
              required: [feedbackId]
              properties:
                feedbackId: {type: string}
                message: {type: string, maxLength: 4000}
                photos:
                  type: array
                  maxItems: 3
                  items: {type: string, format: binary}
                  description: Images (content-sniffed, matching initial inquiry uploads); at most 15,000,000 bytes per file. Text or at least one photo is required.
      responses:
        '201': {description: Persisted reply with server-derived author, staff/official role, and photos filename array. Reply photo bytes require the private thread/photo endpoint.}
        '400': {description: Invalid reply}
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
        '413': {description: Photo or total multipart body exceeds upload limits}
    patch:
      tags: [User]
      summary: Resolve or reopen an inquiry as its author, current scoped official, or strict staff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedbackId, status]
              properties:
                feedbackId: {type: string}
                status: {type: string, enum: [solved, waiting]}
      responses:
        '200': {description: Persisted id and status. Private no-store. No reply is created.}
        '400': {description: Invalid status}
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
        '413': {description: Request exceeds 4 KiB}
  /user/notifications:
    get:
      summary: List the authenticated user's notifications
      description: Active account required. Private, no-store inbox with up to 20 visible entries, newest first. Rechecks source visibility and current arcade management rights. The durable arcade_setup notice remains visible to current active exact arcade_owner accounts regardless of saved inquiry/report modes; reading it never changes settings. Does not expose endpoints or subscription credentials.
      security: [{bearerAuth: []}]
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [ko, en, ja], default: ko}, description: Announcement title/summary language and audience filter; other notification kinds are unaffected.}
        - {name: before, in: query, schema: {type: string}, description: Last notification id from the previous page.}
      responses:
        '200':
          description: Inbox page and unread count.
          content:
            application/json:
              schema:
                type: object
                required: [items, unread, next]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, read, created, arcadeName, gameName, message, reaction, url]
                      properties:
                        id: {type: string}
                        kind: {type: string, enum: [report_created, report_reaction, feedback_created, feedback_reply, arcade_setup, message, announcement]}
                        read: {type: boolean}
                        created: {type: string}
                        arcadeName: {type: string}
                        gameName: {type: string}
                        title: {type: string, description: Localized announcement title; omitted for other kinds.}
                        message: {type: string}
                        reaction: {type: string}
                        url: {type: string, description: "Server-generated relative deep link. Announcements open /community/updates?announcement=id, feedback opens /updates/feedback?thread=id, and arcade_setup resolves current ownership to /arcade/id?setup=dashboard (legacy redirect fallback)."}
                  unread: {type: integer, minimum: 0}
                  next: {type: string, description: Empty at the end of the inbox.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
  /user/notifications/read:
    post:
      summary: Persist read state for one or all own notifications
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                all: {type: boolean}
      responses:
        '200': {description: Own notifications marked read. A foreign id cannot modify another account.}
        '400': {description: Notification id or all=true required.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '413': {description: Request exceeds 4 KiB.}
  /user/notifications/device:
    post:
      summary: Read whether the current account registered this device
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: {type: string, maxLength: 2048}
      responses:
        '200':
          description: Private, no-store device status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}
        '400': {description: Invalid endpoint.}
        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '413': {description: Request exceeds 4 KiB.}
    put:
      summary: Register this browser endpoint for the authenticated account
      description: Transfers a shared browser endpoint away from the previous account, including legacy arcade subscriptions. No browser permission is granted by this API; the browser must explicitly subscribe first.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
