      summary: DELETE /arcade/report-subscription
      description: Stores an explicit per-arcade opt-out and cancels pending report pushes for this arcade and device. The canonical device remains enabled for personal activity and other arcades.
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, endpoint]
              properties:
                arcade: {type: string}
                endpoint: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}

  /native/user:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user. Responses are no-store.
    get:
      security:
        - nativeBearer: []
      tags: [Users]
      summary: /user
      description: Public profile by ID or username. Active developers and moderators receive owner-level fields with private, no-store caching. Restricted staff receive the public projection.
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
        - $ref: '#/components/parameters/UsernameQuery'
      responses:
        '200':
          description: Normalized public profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: toq3to4ncbf5ubd
                created: "2026-03-30 10:15:00.000Z"
                username: public_user_toq3to4ncbf5ubd
                nickname: public_nick
                countries: [KR]
                primary_country: KR
                bio: public bio
                avatar: ""
                background: ""
                tag: []
                sns:
                  items: []
                withdrawn: false
                series_public: false
        '400':
          description: Missing id and username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to build profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/user/activity:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/activity. Responses are no-store.
    get:
      security:
        - nativeBearer: []
      tags: [Users]
      summary: /user/activity
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
        - $ref: '#/components/parameters/UsernameQuery'
        - name: tz
          in: query
          description: IANA timezone. Defaults to `UTC`.
          schema:
            type: string
        - name: days
          in: query
          description: Integer between 1 and 365. Defaults to 365.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: User profile plus activity counts and heatmap buckets. Heatmap intensity uses fixed logarithmic daily-count buckets so an outlier does not flatten the rest of the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActivityResponse'
              example:
                user:
                  id: toq3to4ncbf5ubd
                  created: "2026-03-30 10:15:00.000Z"
                  username: public_user_toq3to4ncbf5ubd
                  nickname: public_nick
                  bio: public bio
                  avatar: ""
                  background: ""
                  tag: []
                  sns:
                    items: []
                  withdrawn: false
                  series_public: false
                  level: 0
                range:
                  start_date: "2025-03-30"
                  end_date: "2026-03-29"
                  tz: Asia/Seoul
                  days: 365
                totals:
                  total_count: 18
                  changelog_count: 9
                  flag_count: 5
                  legacy_ticket_count: 4
                  attendance_count: 0
                  max_daily_count: 3
                days:
                  - date: "2026-03-29"
                    total_count: 2
                    level: 2
                    changelog_count: 1
                    flag_count: 1
                    legacy_ticket_count: 0
                    attendance_count: 0
        '400':
          description: Invalid id/username combination, timezone, or day count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to build activity response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/user/changelog:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/changelog. Responses are no-store.
    get:
      security:
        - nativeBearer: []
      tags: [Users]
      summary: /user/changelog
      description: |
        Returns the user's edits in reverse chronological order. Anonymous callers
        receive only arcade and changed-category summaries from public
        arcades only. An authenticated caller may additionally receive rows
        from private arcades they own; `developer` and `moderator` callers may
        audit private rows. The endpoint never exposes flags, visits, or legacy
        tickets; those remain activity aggregates rather than changelog rows.
        Authenticated user accounts receive revision detail only for rows allowed
        by the existing arcade visibility filter. Responses use private, no-store
        caching. Invalid bearer credentials receive 401.
        Rows whose arcade aggregate was deleted are omitted, and withdrawn
        users receive an empty page.
      parameters:
        - name: user
          in: query
          required: true
          description: User id whose server-authored changelog rows are requested.
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: changed
          in: query
          description: Optional arcade part filter. Omit to return all supported categories.
          schema:
            type: string
            enum: [basic, game, hour, sns, gtk, photo, memo]
      responses:
        '200':
          description: User-scoped immutable changelog page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserChangelogPage'}
        '400':
          description: Missing user id, invalid pagination, or unsupported changed category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Invalid bearer credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: User does not exist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Failed to query the user changelog.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/user/passport/stamps:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/passport/stamps. Responses are no-store.
    get:
      tags: [User]
      summary: Owner or shared passport
      description: Current public venues including closed ones. Omit user for authenticated owner. An explicit user ID allows anonymous summary/full access; withdrawn profiles return 404. Private profiles return 404 except for active developers and moderators, who receive full visit dates. Summary omits every visit date. Existing visibility settings take the new scope immediately. No shared caching or raw verification metadata.
      security: [{nativeBearer: []}, {}]
      parameters:
        - in: query
          name: user
          description: Target profile ID. Omit for the authenticated owner.
          schema: {type: string}
        - in: query
          name: year
          schema: {type: string, default: all, pattern: '^(all|[0-9]{4})$'}
        - in: query
          name: country
          schema: {type: string, pattern: "^[A-Z]{2}$"}
        - in: query
          name: city
          schema: {type: string}
        - in: query
          name: sort
          schema: {type: string, enum: [recent, first, visits], default: recent}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - in: query
          name: per_page
          schema: {type: integer, minimum: 1, maximum: 100, default: 24}
      responses:
        '200':
          description: Passport result. Stable sort ties use arcade ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PassportStampPage'}
        '400': {description: Invalid filter or pagination.}
        '401': {description: Missing or invalid authentication.}
        '403': {description: Inactive account.}
        '404': {description: Private, missing or withdrawn target profile.}
        '502': {description: Failed to load passport.}

  /native/user/profile:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/profile. Responses are no-store.
    put:
      tags: [Users]
      summary: Update the authenticated user's profile
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: {type: string, minLength: 1, maxLength: 25}
                bio: {type: string, maxLength: 100}
                sns: {$ref: '#/components/schemas/UserProfileSns'}
                avatar: {type: 'null', description: Null deletes the current avatar.}
                background: {type: 'null', description: Null deletes the current background; requires level 15.}
                background_position: {$ref: '#/components/schemas/UserProfile/properties/background_position'}
          multipart/form-data:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: {type: string, minLength: 1, maxLength: 25}
                bio: {type: string, maxLength: 100}
                sns: {type: string, description: JSON encoded UserProfileSns object.}
                avatar: {type: string, format: binary, description: PNG or JPEG up to 15 MB; empty or "null" text deletes.}
                background: {type: string, format: binary, description: PNG or JPEG up to 15 MB; empty or "null" text deletes. Requires level 15.}
                background_position: {type: string, description: "JSON encoded x/y percentages (0 to 100), optional zoom (1 to 4) and rotation (0/90/180/270); requires level 15."}
      responses:
        '200':
          description: Updated self profile, including private series.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '400':
          description: Invalid profile input.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Inactive user or background access requires level 15.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Missing user_info record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Storage or profile read failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/user/game-preferences:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/game-preferences. Responses are no-store.
    put:
      tags: [Users]
      summary: Replace the authenticated user's preferred game series and visibility
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [series, series_public]
              properties:
                series:
                  type: array
                  items: {type: string}
                series_public: {type: boolean}
                warp: {type: boolean, description: Omit to retain the current value.}
      responses:
        '200':
          description: Saved preferences with duplicate and blank series IDs removed.
          content:
            application/json:
              schema:
                type: object
                required: [success, series, series_public, warp]
                properties:
                  success: {type: boolean}
                  series: {type: array, items: {type: string}}
                  series_public: {type: boolean}
                  warp: {type: boolean}
        '400':
          description: Invalid preferences or unknown game series.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Inactive user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Missing user_info record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Storage failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/user/signup:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/signup. Responses are no-store.
    post:
      tags: [Users]
      summary: /user/signup
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpJsonRequest'
          multipart/form-data:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  maxLength: 15
                nickname:
                  type: string
                bio:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Signup initialized.
          content:
            application/json:
              schema:
                type: object
                required: [success, profile]
                properties:
                  success:
                    type: boolean
                  profile:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Withdrawn or banned account cannot sign up.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/AccountBannedResponse'
        '409':
          description: Username or user_info already initialized, or username already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Signup transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/user/check-in:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/check-in. Responses are no-store.
    post:
      tags: [Users]
      summary: /user/check-in
      security:
        - nativeBearer: []
      responses:
        '200':
          description: Check-in state and XP feedback.
          content:
            application/json:
              schema:
                type: object
                required: [checked_in, already_checked_in, gained_exp, exp, level, day, xp_feedback]
                properties:
                  checked_in:
                    type: boolean
                  already_checked_in:
                    type: boolean
                  gained_exp:
                    type: integer
                  exp:
                    type: integer
                  level:
                    type: integer
                  day:
                    type: string
                    description: KST date in `YYYY-MM-DD` format.
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Withdrawn or banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Check-in transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/user/countries:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/countries. Responses are no-store.
    put:
      tags: [Users]
      summary: /user/countries
      description: Replaces the authenticated user's ordered profile country list and display mode. Empty is allowed. Accounts below level 15 may select zero or one country; accounts at level 15 or above may select up to three. Supporter and staff tags do not change this limit.
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileCountriesRequest'}
      responses:
        '200':
          description: Updated normalized profile countries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileCountriesResponse'}
        '400':
          description: Invalid JSON, duplicate, invalid country code, or more than three countries.
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: Multiple countries require level 15 or above, or the account is inactive.
        '409':
          description: The account has not initialized user_info.
        '502':
          description: Failed to save profile countries.

  /native/user/visit-visibility:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/visit-visibility. Responses are no-store.
    put:
      tags: [Users]
      summary: /user/visit-visibility
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VisitVisibilityRequest'}
      responses:
        '200':
          description: Updated public visit visibility.

  /native/user/favorite-visibility:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/favorite-visibility. Responses are no-store.
    put:
      tags: [Users]
      summary: /user/favorite-visibility
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite_visibility]
              properties:
                favorite_visibility: {type: string, enum: [private, public]}
      responses:
        '200':
          description: Updated favorite arcade visibility.

  /native/user/withdraw:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/withdraw. Responses are no-store.
    post:
      tags: [Users]
      summary: /user/withdraw
      description: Official arcade accounts require their exact current password even when an OAuth provider is linked. Successful official withdrawal removes arcade_owner and clears owns so the arcade is no longer officially managed by the withdrawn account.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '200':
          description: Account withdrawn successfully.
          content:
            application/json:
              schema:
                type: object
                required: [success, withdrawnAt]
                properties:
                  success:
                    type: boolean
                  withdrawnAt:
                    type: string
        '400':
          description: Invalid JSON or password missing for password accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing auth or invalid password.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PocketBaseAuthError'
                  - $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account already withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Withdraw transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/user/arcade-account/credentials:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/arcade-account/credentials. Responses are no-store.
    put:
      tags: [Users]
      summary: Change the authenticated official arcade account email or password
      description: Active arcade_owner accounts only. Requires the exact current password and at least one changed credential. Revokes every existing session on success; email changes clear email verification and visibility. Does not change username, roles, ownership, or arcade content.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: {type: string, writeOnly: true}
                email: {type: string, format: email, maxLength: 254}
                newPassword: {type: string, minLength: 8, maxLength: 71, writeOnly: true}
      responses:
        '200':
          description: Credentials updated atomically. All prior session tokens are invalid; sign in again.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: {type: boolean}
        '400': {description: Invalid input or no changes (code invalid_input or no_changes).}
        '401': {description: Missing auth or incorrect current password (code invalid_password).}
        '403': {description: Restricted or non-official account (code not_official_account).}
        '409': {description: Email already in use (code duplicate_email).}
        '413': {description: Body exceeds 16 KiB.}
        '502': {description: Failed to update credentials.}

  /native/user/report:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/report. Responses are no-store.
    get:
      tags: [Support]
      summary: /user/report
      security:
        - nativeBearer: []
      parameters:
        - name: user
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching user reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Withdrawn or banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Support]
      summary: /user/report
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserReportRequest'
      responses:
        '200':
          description: User report created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Withdrawn or banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Create failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/user/arcade-inquiry-onboarding:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/arcade-inquiry-onboarding. Responses are no-store.
    get:
      tags: [Users, Arcade]
      summary: List current official owner's inquiry settings
      description: Active authenticated users only; reloads current exact arcade_owner role and owns relations. All currently owned arcades are returned, including configured arcades, including scoped private names. Staff-only and ordinary accounts receive empty items. Missing arcade relations are skipped; missing basic relations yield an empty name. Private no-store response.
      security:
        - nativeBearer: []
      responses:
        '200':
          description: Unconfigured currently owned arcades.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [arcadeId, arcadeName, settings, reportSettings]
                      properties:
                        arcadeId: {type: string}
                        arcadeName: {type: string}
                        settings:
                          $ref: '#/components/schemas/InquirySettings'
                        reportSettings:
                          type: object
                          required: [mode, contactType, contactValue, guide]
                          properties:
                            mode: {type: string, enum: [internal, external]}
                            contactType: {type: string}
                            contactValue: {type: string, maxLength: 2048}
                            guide: {type: string, maxLength: 2000}
        '401': {description: Authentication required.}
        '403': {description: Inactive account.}

  /native/user/feedback:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/feedback. Responses are no-store.
    get:
      tags: [Support, Users]
      summary: List the authenticated user's own feedback
      description: Active users only. Ownership is forced from the bearer token; createdBy query values are ignored. Anonymous submissions and other users' records are never returned. Includes all statuses unless filtered, with id, message, status, createdBy, photos (filenames), created and updated. This does not grant file access or open the reviewer queue.
      security:
        - nativeBearer: []
      parameters:
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Own records ordered newest first, with items and total; an empty history returns an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '401': {description: Missing or invalid user token.}
        '403': {description: Withdrawn or banned user.}
        '502': {description: List failure.}

  /native/user/feedback/thread:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/feedback/thread. Responses are no-store.
    get:
      tags: [User]
      summary: Read a private inquiry conversation (author, current scoped official, or strict staff)
      security:
        - nativeBearer: []
      parameters:
        - in: query
          name: id
          required: true
          schema: {type: string}
        - in: query
          name: before
          schema: {type: string}
          description: Oldest reply id from the preceding page; replies are returned chronologically, 50 per page.
      responses:
        '200':
          description: Original inquiry, attachment filenames, chronological items and older-page cursor. Private no-store.
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
    post:
      tags: [User]
      summary: Append an immutable reply and atomically notify the other participant
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedbackId, message]
              properties:
                feedbackId: {type: string}
                message: {type: string, minLength: 1, maxLength: 4000}
          multipart/form-data:
            schema:
              type: object
              required: [feedbackId]
              properties:
                feedbackId: {type: string}
                message: {type: string, maxLength: 4000}
                photos:
                  type: array
                  maxItems: 3
                  items: {type: string, format: binary}
                  description: Images (content-sniffed, matching initial inquiry uploads); at most 15,000,000 bytes per file. Text or at least one photo is required.
      responses:
        '201': {description: Persisted reply with server-derived author, staff/official role, and photos filename array. Reply photo bytes require the private thread/photo endpoint.}
        '400': {description: Invalid reply}
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
        '413': {description: Photo or total multipart body exceeds upload limits}
    patch:
      tags: [User]
      summary: Resolve or reopen an inquiry as its author, current scoped official, or strict staff
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedbackId, status]
              properties:
                feedbackId: {type: string}
                status: {type: string, enum: [solved, waiting]}
      responses:
        '200': {description: Persisted id and status. Private no-store. No reply is created.}
        '400': {description: Invalid status}
        '401': {description: Authentication required}
        '404': {description: Missing or inaccessible inquiry}
        '413': {description: Request exceeds 4 KiB}

  /native/user/feedback/thread/photo:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /user/feedback/thread/photo. Responses are no-store.
    get:
      tags: [User]
      summary: Download a private original or reply attachment as a current inquiry participant
      security:
        - nativeBearer: []
      parameters:
        - in: query
          name: id
          schema: {type: string}
          description: Reply message id. Supply exactly one of id or feedbackId.
        - in: query
          name: feedbackId
          schema: {type: string}
          description: Original inquiry id. Supply exactly one of id or feedbackId.
        - in: query
          name: file
          required: true
          schema: {type: string}
          description: Exact filename returned in the selected original inquiry or reply photos array.
      responses:
        '200':
          description: Attachment bytes, private no-store. Raw PocketBase file URLs remain locked.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {description: Missing or ambiguous attachment record selector}
        '401': {description: Authentication required}
        '404': {description: Missing file or inaccessible parent inquiry}

  /native/support_feedback:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /support_feedback. Responses are no-store.
    get:
      tags: [Support]
      summary: /support_feedback
      description: Strict support review queue. Requires an active `developer` or `moderator`; supporter tags are insufficient.
      security:
        - nativeBearer: []
      parameters:
        - name: createdBy
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching support feedback entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Active developer or moderator access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      security:
        - nativeBearer: []
      tags: [Support]
      summary: /support_feedback
      description: Default per-client-IP limit is 10 requests per 600 seconds, shared by anonymous and authenticated users. With no official account, arcade-scoped inquiries accept guests through moderator fallback. With a current official account, missing configuration defaults to OFF and disabled mode rejects creation with 409 INQUIRY_DISABLED; loginRequired rejects anonymous submissions with 401 LOGIN_REQUIRED; external mode rejects creation with 409 INQUIRY_EXTERNAL. Private arcades remain inaccessible to guests. Guest submissions preserve existing initial-receipt semantics and do not grant authenticated conversation access. Operator-configured limits and PocketBase exemptions may override the defaults. Accepts at most 3 images of 15000000 bytes each; the total encoded body is limited to 46048576 bytes (45 MB of photos plus 1 MiB of form overhead).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportFeedbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSupportFeedbackMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Created support feedback record.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, status, createdBy, photos, created, updated]
                properties:
                  id:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                  createdBy:
                    type: string
                  created:
                    type: string
                  updated:
                    type: string
                  photos:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': {description: LOGIN_REQUIRED for a scoped inquiry requiring sign-in, or inactive account.}
        '404': {description: Missing or inaccessible arcade.}
        '409': {description: INQUIRY_DISABLED for OFF or unconfigured official arcades; INQUIRY_EXTERNAL for official arcades using external contact.}
        '413':
          description: File exceeds 15000000 bytes or encoded request body exceeds 46048576 bytes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '429':
          description: Client IP request limit exceeded, including authenticated requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '502':
          description: Create failure.
    put:
      tags: [Support]
      summary: Review a support feedback record
      description: Strict support review queue. Requires an active developer or moderator.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: {type: string}
                status: {type: string, enum: [waiting, recognised, solved]}
      responses:
        '200':
          description: Updated support feedback record.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, status, createdBy, photos, created, updated]
                properties:
                  id: {type: string}
                  message: {type: string}
                  status: {type: string}
                  createdBy: {type: string}
                  created: {type: string}
                  updated: {type: string}
                  photos: {type: array, items: {type: string}}
        '400': {description: Validation failed.}
        '401': {description: Missing or invalid user token.}
        '403': {description: Developer or moderator access required.}
        '404': {description: Support feedback was not found.}
        '502':
          description: Update failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

