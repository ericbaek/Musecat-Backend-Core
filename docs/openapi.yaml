        Returns cumulative analytics for a public, open arcade. Anonymous and ordinary
        contributors below level 15 receive only `page_views`, `fault_reports`, and `edit_count`.
        Level-15+ users additionally receive `page_views_by_source` and `series_filter_entries`
        when `page_views` exceeds 1000. These breakdowns remain available to privileged users.
        `direction_clicks`,
        `visit_verifications`, and `distinct_visitors` are omitted unless the bearer
        user has both the `arcade_owner` tag and the arcade ID in `owns`, or has the
        `developer` or `moderator` tag. The `createdBy` relation alone is insufficient.
      security:
      - delegatedOAuth:
        - account:access
      parameters:
      - name: arcade
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public-safe or privileged cumulative analytics response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeAnalyticsResponse"
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Arcade does not exist, is private, or is closed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
  /developer/v1/account/arcade/campaigns:
    get:
      tags:
      - Connected account
      summary: List active campaign prompts for an arcade
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /arcade/campaigns. Management operations are excluded even for staff.

        Returns campaign prompts for the requested public/open arcade to an authenticated active user. Includes current from_version machines and current to_version machines with an updated report for the same campaign and arcade/game created less than seven days ago. Already-updated machines without a campaign update report and reports aged seven days or more are excluded. Each item includes current target status and report history; expiry leaves game state and campaign overview history intact.
      security:
      - delegatedOAuth:
        - account:access
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current campaign prompts for the arcade.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadeCampaignListResponse"
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '502':
          description: Campaign targets could not be loaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
  /developer/v1/account/arcade/campaigns/presence:
