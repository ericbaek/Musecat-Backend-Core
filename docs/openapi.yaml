          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/arcade/analytics:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/analytics. Responses are no-store.
    get:
      tags: [Arcades]
      summary: /arcade/analytics
      description: |
        Returns cumulative analytics for a public, open arcade. Anonymous and ordinary
        contributors below level 15 receive only `page_views`, `fault_reports`, and `edit_count`.
        Level-15+ users additionally receive `page_views_by_source` and `series_filter_entries`
        when `page_views` exceeds 1000. These breakdowns remain available to privileged users.
        `direction_clicks`,
        `visit_verifications`, and `distinct_visitors` are omitted unless the bearer
        user has both the `arcade_owner` tag and the arcade ID in `owns`, or has the
        `developer` or `moderator` tag. The `createdBy` relation alone is insufficient.
      security:
        - nativeBearer: []
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Public-safe or privileged cumulative analytics response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadeAnalyticsResponse'}
        '400':
          description: Missing arcade id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist, is private, or is closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/arcade/analytics/event:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/analytics/event. Responses are no-store.
    post:
      security:
        - nativeBearer: []
      tags: [Arcade Mutations]
      summary: /arcade/analytics/event
      description: |
        Records an anonymous direction-click analytics event. The request body is limited to
        2 KiB and accepts at most ten distinct game-series IDs. To limit anonymous metric
        manipulation, each client IP may record at most 20 events per rolling 10 minutes and
        may record an event for the same arcade only once every 30 seconds. Once the arcade is
        validated, rejected series IDs also consume this quota before their database lookup. The server does
        not persist the client IP, user agent, or identity; limits are process-local and retain
        no more than 4,096 active clients.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArcadeAnalyticsEventRequest'}
      responses:
        '200':
          description: Analytics event recorded.
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: {type: boolean, const: true}
        '400':
          description: Invalid event body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '413':
          description: Analytics event body exceeds 2 KiB.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Anonymous client exceeded the per-arcade cooldown or rolling event limit. The `Retry-After` header is included.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
              description: Seconds until this anonymous client may retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Arcade does not exist or is private.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Analytics event persistence failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/arcade/photo/atoms:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/photo/atoms. Responses are no-store.
    get:
      tags: [Arcade Mutations]
      summary: /arcade/photo/atoms
      description: Lists photo atoms through the custom API. Use each `file_url` for file delivery. Public arcades are available to active contributors; private drafts require creator or developer/moderator access.
      security:
        - nativeBearer: []
      parameters:
        - name: arcade
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Photo atom list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArcadePhotoAtomListResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '404':
          description: Arcade does not exist or private draft is inaccessible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/arcade/photo/file:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/photo/file. Responses are no-store.
    get:
      security:
        - nativeBearer: []
      tags: [Arcades]
      summary: /arcade/photo/file
      description: Streams one photo through the custom API. A published photo of a public arcade is anonymous-readable and privately browser-cacheable for five minutes. Pending or draft photos require a bearer token with atom-list access and are never cached. Clients must use the returned `file_url`, not PocketBase `/api/files` URLs. Supported thumbnail queries return the configured derivative and never silently fall back to the original file.
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
        - name: thumb
          in: query
          required: false
          schema: {type: string, enum: [96x96, 384x384, 680x0]}
          description: Returns a configured square crop or a 680px-wide aspect-preserving thumbnail.
      responses:
        '200':
          description: Photo bytes.
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '400':
          description: Missing photo atom id or unsupported thumbnail size.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Photo atom does not exist or is inaccessible.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/arcade/photo/atom:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/photo/atom. Responses are no-store.
    delete:
      tags: [Arcade Mutations]
      summary: /arcade/photo/atom
      description: Deletes a pending photo atom only for its uploader or developer/moderator. Published atoms are immutable and return `409`.
      security:
        - nativeBearer: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Pending atom deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: {type: string}
                  deleted: {type: boolean}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '403':
          description: Atom is not owned by the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Published atoms cannot be deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /native/arcade/photo/upload:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/photo/upload. Responses are no-store.
    post:
      tags: [Arcade Mutations]
      summary: /arcade/photo/upload
      description: Uploads pending photo atoms. Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arcade, photos]
              properties:
                arcade:
                  type: string
                captured_at:
                  type: string
                  description: Optional JSON string array matching photos by index. Entries are DateTimeOriginal as YYYY-MM-DDTHH:mm:ss with optional UTC offset, or empty. Offsetless dates use venue timezone (UTC if absent). Invalid/future entries are ignored; malformed arrays or count mismatches return 400.
                photos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: All files uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadePhotoUploadResponse'
              example:
                arcade: arcade_123
                summary:
                  total: 2
                  success: 2
                  failed: 0
                uploaded:
                  - index: 0
                    atomId: atom_1
                    filename: ok.png
                  - index: 1
                    atomId: atom_2
                    filename: ok2.jpg
                failed: []
                xp_feedback:
                  previous_exp: 0
                  new_exp: 5
                  diff_exp: 5
                  previous_percent_to_next_level: 0
                  new_percent_to_next_level: 25
                  previous_level: 0
                  new_level: 1
                  level_diff: 1
                  remaining_exp_to_next_level: 3
                  remaining_percent_to_next_level: 75
        '207':
          description: Partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadePhotoUploadResponse'
              example:
                arcade: arcade_123
                summary:
                  total: 2
                  success: 1
                  failed: 1
                uploaded:
                  - index: 0
                    atomId: atom_1
                    filename: ok.png
                failed:
                  - index: 1
                    filename: bad.gif
                    reason: unsupported mime type - image/gif
                xp_feedback:
                  previous_exp: 0
                  new_exp: 5
                  diff_exp: 5
                  previous_percent_to_next_level: 0
                  new_percent_to_next_level: 25
                  previous_level: 0
                  new_level: 1
                  level_diff: 1
                  remaining_exp_to_next_level: 3
                  remaining_percent_to_next_level: 75
        '400':
          description: Invalid multipart body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '404':
          description: Arcade not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: All files failed validation or persistence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadePhotoUploadResponse'
              example:
                arcade: arcade_123
                summary:
                  total: 2
                  success: 0
                  failed: 2
                uploaded: []
                failed:
                  - index: 0
                    filename: bad1.gif
                    reason: unsupported mime type - image/gif
                  - index: 1
                    filename: bad2.gif
                    reason: unsupported mime type - image/gif
                xp_feedback:
                  previous_exp: 0
                  new_exp: 0
                  diff_exp: 0
                  previous_percent_to_next_level: 0
                  new_percent_to_next_level: 0
                  previous_level: 0
                  new_level: 0
                  level_diff: 0
                  remaining_exp_to_next_level: 4
                  remaining_percent_to_next_level: 100

  /native/arcade/photo:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/photo. Responses are no-store.
    put:
      tags: [Arcade Mutations]
      summary: /arcade/photo
      description: Pending atoms receive 4 XP each for campaign targets (double the normal 2 XP) when first published, up to 20 XP per campaign target or 10 XP per other public arcade in a rolling seven-day window. Uploading alone, reordering, removing, or reusing a previously published atom awards no XP. Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArcadePhotoRequest'
            example:
              arcade: arcade_123
              photos: [atom_1, atom_2]
      responses:
        '200':
          description: "Photo relation updated. XP is awarded only when pending atoms are first published: 4 XP per atom for campaign targets (double the normal 2 XP), up to 20 XP per campaign target or 10 XP per other public arcade in a rolling seven-day window. Uploading alone, reordering, removing, or reusing a published atom awards no XP."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateArcadePhotoResponse'
              example:
                arcade: arcade_123
                photo: photo_molecule_123
                count: 2
                xp_feedback:
                  previous_exp: 0
                  new_exp: 2
                  diff_exp: 2
                  previous_percent_to_next_level: 0
                  new_percent_to_next_level: 50
                  previous_level: 0
                  new_level: 0
                  level_diff: 0
                  remaining_exp_to_next_level: 2
                  remaining_percent_to_next_level: 50
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/arcade/flag:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/flag. Responses are no-store.
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag
      description: Private drafts require the creator or a developer/moderator. Public arcades have no editor level threshold. Accepts at most 3 images, 15000000 bytes each, within a 46048576-byte encoded request body.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArcadeFlagRequest'
          multipart/form-data:
            schema:
              type: object
              required: [arcade, game_id, disruption, message]
              properties:
                arcade:
                  type: string
                game_id:
                  type: string
                disruption:
                  type: string
                  enum: [unplayable, major, bearable, minor]
                message:
                  type: string
                photos:
                  type: array
                  maxItems: 3
                  description: Images only; at most 15000000 bytes per file. Server verifies contents.
                  items:
                    type: string
                    format: binary
      responses:
        '409':
          description: Arcade uses external reporting. The response code is REPORT_EXTERNAL; no mutation or XP is committed.
        '200':
          description: Flag created and linked to the durable game entry.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, game_id, flag, game, xp_feedback]
                properties:
                  arcade:
                    type: string
                  game_id:
                    type: string
                  flag:
                    type: string
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413': {description: File or encoded request body exceeds its limit.}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '502':
          description: Transaction failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/arcade/flag/delete:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/flag/delete. Responses are no-store.
    post:
      tags: [Arcade Mutations]
      summary: /arcade/flag/delete
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagActionRequest'
      responses:
        '200':
          description: Flag deleted.
          content:
            application/json:
              schema:
                type: object
                required: [flag, deleted, game, xp_feedback]
                properties:
                  flag:
                    type: string
                  deleted:
                    type: boolean
                  game:
                    $ref: '#/components/schemas/ArcadeGameExpanded'
                  xp_feedback:
                    $ref: '#/components/schemas/XpFeedback'
        '400':
          description: Invalid body or delete rule failure.
          content:
            application/json:
              schema:
