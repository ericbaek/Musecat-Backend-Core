  /developer/v1/account/arcades/nearby:
    get:
      tags:
      - Connected account
      summary: "/arcades/nearby"
      parameters:
      - name: game_filter
        in: query
        description: |
          Repeat this parameter once per selected game series with a
          URL-encoded JSON object such as
          `{"series":"sdvx","cabinet":"valkyrie"}`. Omitting
          `cabinet` means all cabinets for that series. Separate objects
          use AND semantics across series. For example, maimai without a
          cabinet and SDVX with `"valkyrie"` requires both series while
          leaving maimai's cabinet unrestricted. `game_filter` cannot be combined
          with the legacy `game_series` or `game_cabinet` parameters.
        schema:
          type: array
          items:
            type: string
      - name: game_series
        in: query
        description: |
          Repeat the query parameter or pass comma-separated `game_series` ids.
          With no `game_cabinet`, every listed series is required and cabinet
          identity is ignored, including unverified cabinet revisions. When
          `game_cabinet` is present, order is significant: each series is paired
          positionally with the cabinet at the same index and every pair is required.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: game_cabinet
        in: query
        description: |
          Repeat the query parameter or pass comma-separated canonical
          `game_cabinet` ids. Cabinet filtering requires `game_series`, the
          two expanded lists must have equal lengths, and values are paired
          positionally. Each `(game_series, game_cabinet)` pair must match the
          same revision in the arcade's currently selected game state; all
          requested pairs use AND semantics. A cabinet-only request is invalid.
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: lat
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: lon
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: address
        in: query
        schema:
          type: string
        description: Normalized address keyword filter.
      - name: country
        in: query
        schema:
          type: string
        description: Optional ISO country-code filter.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: distance_limit
        in: query
        description: Optional maximum distance in kilometers from the supplied location.
        schema:
          type: number
          format: double
          minimum: 0
      - name: expand
        in: query
        description: |
          When true, expands each item's `game` payload with arcade game details,
          including each revision's cabinet. When game filters are supplied,
          expanded items contain only revisions matching the requested series
          and, when supplied, its selected cabinet. Separate grouped series
          remain required. Legacy positional series/cabinet pairs retain
          their compatibility behavior.
        schema:
          type: boolean
      responses:
        '200':
          description: Distance-sorted paginated nearby results. The response also
            marks campaign-target arcades and includes campaigns that have pending
            targets in the current page.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArcadesNearbyResponse"
              example:
                page: 1
                per_page: 15
                last_page: 1
                total: 1
                country_totals:
                  AU:
                    total: 1
                    nearest_arcade:
                      id: arcade_123
                      distance_km: 0.4
                items:
                - id: arcade_123
                  country: AU
                  name: Sydney Arcade
                  address: 123 George St, Sydney NSW
                  location:
                    lat: -33.8708
                    lon: 151.2062
                  game_series:
                  - series_1
                  game:
                    id: game_123
                    state_id: game_123
                    items:
                    - id: atom_1
                      updated: '2026-04-10 09:00:00.000Z'
                      version:
                        id: version_1
                        series: series_1
                        released_on: 2025-01-01
                        en: Sydney Version
                        kr: Sydney Version
                        jp: Sydney Version
                        price_default:
                      series:
                        id: series_1
                        seriesNumber: 1
                        en: Sydney Series
                        kr: Sydney Series
                        jp: Sydney Series
                        en_short: Sydney
                        kr_short: Sydney
                        jp_short: Sydney
                        manufacturer:
                      cabinet:
                        id: cabinet_gold
                        en: CHUNITHM GOLD
                        kr: 츄니즘 골드
                        jp: チュウニズム ゴールド
                      location: 1F
                      quantity: 1
                      price: {}
                      tag: []
                      flags: []
                  distance_km: 0.4
                campaigns: []
        '400':
          description: |
            Invalid or missing location/page value; an invalid grouped
            `game_filter`; mixed grouped and legacy game parameters; a
            `game_cabinet` without `game_series`; or unequal expanded
            `game_series` and `game_cabinet` list lengths.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Failed to load arcades.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
      description: Requires account:access. Same payload, response and domain checks
        as GET /arcades/nearby. Management operations are excluded even for staff.
  /developer/v1/account/arcades/updates:
    get:
      tags:
      - Connected account
      summary: Fixed public dashboard summary
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /arcades/updates. Management operations are excluded even for staff.

        Returns at most six latest blocks from distinct public open arcades. If a non-KR arcade has history, at least one is included, replacing the sixth KR entry when necessary. Results remain newest first. Query parameters, including page and limit, are rejected.
      responses:
        '200':
          description: Fixed summary array.
          content:
            application/json:
              schema:
                type: array
                maxItems: 6
                items:
                  "$ref": "#/components/schemas/ArcadeUpdateSummary"
        '400':
          description: Query parameters are not supported.
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
  /developer/v1/account/arcades/updates/history:
    get:
      tags:
      - Connected account
      summary: Authenticated recent change history
      security:
      - delegatedOAuth:
        - account:access
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /arcades/updates/history. Management operations are excluded even for staff.

        Historical public open arcade activity, excluding passport verifications before block grouping and pagination. Requires a user session.
      parameters:
      - "$ref": "#/components/parameters/LimitQuery"
      - "$ref": "#/components/parameters/CountryQuery"
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      responses:
        '200':
          description: Historical block pagination envelope.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - per_page
                - last_page
                - total
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ArcadeUpdateSummary"
                  page:
                    type: integer
                  per_page:
                    type: integer
                  last_page:
                    type: integer
                  total:
                    type: integer
        '400':
          description: Invalid limit or page.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '502':
          description: Failed to build update list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Insufficient scope or existing user/domain restrictions.
  /developer/v1/account/campaign:
    get:
      tags:
      - Connected account
      summary: "/campaign"
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /campaign. Management operations are excluded even for staff.

        Returns the active campaign detail for the requested id. The response
        separates current old-version targets from current to-version targets,
        so the updated list includes machines already on the target version
        even when they were not updated through this campaign. It includes
        newest-first report logs with the user, arcade, game, reaction,
        location-verification status, and report time, plus the latest
        still_old report. Updated targets can be reverted by a new still_old
        report for seven days after the update. Only currently public/open
        arcades are included.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign progress, updated targets, and report log.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CampaignDetailResponse"
        '400':
          description: Missing campaign id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Campaign is not active or was not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Campaign detail could not be loaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
  /developer/v1/account/campaign/photo:
    get:
      tags:
      - Connected account
      summary: Photo update campaign targets
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /campaign/photo. Management operations are excluded even for staff.

        Returns public/open arcades whose current photo gallery has no public
        photo or whose newest public photo is at least one year old. The
        result is computed from the current `arcade.photo` molecule and is
        paginated like the public arcade list. Missing-photo targets are listed
        first, followed by stale targets from oldest to newest.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: lat
        in: query
        description: Optional latitude for distance ordering; must be supplied with
          lon.
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lon
        in: query
        description: Optional longitude for distance ordering; must be supplied with
          lat.
        schema:
          type: number
          minimum: -180
          maximum: 180
      responses:
        '200':
          description: Current automatic photo campaign targets.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotoCampaignListResponse"
        '400':
          description: Invalid pagination.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Photo campaign targets could not be loaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Insufficient scope or existing user/domain restrictions.
      security:
      - delegatedOAuth:
        - account:access
  /developer/v1/account/campaigns:
    get:
      tags:
      - Connected account
      summary: List active update campaigns
      description: |-
        Requires account:access. Same payload, response and domain checks as GET /campaigns. Management operations are excluded even for staff.

        Returns at most 20 campaigns that are active at request time, newest start first. Target counts include pending and already-updated public/open targets.
      responses:
