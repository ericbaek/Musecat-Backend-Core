  /user/passport:
    get:
      tags: [User]
      summary: Owner or shared passport
      description: Current public venues including closed ones. Omit user for authenticated owner. An explicit user ID allows anonymous summary/full access; private or withdrawn profiles return 404. Summary omits every visit date. Existing visibility settings take the new scope immediately. No shared caching or raw verification metadata.
      security: [{bearerAuth: []}, {}]
      parameters:
        - in: query
          name: user
          description: Target profile ID. Omit for the authenticated owner.
          schema: {type: string}
        - in: query
          name: year
          schema: {type: string, default: all, pattern: '^(all|[0-9]{4})$'}
      responses:
        '200':
          description: Passport result. Stable sort ties use arcade ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Passport'}
        '400': {description: Invalid filter or pagination.}
        '401': {description: Missing or invalid authentication.}
        '403': {description: Inactive account.}
        '404': {description: Private, missing or withdrawn target profile.}
        '502': {description: Failed to load passport.}
  /user/passport/stamps:
    get:
      tags: [User]
      summary: Owner or shared passport
      description: Current public venues including closed ones. Omit user for authenticated owner. An explicit user ID allows anonymous summary/full access; private or withdrawn profiles return 404. Summary omits every visit date. Existing visibility settings take the new scope immediately. No shared caching or raw verification metadata.
      security: [{bearerAuth: []}, {}]
      parameters:
        - in: query
          name: user
          description: Target profile ID. Omit for the authenticated owner.
          schema: {type: string}
        - in: query
          name: year
          schema: {type: string, default: all, pattern: '^(all|[0-9]{4})$'}
        - in: query
          name: country
          schema: {type: string, pattern: "^[A-Z]{2}$"}
        - in: query
          name: city
          schema: {type: string}
        - in: query
          name: sort
          schema: {type: string, enum: [recent, first, visits], default: recent}
        - in: query
          name: page
