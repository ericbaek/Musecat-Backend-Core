  /developer/v1/arcade/flag:
    post:
      tags:
      - Delegated resources
      summary: POST /developer/v1/arcade/flag
      description: Delegated access requires arcade:report:create. Existing domain visibility,
        role, ownership, location and XP rules still apply. Private drafts require the
        creator or a developer/moderator. Public arcades have no editor level threshold.
        Accepts at most 3 images, 15000000 bytes each, within a 46048576-byte encoded
        request body.
      security:
      - delegatedOAuth:
        - arcade:report:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateArcadeFlagRequest"
