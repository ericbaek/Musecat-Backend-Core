              schema: {$ref: '#/components/schemas/SupporterReviewDetail'}
        '401': {description: Authentication required}
        '403': {description: Active developer or moderator required}
        '404': {description: Application or applicant not found}
    put:
      tags: [Support]
      summary: Approve or reject a pending supporter application
      description: Approval atomically appends founding_supporter to user.tags without removing existing tags. Rejection does not change tags. Already decided applications return 409.
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
