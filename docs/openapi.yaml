                    type: string
                  changed:
                    type: boolean
                  memo:
                    "$ref": "#/components/schemas/ArcadeMemo"
        '400':
          description: Invalid arcade id or Tiptap document.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired or revoked delegated token; Musecat session
            JWTs are not accepted here.
        '403':
          description: Authenticated arcade write access is required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
