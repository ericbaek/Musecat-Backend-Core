          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/catalog:
    get:
      tags: [Arcades]
      summary: Localized game/version/cabinet catalog
      description: Omits historical version aliases (non-empty alias_of) while retaining their records for historical game reads. Returns only explicitly supported cabinets for each version and distinct cabinets for each series. Cabinet arrays are ordered by the earliest release date among active compatible versions, newest first; undated cabinets follow, then name and ID break ties. An unverified cabinet is represented by `null` only in arcade game entries and mutations, never as a catalog item.
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [en-US, ko-KR, ja-JP]
      responses:
        '200':
          description: Localized game catalog with cabinet-specific price defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalog'
        '400':
          description: Missing or unsupported locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to load the catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game_series_version:
    get:
      tags: [Arcades]
