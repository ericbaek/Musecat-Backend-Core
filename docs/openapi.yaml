            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SupporterReviewRequest'}
        '401': {description: Authentication required}
        '403': {description: Active developer or moderator required}
  /moderation/supporter/request:
    get:
      tags: [Support]
      summary: Read applicant contribution counts and XP ledger (strict reviewer only)
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Application, joined date, current XP ledger and all authored arcade changes grouped by arcade
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupporterReviewDetail'}
        '401': {description: Authentication required}
        '403': {description: Active developer or moderator required}
        '404': {description: Application or applicant not found}
    put:
      tags: [Support]
      summary: Approve or reject a pending supporter application
      description: Approval atomically appends founding_supporter to user.tags without removing existing tags. Rejection does not change tags. Already decided applications return 409.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
