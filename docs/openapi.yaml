              - game_id
              - disruption
              - message
              properties:
                arcade:
                  type: string
                game_id:
                  type: string
                disruption:
                  type: string
                  enum:
                  - unplayable
                  - major
                  - bearable
                  - minor
                message:
                  type: string
                photos:
                  type: array
                  maxItems: 3
                  description: Images only; at most 15000000 bytes per file. Server
                    verifies contents.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Flag created and linked to the durable game entry.
