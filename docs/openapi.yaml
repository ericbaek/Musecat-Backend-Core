              example:
                arcade: arcade_123
                summary:
                  total: 2
                  success: 0
                  failed: 2
                uploaded: []
                failed:
                  - index: 0
                    filename: bad1.gif
                    reason: unsupported mime type - image/gif
                  - index: 1
                    filename: bad2.gif
                    reason: unsupported mime type - image/gif
                xp_feedback:
                  previous_exp: 0
                  new_exp: 0
                  diff_exp: 0
                  previous_percent_to_next_level: 0
                  new_percent_to_next_level: 0
                  previous_level: 0
                  new_level: 0
                  level_diff: 0
                  remaining_exp_to_next_level: 4
                  remaining_percent_to_next_level: 100
  /arcade/photo:
    put:
      tags: [Arcade Mutations]
      summary: /arcade/photo
      description: Pending atoms receive 4 XP each for campaign targets (double the normal 2 XP) when first published, up to 20 XP per campaign target or 10 XP per other public arcade in a rolling seven-day window. Uploading alone, reordering, removing, or reusing a previously published atom awards no XP. Private drafts require the creator or a developer/moderator; public arcades have no editor level threshold.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
