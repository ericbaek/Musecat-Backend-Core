                reason: {type: string, maxLength: 1200}
      responses:
        '200':
          description: Saved decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupporterReviewRequest'}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Active developer or moderator required}
        '404': {description: Application not found}
        '409': {description: Already reviewed or applicant withdrawn or missing}
        '502': {description: Save failed; application and tags are both unchanged}
  /moderation/arcade/requests:
    get:
      tags: [Support]
