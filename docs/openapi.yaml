  /user/conversations/{id}/messages:
    get:
      tags: ["Messaging"]
      summary: "Read chronological history or sequence delta"
      description: "Exactly one cursor direction. Without a cursor returns latest messages. before pages allow up to 100; after pages up to 200. Explicit afterSequence=0 starts from sequence one. Follow non-null nextBeforeSequence/nextAfterSequence until null. No durable SSE replay is implied."
