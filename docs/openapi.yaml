          description: Required for password accounts and all official arcade accounts. For official arcade accounts, the exact password including whitespace must match.
        reason:
          type: string
    ArcadeSummaryPage:
      type: object
      required: [page, per_page, last_page, total, items]
      properties:
        page: {type: integer}
        per_page: {type: integer}
        last_page: {type: integer}
        total: {type: integer}
