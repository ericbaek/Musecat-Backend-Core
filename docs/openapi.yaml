        '401': {description: Authentication required.}
        '403': {description: Active account required.}
        '404': {description: Own device registration not found.}
        '410': {description: Expired device registration removed.}
        '413': {description: Request exceeds 4 KiB.}
        '502': {description: Push provider rejected the request.}
        '503': {description: VAPID delivery is not configured.}
