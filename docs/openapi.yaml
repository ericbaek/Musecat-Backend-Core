openapi: 3.1.0
info:
  title: Musecat Backend API
  version: 2.0.0
  summary: API v2 wire contract for frontend-facing Musecat endpoints.
  description: |
    API v2 is a breaking cutover: frontend integrations use documented custom endpoints,
    not PocketBase collection REST. See `docs/architecture-contract.md` for authorization,
    state-transition, and migration rules.
servers:
  - url: http://localhost:8090
    description: Local development server
tags:
  - name: Developer Center
    description: Self-service partner application registration and operator approval.
  - name: Meta
    description: Service metadata and helper endpoints.
  - name: Geo
    description: Country, timezone, and geocoding helper endpoints.
  - name: Search
    description: Public lookup endpoints for unified search.
  - name: Arcades
    description: Public arcade read endpoints.
  - name: Moderator
    description: Moderator-facing arcade and content review endpoints.
  - name: Support
    description: Supporter XP and request endpoints.
  - name: Users
    description: Public and authenticated user profile endpoints.
  - name: Community
    description: Community posts and delayed cached translations.
  - name: Arcade Mutations
    description: Authenticated arcade editing endpoints.
components:
  securitySchemes:
    partnerBearer: {type: http, scheme: bearer, description: Musecat-issued server key; distinct from OAuth tokens and secrets.}
    delegatedOAuth:
      type: oauth2
      description: Musecat-issued opaque delegation tokens. Session JWTs are never accepted
        on developer resources. Use server metadata for deployed endpoint URLs.
      flows:
        authorizationCode:
          authorizationUrl: "/oauth/authorize"
          tokenUrl: "/oauth/token"
          refreshUrl: "/oauth/token"
          scopes:
            openid: Sign in with Musecat (opt-in application)
            profile: Read basic OpenID profile
            account:access: General user features on behalf of the account; management and account-security operations excluded
            profile:read: Read your basic profile
            arcade:read: Read public arcade information
            arcade:report:create: Create fault reports
            arcade:report:react: React to fault reports
            campaign:read: Read campaigns
            campaign:respond: Submit campaign responses
    oauthClientBasic:
      type: http
      scheme: basic
      description: Registered confidential OAuth client credentials; never a user password.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PartnerRequestId: {name: X-Request-Id, in: header, required: true, schema: {type: string, format: uuid}, description: Replays return the original result for ten minutes; changed requests with the same ID conflict.}
    LimitQuery:
      name: limit
      in: query
      description: Positive integer limit. Endpoint-specific caps apply.
      schema:
        type: integer
        minimum: 1
    CountryQuery:
      name: country
      in: query
      description: Country code stored in `arcade.country`.
      schema:
        type: string
    UserIdQuery:
      name: id
      in: query
      description: Target record id.
      schema:
        type: string
    UsernameQuery:
      name: username
      in: query
      description: Target username.
      schema:
        type: string
  schemas:
    Announcement:
      type: object
      required: [id, status, createdAt, updatedAt, publishedAt, viewed, localizations, locales]
      properties:
        id: {type: string}
        status: {type: string, enum: [draft, published, archived]}
        locales:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [ko, en, ja]}
          description: Immutable selected release locales; empty for drafts.
        createdAt: {type: string}
        updatedAt: {type: string}
        publishedAt: {type: string, description: Empty until first publication.}
        viewed: {type: boolean, description: Account-wide across locales and devices; false for guests.}
        localizations:
          type: object
          additionalProperties: false
          properties:
            ko: {$ref: '#/components/schemas/AnnouncementLocalization'}
            en: {$ref: '#/components/schemas/AnnouncementLocalization'}
            ja: {$ref: '#/components/schemas/AnnouncementLocalization'}
    AnnouncementLocalization:
      type: object
      required: [title, summary, slides]
      properties:
        title: {type: string, maxLength: 160}
        summary: {type: string, maxLength: 500}
        slides:
          type: array
          maxItems: 12
          items:
            type: object
            required: [id, fileName, imageUrl, alt]
            properties:
              id: {type: string}
              fileName: {type: string}
              imageUrl: {type: string, description: Relative custom API image URL; draft and archived images require staff.}
              alt: {type: string, maxLength: 3000}
    AnnouncementPage:
      type: object
      required: [items, next]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Announcement'}}
        next: {type: string, description: Last item id or empty at end.}
    AnnouncementInput:
      type: object
      required: [localizations]
      properties:
        localizations:
          type: object
          description: Complete replacement map; only ko, en and ja keys. Drafts may omit locales. Existing file names retain images; upload:N references index N in images_LOCALE.
          additionalProperties:
            type: object
            required: [title, summary, slides]
            properties:
              title: {type: string, maxLength: 160}
              summary: {type: string, maxLength: 500}
              slides:
                type: array
                maxItems: 12
                items:
                  type: object
                  required: [image, alt]
                  properties:
                    image: {type: string}
                    alt: {type: string, maxLength: 3000}
    MessagingReport: {"type": "object", "properties": {"id": {"type": "string"}, "reporterId": {"type": "string"}, "messageId": {"type": "string"}, "reason": {"type": "string"}, "createdAt": {"type": "string"}, "message": {"$ref": "#/components/schemas/MessagingMessage"}}, "required": ["id", "reporterId", "messageId", "reason", "createdAt", "message"]}
    MessagingParty: {"type": "object", "properties": {"type": {"type": "string", "enum": ["user", "arcade", "team"]}, "id": {"type": "string"}, "name": {"type": "string"}, "avatarUrl": {"type": "string", "nullable": true}, "roleTags": {"type": "array", "items": {"type": "string"}}}, "required": ["type", "id", "name", "avatarUrl", "roleTags"]}
    MessagingIdentity: {"type": "object", "properties": {"type": {"type": "string", "enum": ["user", "arcade", "team"]}, "id": {"type": "string"}}, "required": ["type", "id"]}
    MessagingMessage: {"type": "object", "properties": {"id": {"type": "string"}, "conversationId": {"type": "string"}, "sequence": {"type": "integer", "minimum": 0}, "senderUserId": {"type": "string"}, "sender": {"$ref": "#/components/schemas/MessagingParty"}, "actingAs": {"$ref": "#/components/schemas/MessagingParty"}, "clientMessageId": {"type": "string"}, "text": {"type": "string"}, "photos": {"type": "array", "maxItems": 3, "items": {"type": "object", "properties": {"name": {"type": "string"}, "url": {"type": "string"}}, "required": ["name", "url"]}}, "createdAt": {"type": "string"}, "mentions": {"type": "array", "maxItems": 1, "items": {"type": "string", "enum": ["musecat"]}, "description": "Explicit MUSECAT notification mention. Only arcade inquiries support nonempty mentions; duplicates normalize to one. Omitted input becomes an empty array."}}, "required": ["id", "conversationId", "sequence", "senderUserId", "sender", "actingAs", "clientMessageId", "text", "photos", "createdAt", "mentions"]}
    ConversationSummary: {"type": "object", "properties": {"id": {"type": "string"}, "kind": {"type": "string", "enum": ["dm", "inquiry"]}, "counterpart": {"$ref": "#/components/schemas/MessagingParty"}, "inbox": {"allOf": [{"$ref": "#/components/schemas/MessagingParty"}], "nullable": true}, "requester": {"allOf": [{"$ref": "#/components/schemas/MessagingParty"}], "nullable": true}, "status": {"type": "string", "nullable": true, "enum": ["waiting", "recognised", "solved", null]}, "legacyFeedbackId": {"type": "string", "nullable": true}, "latestSequence": {"type": "integer", "minimum": 0}, "lastMessage": {"allOf": [{"$ref": "#/components/schemas/MessagingMessage"}], "nullable": true}, "lastMessageAt": {"type": "string", "nullable": true}, "unreadCount": {"type": "integer", "minimum": 0}, "lastReadSequence": {"type": "integer", "minimum": 0}, "canSend": {"type": "boolean"}, "canManageStatus": {"type": "boolean", "description": "Compatibility capability, true when allowedStatusTransitions is nonempty."}, "createdAt": {"type": "string"}, "allowedSenderIdentities": {"type": "array", "items": {"$ref": "#/components/schemas/MessagingIdentity"}, "description": "Current permitted acting identities. Dual-role inquiry users explicitly choose one."}, "allowedStatusTransitions": {"type": "array", "items": {"type": "string", "enum": ["waiting", "recognised", "solved"]}, "description": "Current permitted status values: requester waiting/solved; responders all three; DM empty."}}, "required": ["allowedSenderIdentities", "allowedStatusTransitions"]}
    MessagingSend: {"type": "object", "properties": {"text": {"type": "string", "maxLength": 4000}, "clientMessageId": {"type": "string", "minLength": 1, "maxLength": 100}, "actingAs": {"$ref": "#/components/schemas/MessagingIdentity"}, "mentions": {"type": "array", "maxItems": 16, "items": {"type": "string", "enum": ["musecat"]}, "description": "Explicit MUSECAT notification mention. Only arcade inquiries support nonempty mentions; duplicates normalize to one. Omitted input becomes an empty array."}}, "required": ["clientMessageId"]}
    MessagingCreate: {"type": "object", "properties": {"kind": {"type": "string", "enum": ["dm", "inquiry"]}, "peerUserId": {"type": "string"}, "inbox": {"$ref": "#/components/schemas/MessagingIdentity"}, "initialMessage": {"$ref": "#/components/schemas/MessagingSend"}}, "required": ["kind"]}
    ConversationList: {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/ConversationSummary"}}, "nextCursor": {"type": "string", "nullable": true}}, "required": ["items", "nextCursor"]}
    MessagePage: {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/MessagingMessage"}}, "latestSequence": {"type": "integer", "minimum": 0}, "nextBeforeSequence": {"type": "integer", "nullable": true}, "nextAfterSequence": {"type": "integer", "nullable": true}}, "required": ["items", "latestSequence", "nextBeforeSequence", "nextAfterSequence"]}
    InquirySettings:
      type: object
      required: [mode, contactType, contactValue, guide, loginRequired, configured]
      properties:
        mode: {type: string, enum: [internal, external, disabled], default: disabled}
        contactType: {type: string}
        contactValue: {type: string, maxLength: 2048}
        guide: {type: string, maxLength: 2000}
        loginRequired: {type: boolean, default: false}
        configured: {type: boolean, readOnly: true, description: Derived from a persisted valid mode; false for missing or invalid configuration.}

    ArcadeReportSettings:
      type: object
      required: [mode, contactType, contactValue, guide]
      properties:
        mode: {type: string, enum: [internal, external]}
        contactType: {type: string, enum: ['', url, phone]}
        contactValue: {type: string, maxLength: 2048}
        guide: {type: string, maxLength: 2000}
      description: Internal is the default. External requires a valid HTTP(S) URL without credentials or a phone number. Existing reports are hidden, not deleted. String limits count Unicode code points; settings storage accommodates UTF-8 and JSON escaping.
    ReportPushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: {type: string, format: uri, maxLength: 2048}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string, description: Base64url encoded uncompressed P-256 public key.}
            auth: {type: string, description: Base64url encoded 16-byte auth secret.}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string
        code:
          type: string
    AccountBannedResponse:
      type: object
      required: [error, code, reason, until, permanent]
      properties:
        error:
          type: string
          enum: [account banned]
        code:
          type: string
          enum: [ACCOUNT_BANNED]
        reason:
          type: string
        until:
          type: string
          description: Empty for a permanent restriction; otherwise a UTC date-time.
        permanent:
          type: boolean
    CommunityPostInput:
      type: object
      required: [body]
      properties:
        title:
          type: string
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 10000
        flair:
          type: string
          enum: [achievement, question, tip, news, event, art, chitchat]
          default: chitchat
        photos:
          type: array
          maxItems: 8
          items: {type: string, format: binary}
          description: Multipart only; each JPEG/PNG/WebP/GIF is at most 10485760 bytes. Achievement posts require at least one photo; updates count retained photos.
        game_series:
          type: string
          description: Optional canonical game_series id.
    CommunityPost:
      type: object
      required: [id, photos, author, game_series, title, body, flair, locale, requested_locale, source_locale, translated, translation_status, editable_until, created, updated]
      properties:
        id: {type: string}
        author: {type: string}
        author_name: {type: string, description: Public nickname or username.}
        author_avatar_url: {type: string}
        like_count: {type: integer, minimum: 0}
        liked: {type: boolean}
        comment_count: {type: integer, minimum: 0, description: Active comments and replies.}
        game_series: {type: string}
        photos: {type: array, items: {type: string}, maxItems: 8, description: Ordered stored filenames.}
        title: {type: string}
        body: {type: string}
        flair: {type: string, enum: [achievement, question, tip, news, event, art, chitchat]}
        locale: {type: string, enum: [ko-KR, en-US, ja-JP]}
        requested_locale: {type: string, enum: [ko-KR, en-US, ja-JP]}
        source_locale: {type: string, enum: [ko-KR]}
        translated:
          type: boolean
          description: True only when a cached translation is served.
        translation_status: {type: string, enum: [pending, processing, ready, failed]}
        editable_until: {type: string, format: date-time}
        translated_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: string, maxLength: 0}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    CommunityLike:
      type: object
      required: [like_count, liked]
      properties:
        like_count: {type: integer, minimum: 0}
        liked: {type: boolean}
    CommunityCommentInput:
      type: object
      required: [body]
      properties:
        post: {type: string, description: Required on creation.}
        parent: {type: string, description: Top-level comment id for a reply.}
        reply_to: {type: string, description: Active comment or reply in the same post.}
        body: {type: string, maxLength: 2000, description: Text or at least one new/retained photo is required.}
        photos: {type: array, maxItems: 3, items: {type: string, format: binary}, description: Multipart JPEG/PNG/WebP/GIF; at most 10 MiB each.}
        keep_photos: {type: array, maxItems: 3, items: {type: string}, description: Update-only retained filenames; omitted preserves existing photos.}
    CommunityComment:
      allOf:
        - {$ref: '#/components/schemas/CommunityLike'}
        - type: object
          properties:
            id: {type: string}
            post: {type: string}
            parent: {type: string}
            reply_to: {type: string}
            reply_to_name: {type: string}
            author: {type: string}
            author_name: {type: string}
            author_avatar_url: {type: string}
            body: {type: string}
            photos: {type: array, maxItems: 3, items: {type: string}}
            deleted: {type: boolean}
            created: {type: string, format: date-time}
            editable_until: {type: string, format: date-time}
            edited_at: {type: string, description: Empty until the body is edited.}
            locale: {type: string, enum: [ko-KR, en-US, ja-JP]}
            translated: {type: boolean}
            translation_status: {type: string, enum: [pending, processing, ready, failed]}
            reply_count: {type: integer, minimum: 0}
    CommunityCommentsPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CommunityComment'}}
        next_cursor: {type: string, description: Opaque older-page cursor; empty when exhausted.}
    CommunityPostList:
      type: object
      required: [page, per_page, last_page, total, items]
      properties:
        page: {type: integer}
        per_page: {type: integer}
        last_page: {type: integer}
        total: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: '#/components/schemas/CommunityPost'}
    PocketBaseAuthError:
      type: object
      required: [data, message, status]
      properties:
        data:
          type: object
          additionalProperties: true
        message:
          type: string
        status:
          type: integer
          example: 401
    Location:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    XpFeedback:
      type: object
      description: XP is awarded only when the authenticated user's account has a non-empty username. Before username setup, XP feedback reports no XP change.
      required:
        - previous_exp
        - new_exp
        - diff_exp
        - previous_percent_to_next_level
        - new_percent_to_next_level
        - previous_level
        - new_level
        - level_diff
        - remaining_exp_to_next_level
        - remaining_percent_to_next_level
      properties:
        previous_exp:
          type: integer
        new_exp:
          type: integer
        diff_exp:
          type: integer
        previous_percent_to_next_level:
          type: integer
          description: Progress percentage before the change. Use `100 - remaining_percent_to_next_level` semantics.
        new_percent_to_next_level:
          type: integer
          description: Progress percentage after the change. Use `100 - remaining_percent_to_next_level` semantics.
        previous_level:
          type: integer
        new_level:
          type: integer
        level_diff:
          type: integer
        remaining_exp_to_next_level:
          type: integer
        remaining_percent_to_next_level:
          type: integer
          description: Percent remaining to the next level. Use `100 - remaining_percent_to_next_level` for progress fill.
    ArcadePublicExpPreview:
      type: object
      required: [current_exp, public_exp, backfill_exp, estimated_exp, estimated_gain, xp_feedback]
      properties:
        current_exp:
          type: integer
          description: Creator's current XP before public conversion.
        public_exp:
          type: integer
          description: XP currently eligible from the public-conversion grant.
        backfill_exp:
          type: integer
          description: XP currently eligible from draft contributions and other backfilled grants. Draft arcade areas are backfilled once per arcade independently of the seven-day edit cooldown.
        estimated_exp:
          type: integer
          description: Estimated creator XP after a successful public conversion.
        estimated_gain:
          type: integer
          description: Estimated total XP increase. The PUT response is authoritative if the draft changes before conversion.
        xp_feedback:
          $ref: '#/components/schemas/XpFeedback'
    GeoLookupResponse:
      type: object
      required: [country, timezone]
      properties:
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code; missing-data sentinels such as -99 are never returned.
        timezone:
          type: string
    GeocodeCandidate:
      type: object
      required: [address, lat, lon]
      properties:
        address:
          type: string
        road_address:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        place_id:
          type: string
    GeocodeResponse:
      type: object
      required: [provider, query, results]
      properties:
        provider:
          type: string
          enum: [google, kakao, osm]
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/GeocodeCandidate'
    ReverseGeocodeResponse:
      type: object
      required: [provider, lat, lon, address, display_name]
      properties:
        provider:
          type: string
          enum: [google, kakao, osm]
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        address:
          type: string
        road_address:
          type: string
        display_name:
          type: string
        place_id:
          type: string
    StatsResponse:
      type: object
      required: [arcade_count, changelog_count, flag_count, flag_reaction_count, ongoing_flag_count, solved_flag_count, visit_count, page_view_count, page_views]
      properties:
        arcade_count:
          type: integer
          format: int64
        changelog_count:
          type: integer
          format: int64
        flag_count:
          type: integer
          format: int64
        flag_reaction_count: {type: integer, format: int64, description: Total reactions on public arcade fault reports.}
        ongoing_flag_count: {type: integer, format: int64}
        solved_flag_count: {type: integer, format: int64}
        visit_count: {type: integer, format: int64, description: Verified visits respecting deployment aggregate policy.}
        page_view_count: {type: integer, format: int64}
        page_views:
          type: array
          description: Daily UTC cumulative distinct page-view event groups since 2026-09-30, including zero-activity days through today. Public arcades only, including closed venues.
          items:
            type: object
            required: [date, count]
            properties:
              date: {type: string, format: date}
              count: {type: integer, format: int64}
    RankingProfile:
      type: object
      required: [id, nickname, username, avatar, primary_country, level, tags]
      properties:
        id: {type: string}
        nickname: {type: string}
        username: {type: string}
        avatar: {type: string}
        primary_country:
          type: string
          description: Primary profile country as an ISO 3166-1 alpha-2 code, or an empty string when unset.
        level: {type: integer}
        tags:
          type: array
          items: {type: string}
    RankingEntry:
      oneOf:
        - type: object
          required: [rank, score, profile]
          properties:
            rank: {type: integer}
            score: {type: integer, format: int64}
            profile: {$ref: '#/components/schemas/RankingProfile'}
            stats: {$ref: '#/components/schemas/RankingStats'}
        - type: object
          required: [rank, score, arcade]
          properties:
            rank: {type: integer}
            score: {type: integer, format: int64}
            arcade: {$ref: '#/components/schemas/RankingArcade'}
            stats: {$ref: '#/components/schemas/RankingArcadeStats'}
    RankingStats:
      type: object
      required: [travel_distance_km]
      properties:
        travel_distance_km: {type: integer, format: int64}
    RankingArcade:
      type: object
      required: [id, name, country]
      properties:
        id: {type: string}
        name: {type: string}
        country: {type: string}
        photo_url:
          type: string
          format: uri-reference
          description: First publicly readable photo in the arcade's current photo molecule. Omitted when unavailable.
    RankingArcadeStats:
      type: object
      required: [visit_count]
      properties:
        visit_count: {type: integer, format: int64}
    RankingResponse:
      type: object
      required: [metric, period, entries, viewer]
      properties:
        metric: {type: string, enum: [explorer, visits, xp, level, photographer, arcade_visits]}
        period: {type: string, enum: [week, month, half_year, year, all]}
        entries:
          type: array
          items: {$ref: '#/components/schemas/RankingEntry'}
        viewer:
          description: The authenticated user's own public leaderboard entry, or null when unauthenticated or not ranked.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RankingEntry'
    ArcadeVisitRankingEntry:
      type: object
      required: [rank, score, profile]
      properties:
        rank: {type: integer}
        score:
          type: integer
          format: int64
          description: XP earned for the selected metric. Total combines completed visit verifications and positive arcade edit grants; edit and passport each count their respective source only.
        profile: {$ref: '#/components/schemas/RankingProfile'}
    ArcadeVisitRankingResponse:
      type: object
      required: [arcade, metric, entries]
      properties:
        arcade: {type: string}
        metric: {type: string, enum: [total, edit, passport]}
        entries:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/ArcadeVisitRankingEntry'}
    SearchUserItem:
      type: object
      required: [username, nickname, avatar, primary_country, level]
      properties:
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
          description: Avatar filename only.
        primary_country:
          type: string
          description: Primary profile country as an ISO 3166-1 alpha-2 code, or an empty string when unset.
        level: {type: integer}
    SearchArcadeItem:
      type: object
      required: [id, country, name, address, nickname, closed]
      properties:
        id:
          type: string
        country:
          type: string
        name:
          type: string
        address:
          type: string
        nickname:
          type: array
          items:
            type: string
        closed:
          type: boolean
        distance_km:
          type: number
          format: double
          description: Distance from the supplied user location in kilometers.
    SearchResponse:
      type: object
      required: [users, arcades]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/SearchUserItem'
        arcades:
          type: array
          items:
            $ref: '#/components/schemas/SearchArcadeItem'
    ArcadeSummary:
      type: object
      required: [id, country, game_series, updated]
      properties:
        updated:
          type: string
          format: date-time
          description: Persisted arcade aggregate update time; cache rebuilds do not change it.
        id:
