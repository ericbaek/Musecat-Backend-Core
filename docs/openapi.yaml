          description: Saved settings with derived configured true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquirySettings'
        '400': {description: Invalid or missing external contact.}
        '401': {description: Authentication required.}
        '403': {description: Not an assigned official owner or strict staff.}
        '404': {description: Arcade not found.}

  /native/v1/arcades/{id}/contacts:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    get:
      tags: [Arcade Mutations]
      summary: Native v1 contacts edit snapshot
      security: [{nativeBearer: []}]
      description: Active native session and arcade write permission required. Empty revision denotes an absent section. Unknown optional members are tolerated; unsupported required capabilities block editing.
      responses:
        '200':
          description: Immutable edit snapshot; no-store.
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, required_capabilities, arcade, revision, items]
                properties:
                  contract_version: {type: integer, enum: [1]}
                  required_capabilities: {type: array, items: {type: string}, example: [contacts.delta.v1]}
                  arcade: {type: string}
                  revision: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, type, link, name]
                      properties:
                        id: {type: string, description: Atom ID in this immutable revision.}
                        type: {type: string}
                        link: {type: string}
                        name: {type: string}
        '401': {description: Native session required.}
        '403': {description: Account or arcade write access denied.}
        '404': {description: Arcade not found.}
        '500': {description: Section revision unavailable.}
    patch:
      tags: [Arcade Mutations]
      summary: Native v1 conditional contacts edit
      security: [{nativeBearer: []}]
      description: Maximum 4096 encoded bytes. Explicit add/update/remove operations; untouched items and unknown stored fields survive. IDs must belong to the base revision and may occur in only one operation. New/changed links use web type/host rules; a new item with a type outside the v1 enum is rejected with unsupported_contact_type. At least one operation is required. Revision is checked atomically; a successful save requires a fresh GET before the next edit. Every 400 uses the ErrorResponse envelope with a stable code in `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: {type: string, description: Must be present; empty only for first save.}
                add:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [type, link]
                    properties:
                      type: {type: string, enum: [phone, website, reservation, facebook, instagram, twitter, youtube, discord, kakaoopenchat, kakaochannel, threads]}
                      link: {type: string, minLength: 1}
                      name: {type: string}
                update:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, changes]
                    properties:
                      id: {type: string}
                      changes:
                        type: object
                        additionalProperties: false
                        minProperties: 1
                        properties:
                          link: {type: string, minLength: 1}
                          name: {type: string}
                remove: {type: array, uniqueItems: true, items: {type: string}}
      responses:
        '200':
          description: Saved atomically with the existing section history and XP policy.
          content:
            application/json:
              schema:
                type: object
                required: [arcade, revision, xp_feedback]
                properties:
                  arcade: {type: string}
                  revision: {type: string}
                  xp_feedback: {$ref: '#/components/schemas/XpFeedback'}
        '400':
          description: Invalid input or no effective changes. `error` is one of invalid_patch, revision_and_operations_required, invalid_contact_id, unsupported_field, invalid_contact_value, invalid_contact_link, unsupported_contact_type, no_changes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {description: Native session required.}
        '403': {description: Account or arcade write access denied.}
        '409': {description: Stale revision; preserve draft and explicitly reload.}
        '413': {description: Request exceeds 4096 encoded bytes.}
        '502':
          description: Aggregate load or persistence failure, including a base revision that does not belong to this arcade.
  /native/v1/arcades/{id}/hours:
    parameters:
