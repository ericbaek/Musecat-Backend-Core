          type: string
    FlagReactionRequest:
      type: object
      required: [flag, reaction, action]
      description: Use issue_persist before resolution voting starts, fixed to support a resolution, and wrong as the opposing vote during an active resolution round. The wrong reaction is not a user-facing invalid-report action.
      properties:
        flag:
          type: string
        reaction:
          type: string
          enum: [fixed, issue_persist, wrong]
        action:
          type: string
          enum: [add, delete]
    RollbackArcadeRequest:
      type: object
