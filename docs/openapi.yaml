              schema: {$ref: '#/components/schemas/ArcadeValueResponse'}
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '404':
          description: Arcade does not exist or is not accessible as a draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      tags: [Arcade Mutations]
      summary: /arcade/draft
      description: Deletes only the authenticated creator's private draft. Published arcade history is never deleted by this endpoint.
      security:
        - nativeBearer: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Draft deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: {type: string}
                  deleted: {type: boolean}
