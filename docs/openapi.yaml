        arcade:
          type: string
        part:
          type: string
          enum: [basic, hour, sns, gtk, game, photo, memo]
        value:
          type: string
        previous_value:
          type: string
        report:
          type: boolean
          description: When true, `changelog` and `report_message` are required and the rollback plus report are atomic.
        changelog:
          type: string
          description: Cited prior changelog id. Required when `report=true`; it must belong to `arcade`.
        report_message:
          type: string
          maxLength: 1200
    CreateSupportFeedbackRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 13000
    CreateSupportFeedbackMultipartRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 13000
        photos:
          type: array
          maxItems: 3
          description: Images only, at most 15000000 bytes per image. Server verifies file contents.
          items:
            type: string
            format: binary
    CreateArcadeRequestAdminRequest:
      type: object
