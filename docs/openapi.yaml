      description: &gameToolsAccessDescription |
        Requires an authenticated user with `developer` or `moderator` access, or a `supporter` or `founding_supporter` role at level 30 or above.
      security:
        - nativeBearer: []
      parameters:
        - $ref: '#/components/parameters/CountryQuery'
        - name: game_series
          in: query
          description: Repeat the query param or pass comma-separated series ids.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: game_series_version
          in: query
          description: Repeat the query param or pass comma-separated version ids.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
      responses:
        '200':
          description: Matching machine rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArcadeGameItem'
              example:
                - id: atom_123
                  arcade:
                    id: arcade_123
                    country: KR
                    name: Seoul Arcade
                    address: 123 Seoul Road
                    location:
                      lat: 37.5665
                      lon: 126.978
                  game: game_123
                  cabinet:
                    id: cabinet_gold
                    en: CHUNITHM GOLD
                    kr: 츄니즘 골드
                    jp: チュウニズム ゴールド
                  location: 2F
                  quantity: 1
                  price:
                    currency: KRW
                    type: custom
                    list:
                      - value: 1000
                    accept: []
                  tag:
                    - category: 기타
                      quantity: 1
                      note: ok
                  version:
                    id: version_123
                    series: series_123
                    released_on: "2025-06-01"
                    en: Filter Version
                    kr: Filter Version
                    jp: Filter Version
                    price_default: {}
                  series:
                    id: series_123
                    seriesNumber: 7
                    en: Filter Series
                    kr: Filter Series
                    jp: Filter Series
                    en_short: Filter Series
                    kr_short: Filter Series
                    jp_short: Filter Series
                    manufacturer: manufacturer_123
        '502':
          description: Failed to load matching machines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /native/moderation/game/catalog:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /moderation/game/catalog. Responses are no-store.
    get:
      tags: [Moderator]
      summary: Read protected game catalog management data
      description: Active developer or moderator, or an active supporter or founding supporter at level 30 or above. Historical version aliases (non-empty alias_of) are omitted from the versions list without deleting their records or historical references. Cabinets are ordered by the earliest release date among active compatible versions, newest first.
      security:
        - nativeBearer: []
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [en-US, ko-KR, ja-JP]
      responses:
        '200':
          description: Full catalog management view.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Moderator]
      summary: Create a catalog item
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Created item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Duplicate or conflicting operation. }
    put:
      tags: [Moderator]
      summary: Update a catalog item with optimistic concurrency
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Updated item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Stale revision or dependency conflict. }
    delete:
      tags: [Moderator]
      summary: Archive a catalog item
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Archived item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'
        '409': { description: Item is referenced by active data. }

  /native/moderation/game/catalog/restore:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /moderation/game/catalog/restore. Responses are no-store.
    post:
      tags: [Moderator]
      summary: Restore an archived catalog item
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCatalogMutationRequest'
      responses:
        '200':
          description: Restored item and immutable audit change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCatalogMutationResponse'

  /native/moderation/game/catalog/compatibilities:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /moderation/game/catalog/compatibilities. Responses are no-store.
    post:
