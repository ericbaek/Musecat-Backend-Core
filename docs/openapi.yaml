          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PocketBaseAuthError'
        '403':
          description: Active developer or moderator access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: List failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Support]
      summary: /support_feedback
      description: Default per-client-IP limit is 10 requests per 600 seconds, shared by anonymous and authenticated users. With no official account, arcade-scoped inquiries accept guests through moderator fallback. With a current official account, missing configuration defaults to OFF and disabled mode rejects creation with 409 INQUIRY_DISABLED; loginRequired rejects anonymous submissions with 401 LOGIN_REQUIRED; external mode rejects creation with 409 INQUIRY_EXTERNAL. Private arcades remain inaccessible to guests. Guest submissions preserve existing initial-receipt semantics and do not grant authenticated conversation access. Operator-configured limits and PocketBase exemptions may override the defaults. Accepts at most 3 images of 15000000 bytes each; the total encoded body is limited to 46048576 bytes (45 MB of photos plus 1 MiB of form overhead).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportFeedbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSupportFeedbackMultipartRequest'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '200':
          description: Created support feedback record.
          content:
            application/json:
              schema:
                type: object
                required: [id, message, status, createdBy, photos, created, updated]
                properties:
                  id:
                    type: string
                  message:
                    type: string
                  status:
                    type: string
                  createdBy:
                    type: string
                  created:
                    type: string
                  updated:
                    type: string
                  photos:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': {description: LOGIN_REQUIRED for a scoped inquiry requiring sign-in, or inactive account.}
        '404': {description: Missing or inaccessible arcade.}
        '409': {description: INQUIRY_DISABLED for OFF or unconfigured official arcades; INQUIRY_EXTERNAL for official arcades using external contact.}
        '413':
          description: File exceeds 15000000 bytes or encoded request body exceeds 46048576 bytes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '429':
          description: Client IP request limit exceeded, including authenticated requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PocketBaseAuthError'}
        '502':
          description: Create failure.
    put:
