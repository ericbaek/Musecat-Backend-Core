      description: |-
        Requires account:access. Same payload, response and domain checks as POST /arcade/location-verification. Management operations are excluded even for staff.

        Stores a one-time location proof tied to the arcade's current basic-information revision. Editing basic information changes that revision and invalidates the proof. This endpoint does not create a Passport visit or award XP.
      security:
