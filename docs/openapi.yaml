  /native/arcade/report-settings:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/report-settings. Responses are no-store.
    get:
      tags: [Arcade Mutations]
      summary: GET /arcade/report-settings
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{nativeBearer: []}]
      parameters:
        - in: query
          name: arcade
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeReportSettings'
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}
    put:
      tags: [Arcade Mutations]
      summary: PUT /arcade/report-settings
      description: Active developer/moderator may manage any arcade including private/closed arcades. Official accounts require arcade_owner and the arcade in owns. Subscription deletion only removes the caller's device even after ownership loss. Requests are limited to 16 KiB (4 KiB for DELETE).
      security: [{nativeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArcadeReportSettings'
                - type: object
                  required: [arcade]
                  properties:
                    arcade: {type: string}
      responses:
        '200':
          description: Settings returned or subscription saved/removed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArcadeReportSettings'
        '400': {description: Invalid settings or subscription. External mode requires a contact. Push endpoints must belong to supported browser push services (including fcm.googleapis.com and Chromium staging jmt17.google.com).}
        '401': {description: Authentication required.}
        '403': {description: Active account or arcade management access required.}
        '404': {description: Arcade not found.}
        '413': {description: Encoded request exceeds its limit.}

  /native/arcade/inquiry-settings:
    description: Active opaque native session required; same domain handlers, fields, ownership and role policy as /arcade/inquiry-settings. Responses are no-store.
    put:
      tags: [Arcade]
      summary: Configure arcade inquiry destination
      description: Current official owners assigned to this arcade and strict developer/moderator accounts only. Independent of fault-report settings. External mode requires an HTTP(S) URL or phone. Missing/invalid saved mode defaults to disabled with configured false. Explicit modes return derived configured true; client configured is ignored and never persisted. Disabled requires no contact. Existing conversations remain readable and replyable. No XP or arcade changelog.
      security:
        - nativeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arcade, mode]
              properties:
                arcade: {type: string}
                mode: {type: string, enum: [internal, external, disabled]}
                loginRequired: {type: boolean, default: false, description: Require an authenticated account for new internal arcade inquiries while a current official account exists.}
                contactType: {type: string, enum: [url, phone]}
                contactValue: {type: string, maxLength: 2048}
                guide: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Saved settings with derived configured true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquirySettings'
        '400': {description: Invalid or missing external contact.}
        '401': {description: Authentication required.}
        '403': {description: Not an assigned official owner or strict staff.}
        '404': {description: Arcade not found.}

  /native/arcade/report-subscription/status:
