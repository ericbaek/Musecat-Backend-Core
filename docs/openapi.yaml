        separates current old-version targets from current to-version targets,
        so the updated list includes machines already on the target version
        even when they were not updated through this campaign. It includes
        newest-first report logs with the user, arcade, game, reaction,
        location-verification status, and report time, plus the latest
        still_old report. Updated targets can be reverted by a new still_old
        report for seven days after the update. Only currently public/open
        arcades are included.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign progress, updated targets, and report log.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CampaignDetailResponse"
        '400':
          description: Missing campaign id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Campaign is not active or was not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Campaign detail could not be loaded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid, expired, revoked or wrong-kind delegated access token.
        '403':
          description: Missing approved scope or existing domain permission denied.
        '429':
          description: Rate limited.
      security:
      - delegatedOAuth:
        - campaign:read
  /developer/v1/arcade/campaigns:
    get:
      tags:
      - Delegated resources
      summary: GET /developer/v1/arcade/campaigns
      description: Delegated access requires campaign:read. Existing domain visibility,
        role, ownership, location and XP rules still apply. Returns campaign prompts
        for the requested public/open arcade to an authenticated active user. Includes
        current from_version machines and current to_version machines with an updated
        report for the same campaign and arcade/game created less than seven days ago.
        Already-updated machines without a campaign update report and reports aged seven
        days or more are excluded. Each item includes current target status and report
        history; expiry leaves game state and campaign overview history intact.
      security:
      - delegatedOAuth:
        - campaign:read
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
